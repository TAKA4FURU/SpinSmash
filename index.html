      useBall(b);
      b.stuck = null;
      const dir = b.stuckDir > 0 ? 1 : -1;
      b.vx = 0; b.vy = -dir * (b.stuckSpeed || H * CFG.speed); // パドルに向かってくる向きにしてから打ち返す
      releasing = true; hitPaddle(dir); releasing = false;
    }
    if (balls.length) useBall(balls[0]);
  }
  function onUp(e) {
    fingers = e.targetTouches ? e.targetTouches.length : 0;
    fingerDown = fingers > 0;
    if (fingers < 2) releaseStuck();         // 2本指でなくなったら、吸着中のボールを弾く
    if (fingers > 0) startDrag(e);           // 残った指で、パドルが飛ばないよう続けて操作
  }
  function onMove(e) {
    e.preventDefault();
    if (paused) return;
    moveDrag(e);
  }
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  cv.addEventListener('touchend', onUp);
  cv.addEventListener('touchcancel', onUp);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', e => { if (e.buttons) onMove(e); });
  window.addEventListener('resize', resize);

  // ---- 物理の補助 ----
  const speedOf = () => Math.hypot(ball.vx, ball.vy);

  function setSpeed(s) {
    const cur = speedOf() || 1;
    ball.vx *= s / cur; ball.vy *= s / cur;
  }

  function clampSpin() {
    const m = H * CFG.maxSpin;
    ball.spin = Math.max(-m, Math.min(m, ball.spin));
  }

  function keepVertical(preferUp) {
    const s = speedOf();
    const minVy = s * CFG.minVert;
    if (Math.abs(ball.vy) < minVy) {
      const dir = ball.vy !== 0 ? Math.sign(ball.vy) : (preferUp ? -1 : 1);
      ball.vy = dir * minVy;
      ball.vx = (Math.sign(ball.vx) || 1) * Math.sqrt(s * s - minVy * minVy);
    }
  }

  // 面との摩擦：回転 ⇄ 接線方向の速度 を交換する
  function friction(nx, ny, surfVel, grip, kick) {
    const tx = -ny, ty = nx;
    const vt = ball.vx * tx + ball.vy * ty - surfVel;
    const slip = vt - ball.spin;
    ball.vx -= kick * slip * tx;
    ball.vy -= kick * slip * ty;
    ball.spin += grip * slip;
    clampSpin();
  }

  // 当たりの強さ（0〜1）：面に垂直な速さで決める
  const powerOf = (dot) => Math.min(1, Math.abs(dot) / (H * 1.2));

  // ---- 壁ゆらし（iPhoneを振ると周りの壁が揺れる）----
  // 揺れている間に壁に当たったボールは、回転がかかって向きも少し変わる
  const SHAKE_TIME = 0.35;
  let shakeT = 0, shakeDir = 1, shakeId = 0, shakeCool = 0;
  function triggerShake(dir) {
    if (state !== 'play' || shakeCool > 0) return;
    shakeT = SHAKE_TIME; shakeCool = 0.45; shakeId++;
    shakeDir = dir || (Math.random() < 0.5 ? -1 : 1);
    SFX.shake();
  }
  function shakeKick(nx, ny) {
    if (shakeT <= 0 || ball.shk === shakeId) return;
    ball.shk = shakeId; // 1回の揺れで1ボール1回だけ
    const d = shakeDir, s = speedOf();
    // 回転MAX
    ball.spin = d * H * CFG.maxSpin;
    // 向きを約20°ずらす（壁から離れる向きは保つ）
    const a = -d * 0.35 * (ny ? 1 : nx), c = Math.cos(a), sn = Math.sin(a);
    const vx = ball.vx * c - ball.vy * sn, vy = ball.vx * sn + ball.vy * c;
    if (vx * nx + vy * ny > 0) { ball.vx = vx; ball.vy = vy; }
    // 振り上げMAX扱い：最高速度まで上げ、強打と同じく時間とともに元の速さへ戻る
    const top2 = H * CFG.maxSpeed;
    if (top2 > s * 1.01) {
      setSpeed(top2);
      ball.extra = (ball.extra || 0) + (top2 - s);
      if (s < H * CFG.beamSpeed && top2 >= H * CFG.beamSpeed) SFX.beamOn();
    } else setSpeed(s);
    keepVertical(false);
    SFX.shakeHit();
    SFX.powerUp(1, 1);
    if (ball === balls[0] || Math.random() < 0.1) addPopup(ball.x, ball.y + (ny ? 18 : 0), 'SHAKE!', '#7fdcff');
  }
  let motionAsked = false;
  function askMotion() {
    if (motionAsked) return; motionAsked = true;
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().catch(() => {});
      }
    } catch (e) {}
  }
  addEventListener('devicemotion', e => {
    const a = e.acceleration;
    if (!a || a.x == null) return;
    const m = Math.hypot(a.x, a.y || 0, a.z || 0);
    if (m > 13) triggerShake(Math.abs(a.x) > 3 ? Math.sign(a.x) : 0);
  });

  function bounce(nx, ny, sound, row) {
    const s = speedOf();
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot >= 0) return;
    if (!sound) SFX.wall(powerOf(dot));
    ball.vx -= 2 * dot * nx;
    ball.vy -= 2 * dot * ny;
    // こおり：壁やブロックで回転が減らない（滑る）
    friction(nx, ny, 0, themeOf(stage).key === 'ice' ? 0 : CFG.wallGrip, CFG.wallKick);
    setSpeed(s);
    keepVertical(ny < 0);
  }

  // ---- 更新 ----
  function spawnParticles(b, nX, nY, amount) {
    const n = Math.round(7 * CFG.fx * (amount == null ? 1 : amount));
    for (let i = 0; i < n && particles.length < 90; i++) {
      const sp = H * (0.25 + Math.random() * 0.5);
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: b.x + Math.random() * b.w, y: b.y + Math.random() * b.h,
        vx: Math.cos(a) * sp * 0.6 - nX * sp * 0.3 + ball.vx * 0.15,
        vy: Math.sin(a) * sp * 0.6 - nY * sp * 0.3,
        life: 0.4 + Math.random() * 0.3, max: 0.7,
        s: 2 + Math.random() * 4, color: b.color,
      });
    }
  }

  // ビーム用の軌跡を記録（近すぎる点は間引く）
  function recordTrail() {
    if (!ball.beam) return; // ビームを描くのは先頭12個だけ
    const n = trail.length;
    if (n >= 2) {
      const dx = ball.x - trail[n - 2], dy = ball.y - trail[n - 1];
      if (dx * dx + dy * dy < 16) return;
    }
    trail.push(ball.x, ball.y);
    if (trail.length > 600) trail.splice(0, trail.length - 600);
  }

  function explode(x, y) {
    const cols = ['#ff4d1a', '#ff9f1a', '#ffd23f', '#ffffff'];
    const n = Math.round(28 * Math.max(CFG.fx, 0.3));
    for (let i = 0; i < n && particles.length < 140; i++) {
      const a = -Math.PI * Math.random();           // 上半分へ飛び散る
      const sp = H * (0.4 + Math.random() * 0.9);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.5, max: 1, s: 3 + Math.random() * 5, color: cols[i % cols.length] });
    }
  }

  function addDamageText(b, dmg, kill) {
    if (CFG.fx <= 0) return;
    if (dmgTexts.length > 30) dmgTexts.shift();
    dmgTexts.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, text: kill ? `${dmg}!` : `${dmg}`, kill, life: 0.7 });
  }

  function updateFx(dt) {
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    for (const p of popups) { p.y -= H * 0.05 * dt; p.life -= dt; }
    if (popups.length) popups = popups.filter(p => p.life > 0);
    for (const z of zaps) z.life -= dt;
    if (zaps.length) zaps = zaps.filter(z => z.life > 0);
    for (const t of dmgTexts) { t.y -= H * 0.06 * dt; t.life -= dt; }
    if (dmgTexts.length) dmgTexts = dmgTexts.filter(t => t.life > 0);
    for (const b of bricks) if (b.hitT > 0) b.hitT = Math.max(0, b.hitT - dt * 8);
    paddleGlow *= Math.exp(-dt * 7);
    rallyPop *= Math.exp(-dt * 6);
    for (const p of particles) {
      p.vy += H * 1.6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
    }
    if (particles.length) particles = particles.filter(p => p.life > 0);
    if (state === 'play') {
      // 記録は step() 内で行う
    } else for (const b of balls) if (b.trail) b.trail.length = 0;
  }

  function update(dt) {
    updateBg(dt);
    if (state === 'title') return;
    if (shakeT > 0) shakeT -= dt;
    if (shakeCool > 0) shakeCool -= dt;
    updateFx(dt);
    if (state === 'stageClear') {
      stageTimer -= dt;
      if (stageTimer <= 0) {
        if (stage >= STAGES) { state = 'allClear'; saveScore(); SFX.music.jingle('allclear'); }
        else loadStage(stage + 1);
      }
      return;
    }
    moveBricks(dt);
    gimmicks(dt);
    updateItems(dt);
    updateFever(dt);
    updateBoss(dt);
    updateShots(dt);
    // WIDE中は広がり、しびれ中は縮んで動きが鈍る
    const wantW = W * CFG.paddleW * objK() * WIDE_MULT[eff.wide > 0 ? eff.wideLv : 0] * (eff.stun > 0 ? 0.7 : 1);
    paddle.w += (wantW - paddle.w) * Math.min(1, dt * 10);
    const tx = Math.min(Math.max(targetX, -paddle.w / 2), W + paddle.w / 2);
    paddle.x = eff.stun > 0 ? paddle.x + (tx - paddle.x) * Math.min(1, dt * 4) : tx;
    const instVx = (paddle.x - paddle.prevX) / Math.max(dt, 1e-3);
    paddle.vx += (instVx - paddle.vx) * 0.5;
    paddle.prevX = paddle.x;
    paddle.frameStartY = paddle.y;
    if (CFG.vMove) {
      const ty = Math.max(paddle.minY, Math.min(paddle.baseY, targetY));
      paddle.y = eff.stun > 0 ? paddle.y + (ty - paddle.y) * Math.min(1, dt * 4) : ty;
    }
    else paddle.y = paddle.baseY;
    const instVy = (paddle.y - paddle.frameStartY) / Math.max(dt, 1e-3);
    paddle.vy += (instVy - paddle.vy) * 0.5;
    recordSwing();

    if (state === 'ready') {
      ball.x = Math.max(ball.r, Math.min(W - ball.r, paddle.x)); // パドルが画面外でもボールは画面内
      ball.y = paddle.y - ball.r - 1;
      return;
    }
    if (state !== 'play') return;

    const beams = beamLimit();
    for (let i = 0; i < balls.length; i++) balls[i].beam = i < beams;
    for (const b of balls.slice()) {
      if (b.dead || state !== 'play') continue;
      useBall(b);
      if (b.stuck != null) { // マグネットで吸着中：パドルと一緒に動く
        b.x = Math.max(b.r, Math.min(W - b.r, paddle.x + b.stuck));
        b.y = b.stuckDir > 0 ? paddle.y + paddle.h + b.r : paddle.y - b.r;
        continue;
      }
      const steps = Math.max(1, Math.ceil(speedOf() * dt / (ball.r * 0.8)));
      const sdt = dt / steps;
      for (let i = 0; i < steps && state === 'play' && !b.dead && b.stuck == null; i++) step(sdt);
    }
    if (state === 'play') balls = balls.filter(b => !b.dead);
    if (balls.length) useBall(balls[0]);
  }

  // dir = -1：表で上へ打つ / +1：裏で下へ打つ（自爆の危険）
  function hitPaddle(dir) {
    // マグネット：指を置いている間は表でも裏でも、当たったボールが吸着（指を離すと弾く）
    if (eff.magnet > 0 && fingers >= 2 && !releasing) { // 2本指の時だけ吸着
      if (ball.extra) { setSpeed(Math.max(speedOf() - ball.extra, H * 0.05)); ball.extra = 0; }
      ball.stuckSpeed = Math.max(speedOf(), H * CFG.speed);
      ball.stuck = Math.max(-paddle.w / 2, Math.min(paddle.w / 2, ball.x - paddle.x));
      ball.stuckDir = dir; // -1=表（上） 1=裏（下）
      ball.vx = 0; ball.vy = 0;
      ball.y = dir < 0 ? paddle.y - ball.r : paddle.y + paddle.h + ball.r;
      SFX.magnet();
      return;
    }
    // 前の強打で上乗せされていた分は外して計算
    if (ball.extra) { setSpeed(Math.max(speedOf() - ball.extra, H * 0.05)); ball.extra = 0; }
    const drive = Math.max(0, dir * paddle.vy); // 打つ向きへ振る速さ（px/秒）
    const power = Math.min(1, powerOf(ball.vy - paddle.vy) + Math.min(1, Math.abs(paddle.vx) / (W * 4)) * 0.5 + Math.min(1, drive / (H * 2)) * 0.6);
    const spin0 = ball.spin;
    const hit = (ball.x - paddle.x) / (paddle.w / 2);
    const ang = Math.max(-1, Math.min(1, hit)) * 60 * Math.PI / 180;
    const sp = Math.min(Math.max(speedOf(), H * 0.05), H * CFG.maxSpeed);
    ball.vx = Math.sin(ang) * sp;
    ball.vy = dir * Math.cos(ang) * sp;
    // 面の接線方向へのパドル速度で擦る（裏面は接線の向きが逆）
    friction(0, dir, paddle.vx * -dir, CFG.paddleGrip, CFG.paddlePush);
    setSpeed(sp);
    if (ball.vy * dir < 0) ball.vy = -ball.vy;
    keepVertical(dir < 0);
    ball.y = dir < 0 ? paddle.y - ball.r : paddle.y + paddle.h + ball.r;
    ball.selfHit = dir > 0;
    // 回転の強さ：かけた量と打球後の回転の大きい方
    const maxS = H * Math.max(CFG.maxSpin, 0.01);
    const spinAmt = Math.min(1, Math.max(Math.abs(ball.spin - spin0), Math.abs(ball.spin)) / maxS);
    // 打つ向きと逆へ振りながら打つと減速（速くなりすぎた時の救済）。少しずつ下がる
    const away = Math.max(0, -dir * paddle.vy);
    let braked = 0;
    if (CFG.vMove && away > H * 0.15 && CFG.slowPower > 0) {
      const f = Math.min(1, away / (H * 1.5));
      const before = speedOf();
      const after = Math.max(H * CFG.speed, before * (1 - CFG.slowPower * f));
      if (after < before * 0.995) { setSpeed(after); braked = f; }
    }
    // 回転をかけるほど加速（減速した打球では加速しない）
    if (!braked && spinAmt > 0.05 && CFG.spinAccel > 1) {
      const before = speedOf();
      const mul = 1 + (CFG.spinAccel - 1) * spinAmt; // 最大回転で spinAccel 倍
      const after = Math.min(before * mul, H * CFG.maxSpeed);
      if (after > before * 1.002) {
        setSpeed(after);
        const level = Math.min(1, after / (H * Math.max(CFG.maxSpeed, 0.1)));
        SFX.powerUp((after / before - 1) / (CFG.spinAccel - 1), level);
        if (before < H * CFG.beamSpeed && after >= H * CFG.beamSpeed) SFX.beamOn();
      }
    }
    // 振り上げ（裏なら振り下ろし）強打：その打球だけ速くなり、時間とともに元に戻る
    if (CFG.vMove && drive > H * 0.2 && CFG.liftPower > 0) {
      const before = speedOf();
      const after = Math.min(before + drive * 0.5 * CFG.liftPower, H * CFG.maxSpeed);
      if (after > before * 1.01) {
        setSpeed(after);
        ball.extra = after - before;
        SFX.powerUp(Math.min(1, ball.extra / (H * 0.8)), Math.min(1, after / (H * CFG.maxSpeed)));
        if (before < H * CFG.beamSpeed && after >= H * CFG.beamSpeed) SFX.beamOn();
      }
    }
    // ジャストショット
    if (isPerfect()) {
      setSpeed(Math.min(speedOf() * 1.08, H * CFG.maxSpeed));
      ball.spin = Math.max(-H * CFG.maxSpin, Math.min(H * CFG.maxSpin, ball.spin * 1.3));
      score += 100 * stage;
      addPopup(ball.x, paddle.y - 34, 'PERFECT!', '#fff27a');
      SFX.perfect();
    }
    rally++; chain = 0;
    bestRally = Math.max(bestRally, rally);
    if (rally % 5 === 0) addPopup(W / 2, H * 0.55, `x${rallyMult().toFixed(1)}`, '#ffd23f');
    SFX.paddle(power, spinAmt, rally);
    if (braked) SFX.powerDown(braked);
    if (rally % 5 === 0) SFX.rallyUp(rally);
    paddleGlow = 1;
    rallyPop = 1;
  }

  function step(dt) {
    // 空中のカーブ
    const s = speedOf();
    const a = CFG.curve * ball.spin * (themeOf(stage).key === 'ice' ? 1.5 : 1); // こおり：よく曲がる
    applyCurrents(dt);
    const vx0 = ball.vx, vy0 = ball.vy;
    ball.vx += (-vy0 / s) * a * dt;
    ball.vy += ( vx0 / s) * a * dt;
    setSpeed(s);

    ball.spin *= Math.exp(-CFG.decay * dt);
    // 強打の上乗せ分を少しずつ戻す
    if (ball.extra > 0) {
      const ne = ball.extra * Math.exp(-CFG.liftDecay * dt);
      setSpeed(Math.max(speedOf() - (ball.extra - ne), H * 0.05));
      ball.extra = ne < H * 0.002 ? 0 : ne;
    }
    clampSpin();
    ball.rot += ball.spin / ball.r * dt;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    recordTrail();

    // 壁
    if (ball.x < ball.r)       { ball.x = ball.r;       bounce(1, 0); shakeKick(1, 0); }
    if (ball.x > W - ball.r)   { ball.x = W - ball.r;   bounce(-1, 0); shakeKick(-1, 0); }
    if (ball.y < top + ball.r) { ball.y = top + ball.r; bounce(0, 1); ball.selfHit = false; shakeKick(0, 1); }

    // パドル
    const px = paddle.x - paddle.w / 2;
    // パドル：表（上面）で上へ、裏（下面）で下へ打ち返す
    // パドルが動いた分も当たり判定に含める（すり抜け防止）
    const py0 = paddle.frameStartY ?? paddle.y;
    const inX = ball.x >= px - ball.r && ball.x <= px + paddle.w + ball.r;
    const fromAbove = ball.y < py0 + paddle.h / 2; // フレーム開始時のパドルより上にいたか
    if (inX && fromAbove && ball.vy - paddle.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= Math.max(paddle.y, py0) + paddle.h) {
      hitPaddle(-1);
    } else if (inX && !fromAbove && ball.vy - paddle.vy < 0 &&
        ball.y - ball.r <= paddle.y + paddle.h && ball.y + ball.r >= Math.min(paddle.y, py0)) {
      hitPaddle(1);
    }

    // ブロック（ボールの高さにある段だけ調べる）
    const ry0 = Math.max(0, Math.floor((ball.y - ball.r - brickTop) / brickRowH));
    const ry1 = Math.min(rowsInStage - 1, Math.floor((ball.y + ball.r - brickTop) / brickRowH));
    brickLoop:
    for (let rr = ry0; rr <= ry1; rr++) {
      const row = brickGrid[rr];
      if (!row) continue;
      const off = rowOff[rr] || 0;
      const cx0 = Math.max(0, Math.floor((ball.x - ball.r - brickSide - off) / brickColW));
      const cx1 = Math.min(colsInStage - 1, Math.floor((ball.x + ball.r - brickSide - off) / brickColW));
      for (let cc = cx0; cc <= cx1; cc++) {
      const b = row[cc];
      if (!b || !b.alive) continue;
      const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      let dx = ball.x - nx, dy = ball.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 <= ball.r * ball.r) {
        let d = Math.sqrt(d2), nx2 = nx, ny2 = ny;
        if (d < 1e-6) { const o = insideOut(b.x, b.y, b.w, b.h); dx = o[0]; dy = o[1]; nx2 = o[2]; ny2 = o[3]; d = 1; }
        const nX = dx / d, nY = dy / d;
        const power = powerOf(ball.vx * nX + ball.vy * nY);
        ball.selfHit = false;
        const raw = fever > 0 ? 99999 : ballDamage();
        if (themeOf(stage).key === 'poison' && b.type === 'P') { eff.poison = 5; SFX.poisoned(); }
        const killed = damageBrick(b, raw, 'ball', power);
        if (state !== 'play') break brickLoop;
        if (killed) continue; // 倒した：跳ね返らずに貫通
        // 倒せなかった：削って跳ね返る
        ball.x = nx2 + nX * ball.r;
        ball.y = ny2 + nY * ball.r;
        bounce(nX, nY, 'brickHit', b.r);
        spawnParticles(b, nX, nY, 0.3);
        break brickLoop;
      }
      }
    }

    if (state === 'play') collideBoss();
    // ボールで弾を消せる
    for (const sh of shots) {
      if (sh.dead || sh.delay > 0) continue;
      const dx = sh.x - ball.x, dy = sh.y - ball.y, rr = ball.r + sh.size;
      if (dx * dx + dy * dy < rr * rr) {
        sh.dead = true;
        score += 20;
        SFX.shotBreak();
        for (let i = 0; i < 6 && particles.length < 140; i++) {
          const a = Math.random() * Math.PI * 2, v = H * (0.2 + Math.random() * 0.3);
          particles.push({ x: sh.x, y: sh.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35, max: 0.35, s: 2 + Math.random() * 3, color: sh.color });
        }
      }
    }

    // 下：バリアかフィーバー中は跳ね返る
    const floorY = H - safeBottom * 0.35;
    if (ball.vy > 0 && ball.y + ball.r >= floorY && (eff.barrier > 0 || fever > 0)) {
      ball.y = floorY - ball.r;
      ball.vy = -Math.abs(ball.vy);
      if (fever <= 0) { eff.barrier--; addPopup(ball.x, floorY - 20, eff.barrier > 0 ? `BARRIER! のこり${eff.barrier}` : 'BARRIER!', '#7df9ff'); }
      SFX.wall(1);
    }

    // 落下：他にボールが残っていればミスにならない（そのボールが消えるだけ）
    if (ball.y - ball.r > H) {
      if (balls.filter(b => !b.dead).length > 1) {
        ball.dead = true;
        for (let i = 0; i < 6 && particles.length < 140; i++) particles.push({ x: ball.x, y: H - 4, vx: (Math.random() - 0.5) * H * 0.4, vy: -Math.random() * H * 0.5, life: 0.4, max: 0.4, s: 3, color: '#ffffff' });
        return;
      }
      ball.dead = true;
      lives--;
      // ミス（自分で下へ打ち込んだ自爆も同じ）：ドカーン＋破片
      SFX.selfDestruct();
      explode(ball.x, H - 4);
      feverGauge = 0;
      if (lives <= 0) { state = 'over'; SFX.music.jingle('over'); eff.magnet = 0; } // 記録はタイトルへ戻る時（巻き戻しで復活できるように）
      else resetBall();
    }
  }

  // ---- ダメージ・ギミック ----
  // 今のボールのダメージ（POWで2倍、毒で半分）
  function ballDamage() {
    let d = damageAt(speedOf());
    if (eff.power > 0) d *= 2;
    if (eff.poison > 0) d *= 0.5;
    return Math.max(1, Math.round(d));
  }
  // 属性による防御（いわ・はがね）
  function armorOf() {
    const k = themeOf(stage).key;
    return k === 'rock' ? 3 : k === 'steel' ? 8 : 0;
  }
  const rallyMult = () => Math.min(4, 1 + Math.floor(rally / 5) * 0.5);

  // ブロックにダメージ。倒したら true
  function damageBrick(b, raw, source, power) {
    if (!b.alive) return false;
    // 回復で残りHPが小数になることがあるので、ダメージは切り上げて整数にする
    const dmg = Math.ceil(Math.min(Math.max(0, raw - (fever > 0 ? 0 : armorOf())), b.hp));
    b.hitT = 1;
    b.lastHit = stageTime;
    if (dmg <= 0) {
      addDamageText(b, 0, false);
      if (source === 'ball') SFX.clank();
      return false;
    }
    b.hp -= dmg;
    addDamageText(b, dmg, b.hp <= 0);
    if (b.hp > 0) {
      if (source === 'ball') SFX.brickHit(b.r, power || 0.5, 1 - b.hp / b.maxHp);
      if (source === 'ball' && themeOf(stage).key === 'electric') zap(b, dmg);
      return false;
    }
    // 倒した
    b.alive = false;
    aliveCount--;
    chain++;
    score += Math.ceil(b.maxHp * rallyMult() * (fever > 0 ? 2 : 1));
    SFX.brick(b.r, power || 0.6, chain, true);
    const s2 = speedOf() || 1;
    spawnParticles(b, -ball.vx / s2, -ball.vy / s2, 1);
    // アイテム：★ブロックは必ず、他は7%
    // アイテム：★ブロックとボス戦中は必ず。普段は残りが減るほど出やすい（最初1倍→残り0で itemBoost 倍）
    const used = bricks.length ? 1 - aliveCount / bricks.length : 0;
    const rate = CFG.itemRate / 100 * sizeTune().item * (1 + (CFG.itemBoost - 1) * used);
    if (b.type === 'I' || boss || Math.random() < rate) dropItem(b);
    const key = themeOf(stage).key;
    if (key === 'bio' && !b.revived && Math.random() < 0.35) { b.reviveT = 7; }
    if (key === 'fire' && source !== 'fire') burn(b);
    if (key === 'electric' && source === 'ball') zap(b, b.maxHp * 0.5);
    // 残りわずかになったらボス登場（残ったブロックはそのまま。アイテムも出る）
    if (!boss && !bossDone && aliveCount <= Math.floor(bricks.length * CFG.bossAt / 100)) spawnBoss();
    return true;
  }

  function stageClear() {
    if (state !== 'play') return;
    state = 'stageClear'; stageTimer = 2.6; SFX.music.jingle('clear'); SFX.music.setFever(false);
    for (const k of bricks) k.reviveT = 0;
    score += 500 * stage;
    banner = { text: 'STAGE CLEAR!', sub: `ボーナス +${500 * stage}`, color: '#fff27a', life: 2.2 };
  }

  // ほのお：倒したブロックの周り8マスに延焼ダメージ
  function burn(b) {
    SFX.burn();
    for (const n of bricks) {
      if (!n.alive || n === b) continue;
      if (Math.abs(n.r - b.r) <= 1 && Math.abs(n.c - b.c) <= 1) {
        damageBrick(n, Math.round(n.maxHp * 0.35), 'fire');
        if (state !== 'play') return;
      }
    }
  }

  // でんき：他のブロック2個に放電
  let zaps = [];
  function zap(from, amount) {
    const targets = [];
    for (let tries = 0; tries < 20 && targets.length < 2 && aliveCount > 1; tries++) {
      const k = bricks[Math.random() * bricks.length | 0];
      if (k.alive && k !== from && !targets.includes(k)) targets.push(k);
    }
    for (const t of targets) {
      zaps.push({ x0: from.x + from.w / 2, y0: from.y + from.h / 2, x1: t.x + t.w / 2, y1: t.y + t.h / 2, life: 0.18 });
      damageBrick(t, Math.round(amount * 0.5), 'zap');
      if (state !== 'play') return;
    }
    SFX.zap();
  }

  // ---- アイテム ----
  const ITEMS = [
    { id: 'wide',    label: 'WIDE',    color: '#4dd8ff', w: 22 },
    { id: 'power',   label: 'POW',     color: '#ff4d6d', w: 18 },
    { id: 'spin',    label: 'SPIN',    color: '#c77dff', w: 18 },
    { id: 'slow',    label: 'SLOW',    color: '#7cff8a', w: 14 },
    { id: 'barrier', label: 'BARRIER', color: '#7df9ff', w: 18 },
    { id: 'oneup',   label: '1UP',     color: '#ffd23f', w: 10 },
    { id: 'multi2',  label: '×2',      color: '#ffe66d', w: 14, mult: 2 },
    { id: 'multi3',  label: '×3',      color: '#ffb84d', w: 9,  mult: 3 },
    { id: 'multi5',  label: '×5',      color: '#ff8c42', w: 5,  mult: 5 },
    { id: 'multi10', label: '×10',     color: '#ff5e5e', w: 2,  mult: 10 },
    { id: 'magnet',  label: 'MAG',     color: '#b388ff', w: 10 },
    { id: 'ghost',   label: '透明',    color: '#3a3f55', w: 8, text: '#9aa0b8' }, // ハズレ
  ];
  let items = [];
  const eff = { wide: 0, wideLv: 0, power: 0, poison: 0, barrier: 0, stun: 0, safe: 0, ghost: 0, magnet: 0 };
  const WIDE_MULT = [1, 1.5, 2, 2.5]; // WIDEを重ねて取ると3段階まで広がる // アイテム・毒の効果時間
  function dropItem(b) {
    // ボールが上限なら、増えるアイテムは出さない
    const pool = balls.length >= CFG.maxBalls ? ITEMS.filter(x => !x.mult) : ITEMS;
    let r = Math.random() * pool.reduce((a, it) => a + it.w, 0), it = pool[0];
    for (const x of pool) { r -= x.w; if (r <= 0) { it = x; break; } }
    items.push({ ...it, x: b.x + b.w / 2, y: b.y + b.h / 2, vy: H * 0.22 });
  }
  function updateItems(dt) {
    for (const it of items) it.y += it.vy * dt;
    const pw = paddle.w, ph = paddle.h;
    items = items.filter(it => {
      if (it.y > H + 20) return false;
      const iw = W * 0.13, ih = 16;
      if (Math.abs(it.x - paddle.x) < (pw + iw) / 2 && Math.abs(it.y - (paddle.y + ph / 2)) < (ph + ih) / 2) {
        applyItem(it);
        return false;
      }
      return true;
    });
    for (const k of ['wide', 'power', 'poison', 'ghost']) if (eff[k] > 0) eff[k] = Math.max(0, eff[k] - dt);
    if (eff.wide <= 0) eff.wideLv = 0;
  }
  function applyItem(it) {
    if (it.id === 'wide') { eff.wideLv = Math.min(3, eff.wideLv + 1); eff.wide = 15; } // 取るたびに一段広がり、時間も15秒に戻る
    if (it.id === 'power') eff.power = 12;
    if (it.id === 'barrier') eff.barrier = Math.min(99, eff.barrier + 1); // 取るたびに増える
    if (it.id === 'magnet') eff.magnet = 1;  // 次のミスまで
    if (it.id === 'ghost') eff.ghost = 6;    // ハズレ：6秒間パドルが見えない
    if (state === 'play' && (it.id === 'spin' || it.id === 'slow')) {
      for (const b of balls) {
        if (b.stuck != null) continue;
        useBall(b);
        const s0 = speedOf();
        if (it.id === 'spin') { b.spin = (Math.sign(b.spin) || 1) * H * CFG.maxSpin; setSpeed(Math.min(s0 * 1.15, H * CFG.maxSpeed)); }
        else setSpeed(Math.max(H * CFG.speed, s0 * 0.75));
      }
      useBall(balls[0]);
    }
    if (it.mult) multiplyBalls(it.mult);
    if (it.id === 'oneup') { lives = Math.min(99, lives + 1); SFX.oneUp(); }
    else if (it.id === 'ghost') SFX.ghost();
    else SFX.item();
    addPopup(it.x, paddle.y - 24, it.label === '1UP' ? '1UP!' : it.label, it.color);
    score += 50;
  }

  // ボールを増やす：今あるボールそれぞれを k 倍に（少しずつ違う向きへ）
  function multiplyBalls(k) {
    if (state === 'ready') launch();
    if (state !== 'play') return;
    const add = [];
    for (const b of balls) {
      if (b.dead) continue;
      const sp = Math.hypot(b.vx, b.vy), ang = Math.atan2(b.vy, b.vx);
      for (let i = 1; i < k; i++) {
        if (balls.length + add.length >= CFG.maxBalls) break; // 上限を超えては増えない
        const nb = { ...b, trail: [] };
        if (b.stuck != null) { nb.stuck = Math.max(-paddle.w / 2, Math.min(paddle.w / 2, b.stuck + (Math.random() - 0.5) * paddle.w * 0.6)); }
        else {
          const a = ang + (Math.random() - 0.5) * 1.2;
          nb.vx = Math.cos(a) * sp; nb.vy = Math.sin(a) * sp;
          if (Math.abs(nb.vy) < sp * 0.3) nb.vy = Math.sign(b.vy || -1) * sp * 0.3;
        }
        add.push(nb);
      }
    }
    balls.push(...add);
  }

  // ---- 属性ギミック（毎フレーム） ----
  let windT = 0, windDir = 1, flowDir = 1;
  function gimmicks(dt) {
    const key = themeOf(stage).key;
    // くさ・せいぶつ：削れたブロックが回復（最後に当てて1秒後から）
    const heal = key === 'grass' ? 0.015 : key === 'bio' ? 0.03 : 0;
    for (const b of bricks) {
      if (heal && b.alive && b.hp < b.maxHp && stageTime - b.lastHit > 1) b.hp = Math.min(b.maxHp, b.hp + b.maxHp * heal * dt);
      // せいぶつ：倒したブロックが時々復活
      if (!b.alive && b.reviveT > 0) {
        b.reviveT -= dt;
        if (b.reviveT <= 0) { b.alive = true; aliveCount++; b.revived = true; b.hp = Math.round(b.maxHp * 0.5); b.hitT = 1; addPopup(b.x + b.w / 2, b.y, '復活', '#ff6f91'); }
      }
    }
    // みず：画面中央の水流（5秒ごとに向きが変わる）／ひこう：時々横風
    windT += dt;
    if (key === 'water') flowDir = Math.floor(windT / 5) % 2 ? -1 : 1;
    if (key === 'sky') windDir = Math.floor(windT / 7) % 2 ? -1 : 1;
  }
  const windOn = () => themeOf(stage).key === 'sky' && (windT % 7) > 5;   // 7秒ごとに2秒間の突風
  const inFlow = y => themeOf(stage).key === 'water' && y > H * 0.45 && y < H * 0.6;
  function applyCurrents(dt) {
    if (inFlow(ball.y)) ball.vx += flowDir * H * 0.7 * dt;
    if (windOn()) ball.vx += windDir * H * 0.9 * dt;
  }

  // ---- ジャストショット・フィーバー ----
  let swingHist = [];      // パドルの速さの履歴 [時刻, 速さ]
  let fever = 0, feverGauge = 0;
  function recordSwing() {
    const v = Math.hypot(paddle.vx, paddle.vy);
    swingHist.push([stageTime, v]);
    while (swingHist.length && stageTime - swingHist[0][0] > 0.4) swingHist.shift();
  }
  // 止めていたパドルを、当たる直前（0.25秒以内）に振り始めて打ったか
  function isPerfect() {
    const now = Math.hypot(paddle.vx, paddle.vy);
    if (now < H * 1.0) return false;
    const before = swingHist.find(([t]) => stageTime - t <= 0.3 && stageTime - t >= 0.18);
    return !!before && before[1] < H * 0.25;
  }
  function updateFever(dt) {
    if (fever > 0) { fever = Math.max(0, fever - dt); if (fever === 0) { SFX.feverEnd(); SFX.music.setFever(false); } return; }
    if (state !== 'play') return;
    const near = speedOf() >= H * CFG.maxSpeed * 0.9;
    feverGauge = Math.max(0, Math.min(1, feverGauge + (near ? dt / 3 : -dt / 6)));
    if (feverGauge >= 1) {
      fever = 8; feverGauge = 0;
      SFX.feverStart();
      SFX.music.setFever(true);
      banner = { text: 'FEVER!!', sub: '8秒間 一撃・落ちない・スコア2倍', color: '#ff7ae0', life: 1.8 };
    }
  }

  // ---- ボス ----
  // shot: n=弾数 spread=広がり(rad) speed=速さ(画面高さ/秒) aim=パドル狙い wobble=揺れ grav=重力 homing=追尾 warn=予告(秒)
  const BOSSES = {
    grass:    { name: 'フロラ・グランデ',   shot: { n: 3, spread: 0.35, speed: 0.35, size: 6,  color: '#b6ff7a' } },
    water:    { name: 'アクアジェリー',     shot: { n: 4, spread: 0.6,  speed: 0.22, size: 9,  color: '#8fd8ff', wobble: 1 } },
    fire:     { name: 'イグニス',           shot: { n: 1, spread: 0,    speed: 0.5,  size: 9,  color: '#ff7a1a', aim: true, burst: 3 } },
    electric: { name: 'ボルトクラウド',     shot: { n: 1, spread: 0,    speed: 1.3,  size: 5,  color: '#ffe14d', aim: true, warn: 0.7 } },
    sky:      { name: 'ゲイルホーク',       shot: { n: 5, spread: 0.9,  speed: 0.3,  size: 6,  color: '#e6f4ff', wobble: 1.5 } },
    rock:     { name: 'ガンセキゴーレム',   shot: { n: 2, spread: 0.5,  speed: 0.1,  size: 13, color: '#a1887f', grav: 0.9 } },
    ice:      { name: 'フロストクリスタ',   shot: { n: 3, spread: 0.25, speed: 0.6,  size: 6,  color: '#bdf3ff' } },
    poison:   { name: 'ヴェノムスライム',   shot: { n: 6, spread: 1.2,  speed: 0.25, size: 8,  color: '#9cff57', grav: 0.2 } },
    steel:    { name: 'アイアンフォート',   shot: { n: 5, spread: 0.7,  speed: 0.45, size: 5,  color: '#e0e6ea', aim: true } },
    bio:      { name: 'セルマザー',         shot: { n: 4, spread: 0.8,  speed: 0.3,  size: 8,  color: '#ff6f91', homing: 0.9 } },
  };
  let boss = null, shots = [], bossDone = false;

  function spawnBoss() {
    const key = themeOf(stage).key, last = stage === STAGES;
    const hp = Math.round((1000 + 330 * (stage - 1)) * (last ? 1.5 : 1));
    boss = { key, name: BOSSES[key].name, hp, maxHp: hp, t: 0, hitT: 0, inv: 0, fireT: 2.5, burstLeft: 0,
      w: W * (last ? 0.56 : 0.46), h: H * (last ? 0.18 : 0.15), x: W / 2, y: 0, enter: 1 };
    boss.baseY = top + 26 + boss.h / 2;
    boss.y = -boss.h;
    for (const b of bricks) b.reviveT = 0;
    banner = { text: 'WARNING', sub: boss.name, color: '#ff4d4d', life: 2.2 };
    SFX.bossAppear();
    SFX.music.stop();
    setTimeout(() => { if (boss) SFX.music.play(stage === STAGES ? 'last' : 'boss'); }, 1300); // 警報のあとボス曲
  }

  function updateBoss(dt) {
    if (!boss) return;
    const b = boss, angry = b.hp < b.maxHp * 0.5;
    b.t += dt;
    b.hitT = Math.max(0, b.hitT - dt * 5);
    b.inv = Math.max(0, b.inv - dt);
    // 秒間ダメージ上限：1秒あたり 最大HP÷最短秒数 だけ「受けられる量」がたまる（最大1秒分）
    if (b.enter <= 0) { const cap = b.maxHp / Math.max(1, CFG.bossMinSec); b.budget = Math.min(cap, (b.budget || 0) + cap * dt); }
    b.maxT = Math.max(0, (b.maxT || 0) - dt);
    if (b.enter > 0) { // 上から降りてくる
      b.enter = Math.max(0, b.enter - dt * 0.6);
      b.y = b.baseY - b.enter * (b.h + b.baseY);
      return;
    }
    const sp = (0.5 + stage * 0.04) * (angry ? 1.5 : 1) * (b.key === 'sky' ? 1.6 : b.key === 'poison' ? 0.6 : 1);
    b.x = W / 2 + Math.sin(b.t * sp) * (W / 2 - b.w / 2 - 8);
    b.y = b.baseY + Math.sin(b.t * 1.3) * (b.key === 'sky' ? 22 : 8);
    // 攻撃
    b.fireT -= dt;
    if (b.fireT <= 0) {
      const cfg = BOSSES[b.key].shot;
      if (cfg.burst && b.burstLeft <= 0) b.burstLeft = cfg.burst;
      fireShots(cfg, angry);
      if (b.burstLeft > 0) { b.burstLeft--; b.fireT = b.burstLeft > 0 ? 0.25 : nextFire(angry); }
      else b.fireT = nextFire(angry);
    }
  }
  const nextFire = angry => Math.max(1.2, 2.8 - stage * 0.12) * (angry ? 0.65 : 1) * CFG.shotInterval * (0.8 + Math.random() * 0.4);

  function fireShots(cfg, angry) {
    const b = boss, n = cfg.n + Math.round(CFG.shotExtra) + (angry ? 1 : 0) + (stage === STAGES ? 1 : 0);
    const ox = b.x, oy = b.y + b.h * 0.4;
    let base = Math.PI / 2;
    if (cfg.aim) base = Math.atan2(paddle.y - oy, paddle.x - ox);
    for (let i = 0; i < n; i++) {
      const a = base + (n > 1 ? (i / (n - 1) - 0.5) * cfg.spread * 2 : 0);
      const v = H * cfg.speed;
      shots.push({ x: cfg.warn ? paddle.x : ox + (n > 1 ? (i / (n - 1) - 0.5) * b.w * 0.5 : 0), y: oy,
        vx: cfg.warn ? 0 : Math.cos(a) * v, vy: cfg.warn ? v : Math.sin(a) * v,
        size: cfg.size, color: cfg.color, wobble: cfg.wobble || 0, grav: cfg.grav || 0, homing: cfg.homing || 0,
        delay: cfg.warn || 0, t: Math.random() * 6 });
    }
    SFX.bossShoot(b.key);
  }

  function updateShots(dt) {
    for (const s of shots) {
      if (s.delay > 0) { s.delay -= dt; continue; }
      s.t += dt;
      if (s.grav) s.vy += H * s.grav * dt;
      if (s.homing) s.vx += Math.sign(paddle.x - s.x) * H * s.homing * 0.4 * dt;
      s.x += (s.vx + (s.wobble ? Math.sin(s.t * 6) * H * 0.15 * s.wobble : 0)) * dt;
      s.y += s.vy * dt;
      // パドルに当たるとしびれる（しびれ中・しびれ後の無敵中は当たらない）
      if (eff.stun <= 0 && eff.safe <= 0 &&
          Math.abs(s.x - paddle.x) < paddle.w * COCKPIT / 2 + s.size && s.y + s.size > paddle.y && s.y - s.size < paddle.y + paddle.h) { // コックピットだけ
        s.dead = true;
        eff.stun = boss && boss.key === 'electric' ? 1.8 : 1.2;
        SFX.stunned();
        addPopup(paddle.x, paddle.y - 26, 'しびれた！', '#ff9b9b');
      }
      if (s.y > H + 30 || s.x < -40 || s.x > W + 40) s.dead = true;
    }
    if (shots.length) shots = shots.filter(s => !s.dead);
    if (eff.stun > 0) {
      eff.stun = Math.max(0, eff.stun - dt);
      if (eff.stun === 0) eff.safe = 2; // しびれが解けたら2秒間無敵
    } else if (eff.safe > 0) eff.safe = Math.max(0, eff.safe - dt);
  }

  // ボールとボスの当たり判定
  // ボールの中心が矩形の内側に入り込んだとき：いちばん近い辺から外へ押し出す
  // 戻り値 [法線x, 法線y, 押し出し先の辺上のx, y]
  const _io = [0, 0, 0, 0];
  function insideOut(x0, y0, w, h) {
    const l = ball.x - x0, r = x0 + w - ball.x, t = ball.y - y0, bt = y0 + h - ball.y;
    const m = Math.min(l, r, t, bt);
    if (m === t) { _io[0] = 0; _io[1] = -1; _io[2] = ball.x; _io[3] = y0; }
    else if (m === bt) { _io[0] = 0; _io[1] = 1; _io[2] = ball.x; _io[3] = y0 + h; }
    else if (m === l) { _io[0] = -1; _io[1] = 0; _io[2] = x0; _io[3] = ball.y; }
    else { _io[0] = 1; _io[1] = 0; _io[2] = x0 + w; _io[3] = ball.y; }
    return _io;
  }
  function collideBoss() {
    if (!boss || boss.enter > 0) return;
    const b = boss, x0 = b.x - b.w / 2, y0 = b.y - b.h / 2;
    const nx = Math.max(x0, Math.min(ball.x, x0 + b.w)), ny = Math.max(y0, Math.min(ball.y, y0 + b.h));
    let dx = ball.x - nx, dy = ball.y - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > ball.r * ball.r) return;
    let d = Math.sqrt(d2), nx2 = nx, ny2 = ny;
    if (d < 1e-6) { const o = insideOut(x0, y0, b.w, b.h); dx = o[0]; dy = o[1]; nx2 = o[2]; ny2 = o[3]; d = 1; }
    const nX = dx / d, nY = dy / d;
    ball.x = nx2 + nX * ball.r; ball.y = ny2 + nY * ball.r;
    const power = powerOf(ball.vx * nX + ball.vy * nY);
    bounce(nX, nY, 'boss');
    ball.selfHit = false;
    // フィーバー中でも一撃にはしない（上限150）
    // 連続ヒット防止の無敵時間（0.35秒）。ただし無敵中でも3回に1回はダメージが入る
    if (b.inv > 0) {
      b.invHits = (b.invHits || 0) + 1;
      if (b.invHits < 3) { SFX.wall(power); return; }
    }
    b.invHits = 0;
    b.inv = 0.35;
    const raw = fever > 0 ? Math.max(150, ballDamage()) : ballDamage();
    const want = Math.ceil(Math.min(b.hp, Math.max(0, raw - armorOf())));
    // 秒間ダメージ上限に達していたら、受けられる分だけ（ボールが多くても最短秒数はかかる）
    const dmg = Math.min(want, Math.floor(b.budget || 0));
    b.hitT = 1;
    if (want > dmg) {
      if (b.maxT <= 0) { addPopup(b.x + (Math.random() - 0.5) * b.w * 0.6, b.y + b.h * 0.6, 'MAX!', '#ff4d6d'); b.maxT = 0.25; }
      if (dmg <= 0) { SFX.bossHit(power); return; }
    }
    b.budget -= dmg;
    dmgTexts.push({ x: ball.x, y: ball.y - 10, text: dmg > 0 ? `${dmg}` : '0', kill: false, life: 0.7 });
    if (dmg <= 0) { SFX.clank(); return; }
    b.hp -= dmg;
    score += Math.ceil(dmg * rallyMult() * (fever > 0 ? 2 : 1));
    SFX.bossHit(power);
    if (b.hp <= 0) bossDefeated();
  }

  function bossDefeated() {
    const b = boss;
    SFX.bossDown();
    // 残っていたブロックも一斉に爆発（スコアは入る）
    let n = 0;
    for (const k of bricks) {
      if (!k.alive) continue;
      k.alive = false; k.reviveT = 0;
      score += Math.ceil(k.maxHp * rallyMult());
      if (n++ < 40) spawnParticles(k, 0, 1, 0.5);
    }
    aliveCount = 0;
    if (n) { SFX.burn(); addPopup(W / 2, brickBottom + 20, `残り${n}個 爆破！`, '#ff9f1a'); }
    for (let i = 0; i < 4; i++) explode(b.x + (Math.random() - 0.5) * b.w, b.y + (Math.random() - 0.5) * b.h + H * 0.05);
    score += 3000 * stage;
    addPopup(b.x, b.y, `+${3000 * stage}`, '#fff27a');
    boss = null; shots = []; bossDone = true;
    stageClear();
  }

  // ---- ボスの見た目（属性ごとのオリジナル怪物） ----
  function drawBoss() {
    if (!boss) return;
    const b = boss, t = b.t, angry = b.hp < b.maxHp * 0.5, th = themeOf(stage);
    const { x, y, w, h } = b;
    ctx.save();
    ctx.translate(x, y);
    const body = th.accent, dark = th.blocks[0];
    ctx.lineJoin = 'round';
    const P = (fn) => { ctx.beginPath(); fn(); };
    switch (b.key) {
      case 'grass': { // 巨大な花
        for (let i = 0; i < 10; i++) {
          const a = i / 10 * Math.PI * 2 + t * 0.4;
          ctx.fillStyle = i % 2 ? '#ff7eb6' : '#ffb3d1';
          P(() => ctx.ellipse(Math.cos(a) * w * 0.3, Math.sin(a) * h * 0.38, w * 0.17, h * 0.2, a, 0, Math.PI * 2)); ctx.fill();
        }
        ctx.fillStyle = '#4caf50';
        for (const s of [-1, 1]) { P(() => ctx.ellipse(s * w * 0.42, h * 0.3, w * 0.14, h * 0.12, s * 0.5, 0, Math.PI * 2)); ctx.fill(); }
        ctx.fillStyle = '#ffd23f'; P(() => ctx.arc(0, 0, h * 0.34, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'water': { // クラゲ
        ctx.strokeStyle = 'rgba(140,210,255,0.7)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        for (let i = 0; i < 7; i++) {
          const tx = (i / 6 - 0.5) * w * 0.7;
          P(() => { ctx.moveTo(tx, h * 0.1); for (let k = 1; k <= 6; k++) ctx.lineTo(tx + Math.sin(t * 3 + i + k) * 8, h * 0.1 + k * h * 0.12); }); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(94,200,255,0.85)';
        P(() => { ctx.ellipse(0, 0, w * 0.45, h * 0.5, 0, Math.PI, 0); ctx.closePath(); }); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)'; P(() => ctx.ellipse(-w * 0.15, -h * 0.25, w * 0.12, h * 0.1, -0.3, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'fire': { // 炎の魔人
        for (let i = 0; i < 7; i++) {
          const a = (i / 6 - 0.5) * 1.8, fl = 1 + Math.sin(t * 9 + i) * 0.15;
          ctx.fillStyle = i % 2 ? '#ff7a1a' : '#ffb347';
          P(() => { const bx = Math.sin(a) * w * 0.32, by = -h * 0.1;
            ctx.moveTo(bx, by - h * 0.55 * fl); ctx.quadraticCurveTo(bx + w * 0.12, by, bx, by + h * 0.3); ctx.quadraticCurveTo(bx - w * 0.12, by, bx, by - h * 0.55 * fl); }); ctx.fill();
        }
        ctx.fillStyle = '#ff4d1a'; P(() => ctx.ellipse(0, h * 0.05, w * 0.32, h * 0.42, 0, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'electric': { // 雷雲
        ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) { const bx = (i - 1) * w * 0.3; P(() => { ctx.moveTo(bx, h * 0.25); ctx.lineTo(bx + 8, h * 0.4); ctx.lineTo(bx - 4, h * 0.45); ctx.lineTo(bx + 6, h * 0.62); }); if (Math.sin(t * 7 + i * 2) > 0) ctx.stroke(); }
        ctx.fillStyle = '#3a3f66';
        for (const [cx, cy, r] of [[-0.3, 0.05, 0.3], [0, -0.1, 0.36], [0.3, 0.05, 0.3], [-0.12, 0.15, 0.3], [0.15, 0.15, 0.3]]) { P(() => ctx.arc(cx * w, cy * h, r * h * 1.1, 0, Math.PI * 2)); ctx.fill(); }
        break; }
      case 'sky': { // 巨大な鳥
        const flap = Math.sin(t * 6) * 0.5;
        ctx.fillStyle = '#e6f4ff';
        for (const s of [-1, 1]) { P(() => { ctx.moveTo(s * w * 0.1, 0); ctx.lineTo(s * w * 0.5, -h * (0.2 + flap)); ctx.lineTo(s * w * 0.42, h * 0.2); ctx.closePath(); }); ctx.fill(); }
        ctx.fillStyle = '#7fb8e6'; P(() => ctx.ellipse(0, 0, w * 0.2, h * 0.42, 0, 0, Math.PI * 2)); ctx.fill();
        ctx.fillStyle = '#ffb300'; P(() => { ctx.moveTo(-8, h * 0.2); ctx.lineTo(8, h * 0.2); ctx.lineTo(0, h * 0.38); ctx.closePath(); }); ctx.fill();
        break; }
      case 'rock': { // 岩の巨人
        ctx.fillStyle = '#8d6e63'; ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 3;
        P(() => { const pts = [[-0.48, -0.2], [-0.3, -0.5], [0.1, -0.48], [0.45, -0.3], [0.5, 0.2], [0.25, 0.5], [-0.3, 0.48], [-0.5, 0.2]]; pts.forEach(([px, py], i) => i ? ctx.lineTo(px * w, py * h) : ctx.moveTo(px * w, py * h)); ctx.closePath(); }); ctx.fill(); ctx.stroke();
        ctx.lineWidth = 2; P(() => { ctx.moveTo(-w * 0.2, -h * 0.45); ctx.lineTo(-w * 0.1, -h * 0.1); ctx.lineTo(-w * 0.25, h * 0.1); }); ctx.stroke();
        break; }
      case 'ice': { // 氷の結晶体
        ctx.fillStyle = 'rgba(189,243,255,0.9)'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + t * 0.3; P(() => { ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - 0.15) * w * 0.25, Math.sin(a - 0.15) * h * 0.4); ctx.lineTo(Math.cos(a) * w * 0.48, Math.sin(a) * h * 0.55); ctx.lineTo(Math.cos(a + 0.15) * w * 0.25, Math.sin(a + 0.15) * h * 0.4); ctx.closePath(); }); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = '#4fc3f7'; P(() => ctx.arc(0, 0, h * 0.3, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'poison': { // 毒スライム
        const sq = 1 + Math.sin(t * 3) * 0.06;
        ctx.fillStyle = '#8e24aa';
        P(() => { ctx.ellipse(0, h * 0.05, w * 0.46 * sq, h * 0.45 / sq, 0, Math.PI, 0); ctx.lineTo(w * 0.46 * sq, h * 0.35); for (let i = 6; i >= 0; i--) ctx.lineTo((i / 6 - 0.5) * w * 0.92 * sq, h * 0.35 + (i % 2 ? 10 : 0) + Math.sin(t * 4 + i) * 4); ctx.closePath(); }); ctx.fill();
        ctx.fillStyle = 'rgba(156,255,87,0.7)';
        for (let i = 0; i < 5; i++) { P(() => ctx.arc(Math.sin(i * 2.1) * w * 0.3, -h * 0.1 + Math.cos(i * 1.7) * h * 0.2, 3 + (i % 3) * 2, 0, Math.PI * 2)); ctx.fill(); }
        break; }
      case 'steel': { // 鋼の要塞
        ctx.fillStyle = '#607d8b'; ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 3;
        roundRect(-w * 0.48, -h * 0.45, w * 0.96, h * 0.9, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#37474f';
        for (const s of [-1, 1]) { roundRect(s * w * 0.36 - 10, h * 0.25, 20, h * 0.3, 4); ctx.fill(); }
        ctx.fillStyle = '#cfd8dc';
        for (let i = 0; i < 6; i++) { P(() => ctx.arc((i / 5 - 0.5) * w * 0.85, -h * 0.36, 2.5, 0, Math.PI * 2)); ctx.fill(); }
        break; }
      case 'bio': { // 巨大細胞（ラスボス）
        ctx.strokeStyle = 'rgba(180,50,90,0.9)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * Math.PI * 2 + t * 0.5;
          P(() => { ctx.moveTo(Math.cos(a) * w * 0.3, Math.sin(a) * h * 0.35); ctx.quadraticCurveTo(Math.cos(a + 0.4) * w * 0.55, Math.sin(a + 0.4) * h * 0.7 + Math.sin(t * 3 + i) * 10, Math.cos(a + 0.2) * w * 0.62, Math.sin(a + 0.2) * h * 0.75); }); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(216,27,96,0.85)'; P(() => ctx.ellipse(0, 0, w * 0.38, h * 0.45, 0, 0, Math.PI * 2)); ctx.fill();
        ctx.fillStyle = 'rgba(255,140,170,0.6)'; P(() => ctx.ellipse(0, 0, w * 0.22, h * 0.28, 0, 0, Math.PI * 2)); ctx.fill();
        break; }
    }
    // 目（ボールを追う）と口。怒ると目が赤く口がギザギザに
    const eyeY = b.key === 'water' ? -h * 0.15 : -h * 0.08, eyeDX = Math.min(w * 0.13, 26), er = Math.max(7, h * 0.12);
    const lookX = Math.max(-1, Math.min(1, (ball.x - x) / W * 3)), lookY = Math.max(-1, Math.min(1, (ball.y - y) / H * 3));
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#ffffff'; P(() => ctx.arc(s * eyeDX, eyeY, er, 0, Math.PI * 2)); ctx.fill();
      ctx.fillStyle = angry ? '#ff1744' : '#111111';
      P(() => ctx.arc(s * eyeDX + lookX * er * 0.4, eyeY + lookY * er * 0.4, er * 0.5, 0, Math.PI * 2)); ctx.fill();
      if (angry) { ctx.strokeStyle = '#111'; ctx.lineWidth = 3; P(() => { ctx.moveTo(s * (eyeDX + er), eyeY - er * 1.4); ctx.lineTo(s * (eyeDX - er * 0.6), eyeY - er * 0.8); }); ctx.stroke(); }
    }
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
    P(() => {
      const my = eyeY + er * 2.2, mw = eyeDX * 1.1;
      if (angry) { ctx.moveTo(-mw, my); for (let i = 1; i <= 6; i++) ctx.lineTo(-mw + i * mw / 3, my + (i % 2 ? 6 : 0)); }
      else { ctx.arc(0, my - 6, mw * 0.7, 0.2 * Math.PI, 0.8 * Math.PI); }
    }); ctx.stroke();
    // 被弾時に白く光る
    if (b.hitT > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,255,255,${0.35 * b.hitT})`;
      P(() => ctx.ellipse(0, 0, w * 0.5, h * 0.55, 0, 0, Math.PI * 2)); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  function drawShots() {
    for (const s of shots) {
      if (s.delay > 0) { // 予告線
        ctx.strokeStyle = `rgba(255,225,77,${0.25 + 0.35 * Math.abs(Math.sin(s.delay * 20))})`;
        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, H); ctx.stroke(); ctx.setLineDash([]);
        continue;
      }
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  function drawBossBar() {
    if (!boss || boss.enter > 0.5) return;
    const y = top + 8, w = W - 20;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(10, y, w, 8);
    ctx.fillStyle = boss.hp < boss.maxHp * 0.5 ? '#ff1744' : '#ff9100';
    ctx.fillRect(10, y, w * boss.hp / boss.maxHp, 8);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px -apple-system, "Hiragino Sans", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(boss.name + (stage === STAGES ? '（ラスボス）' : ''), 12, y + 10);
  }

  // ちょっとした文字表示（アイテム名・PERFECTなど）
  let popups = [];
  function addPopup(x, y, text, color) {
    popups.push({ x, y, text, color, life: 0.9 });
    if (popups.length > 12) popups.shift();
  }

  // ---- 描画 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- ビーム ----
  // 速度 → 色と長さ（赤→黄→青→紫→ピンク）／回転 → 太さと巻き付く稲妻の量
  const BEAM_COLORS = [[255, 50, 40], [255, 215, 30], [40, 140, 255], [165, 70, 255], [255, 80, 200]];
  function beamColor(t) {
    const x = Math.max(0, Math.min(1, t)) * (BEAM_COLORS.length - 1);
    const i = Math.min(Math.floor(x), BEAM_COLORS.length - 2), f = x - i;
    const a = BEAM_COLORS[i], b = BEAM_COLORS[i + 1];
    return [0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * f));
  }

  // 先頭（ボール）から指定の長さだけ軌跡をさかのぼった折れ線
  function beamPath(maxLen) {
    const pts = [ball.x, ball.y];
    let len = 0;
    for (let i = trail.length - 2; i >= 0; i -= 2) {
      const px = pts[pts.length - 2], py = pts[pts.length - 1];
      const x = trail[i], y = trail[i + 1];
      const d = Math.hypot(x - px, y - py);
      if (d < 1e-3) continue;
      if (len + d >= maxLen) {
        const f = (maxLen - len) / d;
        pts.push(px + (x - px) * f, py + (y - py) * f);
        len = maxLen;
        break;
      }
      len += d;
      pts.push(x, y);
    }
    return { pts, len };
  }

  function strokePart(pts, upto) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < upto; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.stroke();
  }

  function drawTrail() {
    if (CFG.fx <= 0 || trail.length < 2 || state !== 'play') return;
    const fx = Math.min(CFG.fx, 2);
    const speed = speedOf();
    const lo = H * CFG.beamSpeed, hi = H * CFG.maxSpeed;
    if (speed < lo) return; // ビーム発生速度に届くまでは出さない
    const sp = Math.max(0, Math.min(1, (speed - lo) / Math.max(hi - lo, 1)));
    const spinR = Math.min(1, Math.abs(ball.spin) / (H * Math.max(CFG.maxSpin, 0.01)));

    const { pts, len } = beamPath(H * (0.05 + 0.55 * sp) * Math.min(fx, 1.5));
    const n = pts.length;
    if (n < 4 || len < 2) return;

    const [r, g, b] = beamColor(sp);
    const w = ball.r * (0.9 + 2.2 * spinR) * (0.65 + 0.5 * sp);
    const a = (0.45 + 0.55 * sp) * Math.min(fx, 1.2);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 先頭ほど太く明るく：長さを変えて重ね描き
    const LEVELS = [1, 0.8, 0.6, 0.4, 0.22];
    for (let li = 0; li < LEVELS.length; li++) {
      // 全長のうち先頭側 LEVELS[li] の部分
      const want = len * LEVELS[li];
      let acc = 0, upto = 2;
      for (; upto < n; upto += 2) {
        acc += Math.hypot(pts[upto] - pts[upto - 2], pts[upto + 1] - pts[upto - 1]);
        if (acc >= want) { upto += 2; break; }
      }
      upto = Math.min(upto, n);
      const k = 0.55 + 0.45 * (li / (LEVELS.length - 1));
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.08 * a})`;
      ctx.lineWidth = w * 3.4 * k;
      strokePart(pts, upto);
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.28 * a})`;
      ctx.lineWidth = w * 1.7 * k;
      strokePart(pts, upto);
      ctx.strokeStyle = `rgba(255,255,255,${0.22 * a})`;
      ctx.lineWidth = w * 0.6 * k;
      strokePart(pts, upto);
    }

    // 巻き付く稲妻：回転が強いほど本数と振れ幅が増える
    const bolts = spinR > 0.08 ? Math.min(6, Math.ceil(spinR * 6)) : 0;
    if (bolts > 0) {
      const time = performance.now() / 1000;
      const dir = Math.sign(ball.spin) || 1;
      const stepLen = Math.max(9, ball.r * 1.3);
      const boltLen = len * 0.95;
      ctx.lineWidth = 1 + 1.2 * spinR;
      for (let k = 0; k < bolts; k++) {
        const ph = k * (Math.PI * 2 / bolts);
        ctx.strokeStyle = k % 2
          ? `rgba(255,255,255,${0.55 * a + 0.2})`
          : `rgba(${Math.min(255, r + 120)},${Math.min(255, g + 120)},${Math.min(255, b + 120)},${0.6 * a + 0.2})`;
        ctx.beginPath();
        // 毎フレーム違う区間に走らせてバチバチ点滅させる
        const from = Math.random() * boltLen * 0.45;
        const to = Math.min(boltLen, from + boltLen * (0.35 + 0.5 * Math.random()));
        let si = 2, segStart = 0, first = true;
        for (let d = from; d <= to; d += stepLen * (0.6 + Math.random() * 0.8)) {
          // 折れ線上の距離 d の位置と法線
          while (si < n - 2 && segStart + Math.hypot(pts[si] - pts[si - 2], pts[si + 1] - pts[si - 1]) < d) {
            segStart += Math.hypot(pts[si] - pts[si - 2], pts[si + 1] - pts[si - 1]);
            si += 2;
          }
          const x0 = pts[si - 2], y0 = pts[si - 1], x1 = pts[si], y1 = pts[si + 1];
          const sl = Math.hypot(x1 - x0, y1 - y0) || 1;
          const f = Math.min(1, (d - segStart) / sl);
          const nx = -(y1 - y0) / sl, ny = (x1 - x0) / sl;
          const taper = 1 - d / boltLen;
          // らせん（回転方向に流れる）＋ギザギザ
          const amp = w * (0.7 + 0.6 * spinR) * (0.4 + 0.6 * taper);
          const off = Math.sin(ph + d * 0.045 - dir * time * 14) * amp * 0.8 + (Math.random() - 0.5) * amp * 1.1;
          const x = x0 + (x1 - x0) * f + nx * off, y = y0 + (y1 - y0) * f + ny * off;
          if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    // ボール周りの光
    ctx.fillStyle = `rgba(${r},${g},${b},${0.25 * a})`;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r + w * 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ラリー数：画面中央に大きく
  function drawRally() {
    if (rally < 2 || state === 'over') return;
    const hue = (200 + rally * 18) % 360;
    const size = Math.min(W * 0.22, 40 + rally * 2) * (1 + 0.35 * rallyPop);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `hsla(${hue},90%,65%,${0.18 + 0.4 * rallyPop})`;
    ctx.font = `900 ${size}px -apple-system, "Hiragino Sans", sans-serif`;
    ctx.fillText(rally, W / 2, H * 0.5);
    ctx.font = `bold 13px -apple-system, "Hiragino Sans", sans-serif`;
    ctx.fillText('RALLY', W / 2, H * 0.5 + size * 0.6);
  }

  function drawBall() {
    if (eff.power > 0 || eff.poison > 0) {
      ctx.fillStyle = eff.poison > 0 ? 'rgba(124,255,58,0.35)' : 'rgba(255,77,109,0.35)';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 1.9, 0, Math.PI * 2); ctx.fill();
    }
    const { x, y, r, rot } = ball;
    ctx.fillStyle = BALL_COLOR_A;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, rot + Math.PI / 2, rot + Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = BALL_COLOR_B;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, rot - Math.PI / 2, rot + Math.PI / 2);
    ctx.closePath();
    ctx.fill();
  }

  // タイトルのロゴ（回転する2色ボール付き）
  function drawTitle() {
    const t = performance.now() / 1000;
    const cx = W / 2, cy = H * 0.3, size = Math.min(W * 0.17, 72);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `italic 900 ${size}px -apple-system, "Hiragino Sans", sans-serif`;
    for (const [txt, y] of [['SPIN', cy - size * 0.55], ['SMASH', cy + size * 0.55]]) {
      const grad = ctx.createLinearGradient(cx - size * 2, 0, cx + size * 2, 0);
      grad.addColorStop(0, BALL_COLOR_A); grad.addColorStop(1, BALL_COLOR_B);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillText(txt, cx + 3, y + 4);
      ctx.fillStyle = grad;
      ctx.fillText(txt, cx, y);
    }
    // ロゴ下で回転するボール
    const r = size * 0.32, bx = cx, by = cy + size * 1.6, rot = t * 9;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(bx, by, r * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BALL_COLOR_A; ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, r, rot + Math.PI / 2, rot + Math.PI * 1.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = BALL_COLOR_B; ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, r, rot - Math.PI / 2, rot + Math.PI / 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '13px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText('回転をかけて、加速して、撃ち抜け', cx, by + r * 3);
  }

  // みずの水流・ひこうの横風の目印
  function drawCurrents() {
    const key = themeOf(stage).key, t = stageTime;
    if (key === 'water') {
      const y0 = H * 0.45, y1 = H * 0.6;
      ctx.fillStyle = 'rgba(120,200,255,0.07)';
      ctx.fillRect(0, y0, W, y1 - y0);
      ctx.fillStyle = 'rgba(160,220,255,0.35)';
      ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < 8; i++) {
        const x = ((i / 8 + flowDir * t * 0.15) % 1 + 1) % 1 * W;
        ctx.fillText(flowDir > 0 ? '›' : '‹', x, y0 + (y1 - y0) * (0.3 + 0.4 * (i % 2)));
      }
    }
    if (key === 'sky' && windOn()) {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const y = (i / 12) * H + 30, x = ((i * 0.37 + windDir * t * 1.2) % 1 + 1) % 1 * W;
        ctx.moveTo(x, y); ctx.lineTo(x + windDir * 50, y + 6);
      }
      ctx.stroke();
    }
  }

  // ---- 自機：中央のコックピット（金属）＋左右に伸びる光のブレード ----
  const COCKPIT = 0.2; // 自機の幅に対するコックピットの幅（敵弾はここだけに当たる）
  function drawPaddle() {
    const { x, y, w, h } = paddle;
    const cy = y + h / 2, cw = w * COCKPIT, bladeLen = (w - cw) / 2;
    let alpha = 1;
    if (eff.safe > 0) alpha = Math.sin(stageTime * 25) > 0 ? 0.45 : 0.9; // しびれ後の無敵中は点滅
    if (eff.ghost > 0) alpha = Math.max(0, 1 - eff.ghost);              // 透明（最後の1秒で戻る）
    const ch = Math.max(4, h * 1.15);
    if (alpha <= 0) { drawCockpitWindow(x, cy, cw, ch, true); return; } // 透明中も窓だけは見せる
    const stunned = eff.stun > 0;
    // ブレードの色：普段は青、しびれ中は黄色っぽく弱まる、打った瞬間は明るく
    const col = stunned ? [255, 220, 80] : [60, 150, 255];
    const flick = 0.92 + 0.08 * Math.sin(stageTime * 31) * Math.sin(stageTime * 17); // わずかなゆらぎ（点滅ではない）
    const power = (stunned ? 0.55 : 1) * flick + paddleGlow * 0.4;
    const core = Math.max(1.5, h * 0.42);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';
    for (const side of [-1, 1]) {
      const x0 = x + side * cw / 2, x1 = x + side * (cw / 2 + bladeLen);
      // 外側の光（3重）→ 色のついた刃 → 白い芯
      for (const [lw, a] of [[core * 6, 0.07], [core * 3.6, 0.14], [core * 2.2, 0.3]]) {
        ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${a * power})`;
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
      }
      ctx.strokeStyle = `rgba(${Math.min(255, col[0] + 80)},${Math.min(255, col[1] + 60)},255,${0.9 * power})`;
      ctx.lineWidth = core * 1.3;
      ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, power)})`;
      ctx.lineWidth = core * 0.6;
      ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1 - side * core * 0.5, cy); ctx.stroke();
      // 付け根の強い光
      const g = ctx.createRadialGradient(x0, cy, 0, x0, cy, core * 4);
      g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${0.55 * power})`);
      g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x0, cy, core * 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // コックピット（金属の筒。溝と光る窓）
    const cx0 = x - cw / 2, cy0 = cy - ch / 2;
    const mg = ctx.createLinearGradient(0, cy0, 0, cy0 + ch);
    mg.addColorStop(0, '#8a93a6'); mg.addColorStop(0.35, '#e9eef7'); mg.addColorStop(0.55, '#5a6273'); mg.addColorStop(1, '#2a2f3a');
    ctx.fillStyle = mg;
    roundRect(cx0, cy0, cw, ch, Math.min(ch / 2, 4)); ctx.fill();
    ctx.fillStyle = 'rgba(15,18,26,0.85)';
    const grooves = 4;
    for (let i = 1; i <= grooves; i++) {
      const gx = cx0 + cw * (i / (grooves + 1));
      ctx.fillRect(gx - 0.75, cy0 + ch * 0.15, 1.5, ch * 0.7);
    }
    ctx.globalAlpha = 1;
    drawCockpitWindow(x, cy, cw, ch, eff.ghost > 0);
    ctx.globalAlpha = alpha;
    // マグネット中：刃の先端に赤と青の印（表と裏）
    if (eff.magnet > 0) {
      for (const [sx, c] of [[-1, '#ff4d6d'], [1, '#4dd8ff']]) {
        ctx.fillStyle = c;
        ctx.fillRect(x + sx * (w / 2) - (sx > 0 ? 8 : 0), cy - ch / 2 - 3, 8, 3);
        ctx.fillRect(x + sx * (w / 2) - (sx > 0 ? 8 : 0), cy + ch / 2, 8, 3);
      }
    }
    ctx.restore();
  }

  // コックピットの窓：黄色（ボールの赤・水色と色も明るさも違う）＋黒い縁取り＋横長の形
  // 色弱の人にも見分けやすい配色（Okabe-Ito の黄色）。透明中は両側に ◀ ▶ の印
  const SHOW_GHOST_MARKS = false;
  function drawCockpitWindow(x, cy, cw, ch, ghost) {
    const ww = Math.max(8, cw * 0.42), wh = Math.max(4, ch * 0.62);
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#F0E442';
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 1.5;
    roundRect(x - ww / 2, cy - wh / 2, ww, wh, wh / 2);
    ctx.fill(); ctx.stroke();
    // 透明中に窓を指す矢印（▶ 窓 ◀）を出す場合は SHOW_GHOST_MARKS を true に（今は一旦なし）
    if (ghost && SHOW_GHOST_MARKS) {
      const s = Math.max(6, wh * 1.5), gx = ww / 2 + 3;
      ctx.fillStyle = '#F0E442';
      ctx.lineWidth = 1;
      for (const d of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + d * gx, cy);
        ctx.lineTo(x + d * (gx + s), cy - s * 0.6);
        ctx.lineTo(x + d * (gx + s), cy + s * 0.6);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ブロックの種類ごとの見た目
  function decorateBrick(b) {
    if (b.type === 'H') {
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
      roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 3); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (const [rx, ry] of [[4, 4], [b.w - 4, 4], [4, b.h - 4], [b.w - 4, b.h - 4]]) { ctx.beginPath(); ctx.arc(b.x + rx, b.y + ry, 1.3, 0, Math.PI * 2); ctx.fill(); }
    } else if (b.type === 'I') {
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(b.h * 0.8)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', b.x + b.w / 2, b.y + b.h * 0.45);
    } else if (b.type === 'P') {
      ctx.fillStyle = 'rgba(40,90,20,0.6)';
      for (const [rx, ry, rr] of [[0.25, 0.4, 0.18], [0.55, 0.55, 0.13], [0.78, 0.35, 0.1]]) { ctx.beginPath(); ctx.arc(b.x + b.w * rx, b.y + b.h * ry, b.h * rr, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  // アイテム・放電・文字・バリア・フィーバー・HUDの追加表示
  function drawExtras() {
    // 落ちてくるアイテム
    const iw = W * 0.13, ih = 16;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      ctx.fillStyle = it.color;
      roundRect(it.x - iw / 2, it.y - ih / 2, iw, ih, ih / 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = it.text || '#0b1020';
      ctx.font = `900 ${it.label.length > 4 ? 8 : 10}px -apple-system, "Hiragino Sans", sans-serif`;
      ctx.fillText(it.label, it.x, it.y + 0.5);
    }
    // 放電
    if (zaps.length) {
      ctx.strokeStyle = 'rgba(255,240,120,0.9)'; ctx.lineWidth = 2;
      for (const z of zaps) {
        ctx.beginPath(); ctx.moveTo(z.x0, z.y0);
        for (let i = 1; i < 6; i++) { const f = i / 6; ctx.lineTo(z.x0 + (z.x1 - z.x0) * f + (Math.random() - 0.5) * 14, z.y0 + (z.y1 - z.y0) * f + (Math.random() - 0.5) * 14); }
        ctx.lineTo(z.x1, z.y1); ctx.stroke();
      }
    }
    // バリア（フィーバー中も表示）
    if (eff.barrier > 0 || fever > 0) {
      const y = H - safeBottom * 0.35;
      ctx.strokeStyle = fever > 0 ? `hsl(${(stageTime * 200) % 360},90%,70%)` : 'rgba(125,249,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(6, y); ctx.lineTo(W - 6, y); ctx.stroke();
    }
    // 文字（アイテム名・PERFECT・倍率など）
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life / 0.4);
      ctx.font = '900 18px -apple-system, "Hiragino Sans", sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(p.text, p.x + 1, p.y + 2);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    // 壁ゆらし：揺れている間だけ壁の線を描いてくねらせる（画面全体は揺らさない）
    if (shakeT > 0) {
      const k = shakeT / SHAKE_TIME, amp = 5 * k * Math.max(0.3, CFG.fx), ph = (SHAKE_TIME - shakeT) * 60;
      ctx.strokeStyle = `rgba(127,220,255,${0.85 * k})`; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let y = H; y >= top; y -= 12) ctx.lineTo(2 + Math.sin(y * 0.05 + ph) * amp * shakeDir, y);
      for (let x = 2; x <= W - 2; x += 12) ctx.lineTo(x, top + 2 + Math.sin(x * 0.05 + ph) * amp);
      for (let y = top; y <= H; y += 12) ctx.lineTo(W - 2 + Math.sin(y * 0.05 + ph) * amp * shakeDir, y);
      ctx.stroke();
    }
    // フィーバー中は画面の縁が虹色に光る（点滅なし）
    if (fever > 0) {
      ctx.strokeStyle = `hsla(${(stageTime * 120) % 360},90%,65%,0.8)`;
      ctx.lineWidth = 6;
      ctx.strokeRect(3, top + 3, W - 6, H - top - 6);
    }
    // HUD：ラリー倍率・フィーバーゲージ・効果中のアイテム
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const m = rallyMult();
    if (m > 1) {
      ctx.font = 'bold 13px -apple-system, sans-serif';
      ctx.fillStyle = '#ffd23f';
      ctx.fillText(`x${m.toFixed(1)}`, 58 + ctx.measureText('SCORE ' + score).width * 1.25, top / 2 + 12);
    }
    const g = fever > 0 ? fever / 8 : feverGauge;
    if (g > 0) {
      ctx.fillStyle = fever > 0 ? `hsl(${(stageTime * 200) % 360},90%,65%)` : '#ff7ae0';
      ctx.fillRect(0, top - 3, W * g, 3);
    }
    const chips = [];
    if (eff.wide > 0) chips.push([`WIDE${eff.wideLv}`, eff.wide, '#4dd8ff']);
    if (eff.power > 0) chips.push(['POW', eff.power, '#ff4d6d']);
    if (eff.poison > 0) chips.push(['毒', eff.poison, '#7cff3a']);
    if (eff.barrier > 0) chips.push([`BAR×${eff.barrier}`, 0, '#7df9ff']);
    if (eff.magnet > 0) chips.push(['MAG', 0, '#b388ff']);
    if (eff.ghost > 0) chips.push(['透明', eff.ghost, '#9aa0b8']);
    if (balls.length > 1) chips.push([`●×${balls.length}`, 0, '#ffffff']);
    ctx.font = 'bold 10px -apple-system, sans-serif';
    chips.forEach(([label, t, col], i) => {
      const x = 10 + i * 46, y = boss ? top + 30 : top + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(x, y, 42, 12, 6); ctx.fill();
      ctx.fillStyle = col; ctx.fillText(t ? `${label} ${Math.ceil(t)}` : label, x + 5, y + 6.5);
    });
  }

  function draw() {
    drawBg();
    if (state === 'title') { drawTitle(); return; }

    // HUD（背景の上で読みやすいよう帯を敷く）
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, top);
    const th = themeOf(stage);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = th.accent;
    ctx.font = 'bold 11px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText(`STAGE ${stage}  ${th.name}`, 54, top / 2 - 4); // 左上の巻き戻しボタンの右
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText('SCORE ' + score, 54, top / 2 + 12);
    ctx.textAlign = 'right';
    ctx.fillText(lives > 5 ? `♥×${lives}` : '♥'.repeat(Math.max(lives, 0)), W - 140, top / 2 + 8); // 右上ボタンの左
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(0, top, W, 1);

    const fx = CFG.fx;

    drawRally();
    drawCurrents();
    drawBoss();

    const tiny = brickK() < 0.5;
    for (const b of bricks) {
      if (!b.alive) continue;
      const ratio = b.hp / b.maxHp;
      if (tiny) { // 小さいブロックは軽い描き方（四角＋削れ具合の暗さ＋被弾の光）
        ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
        if (ratio < 1) { ctx.fillStyle = `rgba(0,0,0,${0.5 * (1 - ratio)})`; ctx.fillRect(b.x, b.y, b.w, b.h); }
        if (b.type === 'H' || b.type === 'I') { ctx.fillStyle = b.type === 'I' ? '#ffffff' : 'rgba(255,255,255,0.55)'; ctx.fillRect(b.x + b.w * 0.3, b.y + b.h * 0.3, b.w * 0.4, b.h * 0.4); }
        if (b.hitT > 0) { ctx.fillStyle = `rgba(255,255,255,${0.6 * b.hitT})`; ctx.fillRect(b.x, b.y, b.w, b.h); }
        continue;
      }
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 3);
      ctx.fill();
      decorateBrick(b);
      roundRect(b.x, b.y, b.w, b.h, 3); // 下の暗転処理用にパスを戻す
      // 削れるほど暗く
      if (ratio < 1) {
        ctx.fillStyle = `rgba(0,0,0,${0.45 * (1 - ratio)})`;
        ctx.fill();
        // ヒビ
        const nCrack = Math.min(3, Math.ceil((1 - ratio) * 3));
        ctx.strokeStyle = 'rgba(10,12,25,0.85)';
        ctx.lineWidth = 1.2;
        for (let k = 0; k < nCrack; k++) {
          const c = b.cracks[k];
          ctx.beginPath();
          ctx.moveTo(b.x + c[0] * b.w, b.y + c[1] * b.h);
          for (let i = 2; i < c.length; i += 2) ctx.lineTo(b.x + c[i] * b.w, b.y + c[i + 1] * b.h);
          ctx.stroke();
        }
      }
      // 当たった瞬間に白く光る
      if (b.hitT > 0) {
        ctx.fillStyle = `rgba(255,255,255,${0.5 * b.hitT})`;
        roundRect(b.x, b.y, b.w, b.h, 3);
        ctx.fill();
      }
      // HPバー
      const bh = Math.max(2, b.h * 0.14);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(b.x + 2, b.y + b.h - bh - 2, b.w - 4, bh);
      ctx.fillStyle = ratio > 0.5 ? '#ffffff' : ratio > 0.25 ? '#ffd166' : '#ff5d73';
      ctx.fillRect(b.x + 2, b.y + b.h - bh - 2, (b.w - 4) * ratio, bh);
    }

    // 破片
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // ダメージ数値
    if (dmgTexts.length) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const t of dmgTexts) {
        ctx.globalAlpha = Math.min(1, t.life / 0.4);
        ctx.font = t.kill ? 'bold 15px -apple-system, "Hiragino Sans", sans-serif' : 'bold 12px -apple-system, "Hiragino Sans", sans-serif';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillText(t.text, t.x + 1, t.y + 1);
        ctx.fillStyle = t.kill ? '#fff27a' : '#ffffff';
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }

    // ステージ開始・クリアなどの大きな表示
    if (banner) {
      const k = Math.min(1, banner.life / 0.4);
      const sc = 1 + 0.3 * Math.max(0, banner.life - 1.9);
      ctx.globalAlpha = k;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `italic 900 ${Math.round(W * 0.12 * sc)}px -apple-system, "Hiragino Sans", sans-serif`;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(banner.text, W / 2 + 2, H * 0.44 + 3);
      ctx.fillStyle = banner.color || '#ffffff';
      ctx.fillText(banner.text, W / 2, H * 0.44);
      if (banner.sub) {
        ctx.font = `bold ${Math.round(W * 0.06)}px -apple-system, "Hiragino Sans", sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(banner.sub, W / 2, H * 0.44 + W * 0.11);
      }
      ctx.globalAlpha = 1;
    }

    drawPaddle();

    if (state !== 'over' && state !== 'allClear') {
      // ボールが多い時はビームを先頭12個まで（重くならないように）
      // 先頭12個はビーム付きの2色ボール、それ以降は回転の向きで色分けした単色の丸をまとめて描く
      const n = Math.min(beamLimit(), balls.length);
      for (let i = 0; i < n; i++) { useBall(balls[i]); drawTrail(); drawBall(); }
      if (balls.length > n) {
        for (const [col, pos] of [[BALL_COLOR_B, true], [BALL_COLOR_A, false]]) {
          ctx.fillStyle = col;
          ctx.beginPath();
          for (let i = n; i < balls.length; i++) {

    paddle.vx = 0; paddle.vy = 0;
    targetX = sn.px; targetY = sn.py;
    // 指を置いたままでもパドルが飛ばないよう、ドラッグの基準を今の指の位置に合わせ直す
    touchStartX = lastPX; paddleStartX = sn.px; touchStartY = lastPY; paddleStartY = sn.py;
    sn.br.forEach((v, i) => { const b = bricks[i]; if (b) [b.alive, b.hp, b.reviveT, b.revived] = v; });
    aliveCount = bricks.reduce((n, b) => n + (b.alive ? 1 : 0), 0);
    ({ score, lives, state, rally, chain, stageTime, windT, bossDone, fever, feverGauge } = sn);
    items = sn.items.map(i => ({ ...i }));
    Object.assign(eff, sn.eff);
    boss = sn.boss ? { ...sn.boss } : null;
    shots = sn.shots.map(x => ({ ...x }));
    moveBricks(0);
    if (state === 'play' || state === 'ready') SFX.music.play(boss ? (stage === STAGES ? 'last' : 'boss') : 's' + stage);
    SFX.music.setFever(fever > 0);
  }
  // ボールは数値の配列に詰めて記録（数が多くても軽い）
  const BF = 12;
  function packBalls() {
    const a = new Float64Array(balls.length * BF);
    balls.forEach((b, i) => {
      const o = i * BF;
      a[o] = b.x; a[o + 1] = b.y; a[o + 2] = b.vx; a[o + 3] = b.vy; a[o + 4] = b.spin; a[o + 5] = b.rot;
      a[o + 6] = b.extra || 0; a[o + 7] = b.stuck == null ? NaN : b.stuck; a[o + 8] = b.stuckSpeed || 0; a[o + 9] = b.r;
      a[o + 10] = (b.dead ? 1 : 0) | (b.selfHit ? 2 : 0);
      a[o + 11] = b.stuckDir || -1;
    });
    return a;
  }
  function unpackBalls(a) {
    const list = [];
    for (let o = 0; o < a.length; o += BF) {
      list.push({ x: a[o], y: a[o + 1], vx: a[o + 2], vy: a[o + 3], spin: a[o + 4], rot: a[o + 5], extra: a[o + 6],
        stuck: Number.isNaN(a[o + 7]) ? null : a[o + 7], stuckSpeed: a[o + 8], r: a[o + 9],
        dead: !!(a[o + 10] & 1), selfHit: !!(a[o + 10] & 2), stuckDir: a[o + 11], trail: [] });
    }
    return list.length ? list : [{ x: W / 2, y: H / 2, vx: 0, vy: 0, spin: 0, rot: 0, r: Math.max(2, W * 0.022 * objK()), trail: [] }];
  }
  let histTick = 0;
  function recordHistory() {
    if (state !== 'play' && state !== 'ready') return;
    if ((histTick++ & 1) === 0) return; // 2フレームに1回
    history.push(snapshot());
    if (history.length > REWIND_SEC * 30) history.shift();
  }
  const canRewind = () => (state === 'play' || state === 'ready' || state === 'over') && history.length > 0;
  function rewindStep(dt) {
    // 2倍速でさかのぼる（記録は2フレームに1回なので、1フレームに1つ戻す）
    if (history.length) restore(history.pop());
    rewindSfxT -= dt;
    if (rewindSfxT <= 0) { SFX.rewind(); rewindSfxT = 0.22; }
    updateBg(-dt * 2);
  }
  // 巻き戻し中の見た目（点滅なし：青みがかった色と表示）
  function drawRewind() {
    if (!rewinding || !canRewind()) return;
    ctx.fillStyle = 'rgba(60,110,255,0.14)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = 0; y < H; y += 4) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'italic 900 28px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('◀◀ REWIND', W / 2, H * 0.3);
    ctx.font = 'bold 12px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText(`のこり ${(history.length / 30).toFixed(1)} 秒`, W / 2, H * 0.3 + 26);
  }

  // ---- ループ ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!paused) {
      if (rewinding && canRewind()) rewindStep(dt);
      else { update(dt); recordHistory(); }
    }
    draw();
    drawRewind();
    updateMeter();
    requestAnimationFrame(loop);
  }

  resize();
  goTitle();
  requestAnimationFrame(loop);
})();
</script>
