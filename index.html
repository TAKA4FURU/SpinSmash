        for (const s of [-1, 1]) { P(() => { ctx.moveTo(s * w * 0.1, 0); ctx.lineTo(s * w * 0.5, -h * (0.2 + flap)); ctx.lineTo(s * w * 0.42, h * 0.2); ctx.closePath(); }); ctx.fill(); }
        ctx.fillStyle = '#7fb8e6'; P(() => ctx.ellipse(0, 0, w * 0.2, h * 0.42, 0, 0, Math.PI * 2)); ctx.fill();
        ctx.fillStyle = '#ffb300'; P(() => { ctx.moveTo(-8, h * 0.2); ctx.lineTo(8, h * 0.2); ctx.lineTo(0, h * 0.38); ctx.closePath(); }); ctx.fill();
        break; }
      case 'rock': { // 岩の巨人
        ctx.fillStyle = '#8d6e63'; ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 3;
        P(() => { const pts = [[-0.48, -0.2], [-0.3, -0.5], [0.1, -0.48], [0.45, -0.3], [0.5, 0.2], [0.25, 0.5], [-0.3, 0.48], [-0.5, 0.2]]; pts.forEach(([px, py], i) => i ? ctx.lineTo(px * w, py * h) : ctx.moveTo(px * w, py * h)); ctx.closePath(); }); ctx.fill(); ctx.stroke();
        ctx.lineWidth = 2; P(() => { ctx.moveTo(-w * 0.2, -h * 0.45); ctx.lineTo(-w * 0.1, -h * 0.1); ctx.lineTo(-w * 0.25, h * 0.1); }); ctx.stroke();
        break; }
      case 'ice': { // 氷の結晶体
        ctx.fillStyle = 'rgba(189,243,255,0.9)'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + t * 0.3; P(() => { ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - 0.15) * w * 0.25, Math.sin(a - 0.15) * h * 0.4); ctx.lineTo(Math.cos(a) * w * 0.48, Math.sin(a) * h * 0.55); ctx.lineTo(Math.cos(a + 0.15) * w * 0.25, Math.sin(a + 0.15) * h * 0.4); ctx.closePath(); }); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = '#4fc3f7'; P(() => ctx.arc(0, 0, h * 0.3, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'poison': { // 毒スライム
        const sq = 1 + Math.sin(t * 3) * 0.06;
        ctx.fillStyle = '#8e24aa';
        P(() => { ctx.ellipse(0, h * 0.05, w * 0.46 * sq, h * 0.45 / sq, 0, Math.PI, 0); ctx.lineTo(w * 0.46 * sq, h * 0.35); for (let i = 6; i >= 0; i--) ctx.lineTo((i / 6 - 0.5) * w * 0.92 * sq, h * 0.35 + (i % 2 ? 10 : 0) + Math.sin(t * 4 + i) * 4); ctx.closePath(); }); ctx.fill();
        ctx.fillStyle = 'rgba(156,255,87,0.7)';
        for (let i = 0; i < 5; i++) { P(() => ctx.arc(Math.sin(i * 2.1) * w * 0.3, -h * 0.1 + Math.cos(i * 1.7) * h * 0.2, 3 + (i % 3) * 2, 0, Math.PI * 2)); ctx.fill(); }
        break; }
      case 'steel': { // 鋼の要塞
        ctx.fillStyle = '#607d8b'; ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 3;
        roundRect(-w * 0.48, -h * 0.45, w * 0.96, h * 0.9, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#37474f';
        for (const s of [-1, 1]) { roundRect(s * w * 0.36 - 10, h * 0.25, 20, h * 0.3, 4); ctx.fill(); }
        ctx.fillStyle = '#cfd8dc';
        for (let i = 0; i < 6; i++) { P(() => ctx.arc((i / 5 - 0.5) * w * 0.85, -h * 0.36, 2.5, 0, Math.PI * 2)); ctx.fill(); }
        break; }
      case 'bio': { // 巨大細胞（ラスボス）
        ctx.strokeStyle = 'rgba(180,50,90,0.9)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * Math.PI * 2 + t * 0.5;
          P(() => { ctx.moveTo(Math.cos(a) * w * 0.3, Math.sin(a) * h * 0.35); ctx.quadraticCurveTo(Math.cos(a + 0.4) * w * 0.55, Math.sin(a + 0.4) * h * 0.7 + Math.sin(t * 3 + i) * 10, Math.cos(a + 0.2) * w * 0.62, Math.sin(a + 0.2) * h * 0.75); }); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(216,27,96,0.85)'; P(() => ctx.ellipse(0, 0, w * 0.38, h * 0.45, 0, 0, Math.PI * 2)); ctx.fill();
        ctx.fillStyle = 'rgba(255,140,170,0.6)'; P(() => ctx.ellipse(0, 0, w * 0.22, h * 0.28, 0, 0, Math.PI * 2)); ctx.fill();
        break; }
    }
    // 目（ボールを追う）と口。怒ると目が赤く口がギザギザに
    const eyeY = b.key === 'water' ? -h * 0.15 : -h * 0.08, eyeDX = Math.min(w * 0.13, 26), er = Math.max(7, h * 0.12);
    const lookX = Math.max(-1, Math.min(1, (ball.x - x) / W * 3)), lookY = Math.max(-1, Math.min(1, (ball.y - y) / H * 3));
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#ffffff'; P(() => ctx.arc(s * eyeDX, eyeY, er, 0, Math.PI * 2)); ctx.fill();
      ctx.fillStyle = angry ? '#ff1744' : '#111111';
      P(() => ctx.arc(s * eyeDX + lookX * er * 0.4, eyeY + lookY * er * 0.4, er * 0.5, 0, Math.PI * 2)); ctx.fill();
      if (angry) { ctx.strokeStyle = '#111'; ctx.lineWidth = 3; P(() => { ctx.moveTo(s * (eyeDX + er), eyeY - er * 1.4); ctx.lineTo(s * (eyeDX - er * 0.6), eyeY - er * 0.8); }); ctx.stroke(); }
    }
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
    P(() => {
      const my = eyeY + er * 2.2, mw = eyeDX * 1.1;
      if (angry) { ctx.moveTo(-mw, my); for (let i = 1; i <= 6; i++) ctx.lineTo(-mw + i * mw / 3, my + (i % 2 ? 6 : 0)); }
      else { ctx.arc(0, my - 6, mw * 0.7, 0.2 * Math.PI, 0.8 * Math.PI); }
    }); ctx.stroke();
    // 被弾時に白く光る
    if (b.hitT > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,255,255,${0.35 * b.hitT})`;
      P(() => ctx.ellipse(0, 0, w * 0.5, h * 0.55, 0, 0, Math.PI * 2)); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  function drawShots() {
    for (const s of shots) {
      if (s.delay > 0) { // 予告線
        ctx.strokeStyle = `rgba(255,225,77,${0.25 + 0.35 * Math.abs(Math.sin(s.delay * 20))})`;
        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, H); ctx.stroke(); ctx.setLineDash([]);
        continue;
      }
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  function drawBossBar() {
    if (!boss || boss.enter > 0.5) return;
    const y = top + 8, w = W - 20;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(10, y, w, 8);
    ctx.fillStyle = boss.hp < boss.maxHp * 0.5 ? '#ff1744' : '#ff9100';
    ctx.fillRect(10, y, w * boss.hp / boss.maxHp, 8);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px -apple-system, "Hiragino Sans", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(boss.name + (stage === STAGES ? '（ラスボス）' : ''), 12, y + 10);
  }

  // ちょっとした文字表示（アイテム名・PERFECTなど）
  let popups = [];
  function addPopup(x, y, text, color) {
    popups.push({ x, y, text, color, life: 0.9 });
    if (popups.length > 12) popups.shift();
  }

  // ---- 描画 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- ビーム ----
  // 速度 → 色と長さ（赤→黄→青→紫→ピンク）／回転 → 太さと巻き付く稲妻の量
  const BEAM_COLORS = [[255, 50, 40], [255, 215, 30], [40, 140, 255], [165, 70, 255], [255, 80, 200]];
  function beamColor(t) {
    const x = Math.max(0, Math.min(1, t)) * (BEAM_COLORS.length - 1);
    const i = Math.min(Math.floor(x), BEAM_COLORS.length - 2), f = x - i;
    const a = BEAM_COLORS[i], b = BEAM_COLORS[i + 1];
    return [0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * f));
  }

  // 先頭（ボール）から指定の長さだけ軌跡をさかのぼった折れ線
  function beamPath(maxLen) {
    const pts = [ball.x, ball.y];
    let len = 0;
    for (let i = trail.length - 2; i >= 0; i -= 2) {
      const px = pts[pts.length - 2], py = pts[pts.length - 1];
      const x = trail[i], y = trail[i + 1];
      const d = Math.hypot(x - px, y - py);
      if (d < 1e-3) continue;
      if (len + d >= maxLen) {
        const f = (maxLen - len) / d;
        pts.push(px + (x - px) * f, py + (y - py) * f);
        len = maxLen;
        break;
      }
      len += d;
      pts.push(x, y);
    }
    return { pts, len };
  }

  function strokePart(pts, upto) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < upto; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.stroke();
  }

  function drawTrail() {
    if (CFG.fx <= 0 || trail.length < 2 || state !== 'play') return;
    const fx = Math.min(CFG.fx, 2);
    const speed = speedOf();
    const lo = H * CFG.beamSpeed, hi = H * CFG.maxSpeed;
    if (speed < lo) return; // ビーム発生速度に届くまでは出さない
    const sp = Math.max(0, Math.min(1, (speed - lo) / Math.max(hi - lo, 1)));
    const spinR = Math.min(1, Math.abs(ball.spin) / (H * Math.max(CFG.maxSpin, 0.01)));

    const { pts, len } = beamPath(H * (0.05 + 0.55 * sp) * Math.min(fx, 1.5));
    const n = pts.length;
    if (n < 4 || len < 2) return;

    const [r, g, b] = beamColor(sp);
    const w = ball.r * (0.9 + 2.2 * spinR) * (0.65 + 0.5 * sp);
    const a = (0.45 + 0.55 * sp) * Math.min(fx, 1.2);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 先頭ほど太く明るく：長さを変えて重ね描き
    const LEVELS = [1, 0.8, 0.6, 0.4, 0.22];
    for (let li = 0; li < LEVELS.length; li++) {
      // 全長のうち先頭側 LEVELS[li] の部分
      const want = len * LEVELS[li];
      let acc = 0, upto = 2;
      for (; upto < n; upto += 2) {
        acc += Math.hypot(pts[upto] - pts[upto - 2], pts[upto + 1] - pts[upto - 1]);
        if (acc >= want) { upto += 2; break; }
      }
      upto = Math.min(upto, n);
      const k = 0.55 + 0.45 * (li / (LEVELS.length - 1));
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.08 * a})`;
      ctx.lineWidth = w * 3.4 * k;
      strokePart(pts, upto);
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.28 * a})`;
      ctx.lineWidth = w * 1.7 * k;
      strokePart(pts, upto);
      ctx.strokeStyle = `rgba(255,255,255,${0.22 * a})`;
      ctx.lineWidth = w * 0.6 * k;
      strokePart(pts, upto);
    }

    // 巻き付く稲妻：回転が強いほど本数と振れ幅が増える
    const bolts = spinR > 0.08 ? Math.min(6, Math.ceil(spinR * 6)) : 0;
    if (bolts > 0) {
      const time = performance.now() / 1000;
      const dir = Math.sign(ball.spin) || 1;
      const stepLen = Math.max(9, ball.r * 1.3);
      const boltLen = len * 0.95;
      ctx.lineWidth = 1 + 1.2 * spinR;
      for (let k = 0; k < bolts; k++) {
        const ph = k * (Math.PI * 2 / bolts);
        ctx.strokeStyle = k % 2
          ? `rgba(255,255,255,${0.55 * a + 0.2})`
          : `rgba(${Math.min(255, r + 120)},${Math.min(255, g + 120)},${Math.min(255, b + 120)},${0.6 * a + 0.2})`;
        ctx.beginPath();
        // 毎フレーム違う区間に走らせてバチバチ点滅させる
        const from = Math.random() * boltLen * 0.45;
        const to = Math.min(boltLen, from + boltLen * (0.35 + 0.5 * Math.random()));
        let si = 2, segStart = 0, first = true;
        for (let d = from; d <= to; d += stepLen * (0.6 + Math.random() * 0.8)) {
          // 折れ線上の距離 d の位置と法線
          while (si < n - 2 && segStart + Math.hypot(pts[si] - pts[si - 2], pts[si + 1] - pts[si - 1]) < d) {
            segStart += Math.hypot(pts[si] - pts[si - 2], pts[si + 1] - pts[si - 1]);
            si += 2;
          }
          const x0 = pts[si - 2], y0 = pts[si - 1], x1 = pts[si], y1 = pts[si + 1];
          const sl = Math.hypot(x1 - x0, y1 - y0) || 1;
          const f = Math.min(1, (d - segStart) / sl);
          const nx = -(y1 - y0) / sl, ny = (x1 - x0) / sl;
          const taper = 1 - d / boltLen;
          // らせん（回転方向に流れる）＋ギザギザ
          const amp = w * (0.7 + 0.6 * spinR) * (0.4 + 0.6 * taper);
          const off = Math.sin(ph + d * 0.045 - dir * time * 14) * amp * 0.8 + (Math.random() - 0.5) * amp * 1.1;
          const x = x0 + (x1 - x0) * f + nx * off, y = y0 + (y1 - y0) * f + ny * off;
          if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    // ボール周りの光
    ctx.fillStyle = `rgba(${r},${g},${b},${0.25 * a})`;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r + w * 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ラリー数：画面中央に大きく
  function drawRally() {
    if (rally < 2 || state === 'over') return;
    const hue = (200 + rally * 18) % 360;
    const size = Math.min(W * 0.22, 40 + rally * 2) * (1 + 0.35 * rallyPop);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `hsla(${hue},90%,65%,${0.18 + 0.4 * rallyPop})`;
    ctx.font = `900 ${size}px -apple-system, "Hiragino Sans", sans-serif`;
    ctx.fillText(rally, W / 2, H * 0.5);
    ctx.font = `bold 13px -apple-system, "Hiragino Sans", sans-serif`;
    ctx.fillText('RALLY', W / 2, H * 0.5 + size * 0.6);
  }

  function drawBall() {
    if (eff.power > 0 || eff.poison > 0) {
      ctx.fillStyle = eff.poison > 0 ? 'rgba(124,255,58,0.35)' : 'rgba(255,77,109,0.35)';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 1.9, 0, Math.PI * 2); ctx.fill();
    }
    const { x, y, r, rot } = ball;
    ctx.fillStyle = BALL_COLOR_A;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, rot + Math.PI / 2, rot + Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = BALL_COLOR_B;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, rot - Math.PI / 2, rot + Math.PI / 2);
    ctx.closePath();
    ctx.fill();
  }

  // タイトルのロゴ（回転する2色ボール付き）
  function drawTitle() {
    const t = performance.now() / 1000;
    const cx = W / 2, cy = H * 0.3, size = Math.min(W * 0.17, 72);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `italic 900 ${size}px -apple-system, "Hiragino Sans", sans-serif`;
    for (const [txt, y] of [['SPIN', cy - size * 0.55], ['SMASH', cy + size * 0.55]]) {
      const grad = ctx.createLinearGradient(cx - size * 2, 0, cx + size * 2, 0);
      grad.addColorStop(0, BALL_COLOR_A); grad.addColorStop(1, BALL_COLOR_B);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillText(txt, cx + 3, y + 4);
      ctx.fillStyle = grad;
      ctx.fillText(txt, cx, y);
    }
    // ロゴ下で回転するボール
    const r = size * 0.32, bx = cx, by = cy + size * 1.6, rot = t * 9;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(bx, by, r * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BALL_COLOR_A; ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, r, rot + Math.PI / 2, rot + Math.PI * 1.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = BALL_COLOR_B; ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, r, rot - Math.PI / 2, rot + Math.PI / 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '13px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText('回転をかけて、加速して、撃ち抜け', cx, by + r * 3);
  }

  // みずの水流・ひこうの横風の目印
  function drawCurrents() {
    const key = themeOf(stage).key, t = stageTime;
    if (key === 'water') {
      const y0 = H * 0.45, y1 = H * 0.6;
      ctx.fillStyle = 'rgba(120,200,255,0.07)';
      ctx.fillRect(0, y0, W, y1 - y0);
      ctx.fillStyle = 'rgba(160,220,255,0.35)';
      ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < 8; i++) {
        const x = ((i / 8 + flowDir * t * 0.15) % 1 + 1) % 1 * W;
        ctx.fillText(flowDir > 0 ? '›' : '‹', x, y0 + (y1 - y0) * (0.3 + 0.4 * (i % 2)));
      }
    }
    if (key === 'sky' && windOn()) {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const y = (i / 12) * H + 30, x = ((i * 0.37 + windDir * t * 1.2) % 1 + 1) % 1 * W;
        ctx.moveTo(x, y); ctx.lineTo(x + windDir * 50, y + 6);
      }
      ctx.stroke();
    }
  }

  // ブロックの種類ごとの見た目
  function decorateBrick(b) {
    if (b.type === 'H') {
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
      roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 3); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (const [rx, ry] of [[4, 4], [b.w - 4, 4], [4, b.h - 4], [b.w - 4, b.h - 4]]) { ctx.beginPath(); ctx.arc(b.x + rx, b.y + ry, 1.3, 0, Math.PI * 2); ctx.fill(); }
    } else if (b.type === 'I') {
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(b.h * 0.8)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', b.x + b.w / 2, b.y + b.h * 0.45);
    } else if (b.type === 'P') {
      ctx.fillStyle = 'rgba(40,90,20,0.6)';
      for (const [rx, ry, rr] of [[0.25, 0.4, 0.18], [0.55, 0.55, 0.13], [0.78, 0.35, 0.1]]) { ctx.beginPath(); ctx.arc(b.x + b.w * rx, b.y + b.h * ry, b.h * rr, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  // アイテム・放電・文字・バリア・フィーバー・HUDの追加表示
  function drawExtras() {
    // 落ちてくるアイテム
    const iw = W * 0.13, ih = 16;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      ctx.fillStyle = it.color;
      roundRect(it.x - iw / 2, it.y - ih / 2, iw, ih, ih / 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = it.text || '#0b1020';
      ctx.font = `900 ${it.label.length > 4 ? 8 : 10}px -apple-system, "Hiragino Sans", sans-serif`;
      ctx.fillText(it.label, it.x, it.y + 0.5);
    }
    // 放電
    if (zaps.length) {
      ctx.strokeStyle = 'rgba(255,240,120,0.9)'; ctx.lineWidth = 2;
      for (const z of zaps) {
        ctx.beginPath(); ctx.moveTo(z.x0, z.y0);
        for (let i = 1; i < 6; i++) { const f = i / 6; ctx.lineTo(z.x0 + (z.x1 - z.x0) * f + (Math.random() - 0.5) * 14, z.y0 + (z.y1 - z.y0) * f + (Math.random() - 0.5) * 14); }
        ctx.lineTo(z.x1, z.y1); ctx.stroke();
      }
    }
    // バリア（フィーバー中も表示）
    if (eff.barrier > 0 || fever > 0) {
      const y = H - safeBottom * 0.35;
      ctx.strokeStyle = fever > 0 ? `hsl(${(stageTime * 200) % 360},90%,70%)` : 'rgba(125,249,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(6, y); ctx.lineTo(W - 6, y); ctx.stroke();
    }
    // 文字（アイテム名・PERFECT・倍率など）
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life / 0.4);
      ctx.font = '900 18px -apple-system, "Hiragino Sans", sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(p.text, p.x + 1, p.y + 2);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    // フィーバー中は画面の縁が虹色に光る（点滅なし）
    if (fever > 0) {
      ctx.strokeStyle = `hsla(${(stageTime * 120) % 360},90%,65%,0.8)`;
      ctx.lineWidth = 6;
      ctx.strokeRect(3, top + 3, W - 6, H - top - 6);
    }
    // HUD：ラリー倍率・フィーバーゲージ・効果中のアイテム
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const m = rallyMult();
    if (m > 1) {
      ctx.font = 'bold 13px -apple-system, sans-serif';
      ctx.fillStyle = '#ffd23f';
      ctx.fillText(`x${m.toFixed(1)}`, 58 + ctx.measureText('SCORE ' + score).width * 1.25, top / 2 + 12);
    }
    const g = fever > 0 ? fever / 8 : feverGauge;
    if (g > 0) {
      ctx.fillStyle = fever > 0 ? `hsl(${(stageTime * 200) % 360},90%,65%)` : '#ff7ae0';
      ctx.fillRect(0, top - 3, W * g, 3);
    }
    const chips = [];
    if (eff.wide > 0) chips.push(['WIDE', eff.wide, '#4dd8ff']);
    if (eff.power > 0) chips.push(['POW', eff.power, '#ff4d6d']);
    if (eff.poison > 0) chips.push(['毒', eff.poison, '#7cff3a']);
    if (eff.barrier > 0) chips.push(['BAR', 0, '#7df9ff']);
    if (eff.magnet > 0) chips.push(['MAG', 0, '#b388ff']);
    if (eff.ghost > 0) chips.push(['透明', eff.ghost, '#9aa0b8']);
    if (balls.length > 1) chips.push([`●×${balls.length}`, 0, '#ffffff']);
    ctx.font = 'bold 10px -apple-system, sans-serif';
    chips.forEach(([label, t, col], i) => {
      const x = 10 + i * 46, y = boss ? top + 30 : top + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(x, y, 42, 12, 6); ctx.fill();
      ctx.fillStyle = col; ctx.fillText(t ? `${label} ${Math.ceil(t)}` : label, x + 5, y + 6.5);
    });
  }

  function draw() {
    drawBg();
    if (state === 'title') { drawTitle(); return; }

    // HUD（背景の上で読みやすいよう帯を敷く）
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, top);
    const th = themeOf(stage);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = th.accent;
    ctx.font = 'bold 11px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText(`STAGE ${stage}  ${th.name}`, 54, top / 2 - 4); // 左上の巻き戻しボタンの右
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText('SCORE ' + score, 54, top / 2 + 12);
    ctx.textAlign = 'right';
    ctx.fillText(lives > 5 ? `♥×${lives}` : '♥'.repeat(Math.max(lives, 0)), W - 140, top / 2 + 8); // 右上ボタンの左
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(0, top, W, 1);

    const fx = CFG.fx;

    drawRally();
    drawCurrents();
    drawBoss();

    const tiny = sizeK() < 0.5;
    for (const b of bricks) {
      if (!b.alive) continue;
      const ratio = b.hp / b.maxHp;
      if (tiny) { // 小さいブロックは軽い描き方（四角＋削れ具合の暗さ＋被弾の光）
        ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
        if (ratio < 1) { ctx.fillStyle = `rgba(0,0,0,${0.5 * (1 - ratio)})`; ctx.fillRect(b.x, b.y, b.w, b.h); }
        if (b.type === 'H' || b.type === 'I') { ctx.fillStyle = b.type === 'I' ? '#ffffff' : 'rgba(255,255,255,0.55)'; ctx.fillRect(b.x + b.w * 0.3, b.y + b.h * 0.3, b.w * 0.4, b.h * 0.4); }
        if (b.hitT > 0) { ctx.fillStyle = `rgba(255,255,255,${0.6 * b.hitT})`; ctx.fillRect(b.x, b.y, b.w, b.h); }
        continue;
      }
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 3);
      ctx.fill();
      decorateBrick(b);
      roundRect(b.x, b.y, b.w, b.h, 3); // 下の暗転処理用にパスを戻す
      // 削れるほど暗く
      if (ratio < 1) {
        ctx.fillStyle = `rgba(0,0,0,${0.45 * (1 - ratio)})`;
        ctx.fill();
        // ヒビ
        const nCrack = Math.min(3, Math.ceil((1 - ratio) * 3));
        ctx.strokeStyle = 'rgba(10,12,25,0.85)';
        ctx.lineWidth = 1.2;
        for (let k = 0; k < nCrack; k++) {
          const c = b.cracks[k];
          ctx.beginPath();
          ctx.moveTo(b.x + c[0] * b.w, b.y + c[1] * b.h);
          for (let i = 2; i < c.length; i += 2) ctx.lineTo(b.x + c[i] * b.w, b.y + c[i + 1] * b.h);
          ctx.stroke();
        }
      }
      // 当たった瞬間に白く光る
      if (b.hitT > 0) {
        ctx.fillStyle = `rgba(255,255,255,${0.5 * b.hitT})`;
        roundRect(b.x, b.y, b.w, b.h, 3);
        ctx.fill();
      }
      // HPバー
      const bh = Math.max(2, b.h * 0.14);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(b.x + 2, b.y + b.h - bh - 2, b.w - 4, bh);
      ctx.fillStyle = ratio > 0.5 ? '#ffffff' : ratio > 0.25 ? '#ffd166' : '#ff5d73';
      ctx.fillRect(b.x + 2, b.y + b.h - bh - 2, (b.w - 4) * ratio, bh);
    }

    // 破片
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // ダメージ数値
    if (dmgTexts.length) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const t of dmgTexts) {
        ctx.globalAlpha = Math.min(1, t.life / 0.4);
        ctx.font = t.kill ? 'bold 15px -apple-system, "Hiragino Sans", sans-serif' : 'bold 12px -apple-system, "Hiragino Sans", sans-serif';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillText(t.text, t.x + 1, t.y + 1);
        ctx.fillStyle = t.kill ? '#fff27a' : '#ffffff';
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }

    // ステージ開始・クリアなどの大きな表示
    if (banner) {
      const k = Math.min(1, banner.life / 0.4);
      const sc = 1 + 0.3 * Math.max(0, banner.life - 1.9);
      ctx.globalAlpha = k;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `italic 900 ${Math.round(W * 0.12 * sc)}px -apple-system, "Hiragino Sans", sans-serif`;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(banner.text, W / 2 + 2, H * 0.44 + 3);
      ctx.fillStyle = banner.color || '#ffffff';
      ctx.fillText(banner.text, W / 2, H * 0.44);
      if (banner.sub) {
        ctx.font = `bold ${Math.round(W * 0.06)}px -apple-system, "Hiragino Sans", sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(banner.sub, W / 2, H * 0.44 + W * 0.11);
      }
      ctx.globalAlpha = 1;
    }

    // パドル（打った瞬間に光る）
    if (paddleGlow > 0.02 && fx > 0 && eff.ghost <= 0) {
      ctx.fillStyle = `rgba(120,220,255,${0.35 * paddleGlow * Math.min(fx, 1.5)})`;
      const g = paddle.h * 1.2 * paddleGlow;
      roundRect(paddle.x - paddle.w / 2 - g, paddle.y - g, paddle.w + g * 2, paddle.h + g * 2, paddle.h / 2 + g);
      ctx.fill();
    }
    ctx.fillStyle = eff.stun > 0 ? (Math.sin(stageTime * 40) > 0 ? '#ffe14d' : '#9aa0b8') : paddleGlow > 0.5 ? '#ffffff' : '#e8ecff';
    if (eff.safe > 0) ctx.globalAlpha = Math.sin(stageTime * 25) > 0 ? 0.45 : 0.9; // 無敵中は点滅
    if (eff.ghost > 0) ctx.globalAlpha = Math.max(0, 1 - eff.ghost); // 透明（最後の1秒で戻る）
    if (eff.magnet > 0 && eff.ghost <= 0) { // マグネット中：両端が赤と青
      ctx.save(); ctx.fillStyle = '#ff4d6d'; ctx.fillRect(paddle.x - paddle.w / 2, paddle.y - 3, 10, 3);
      ctx.fillStyle = '#4dd8ff'; ctx.fillRect(paddle.x + paddle.w / 2 - 10, paddle.y - 3, 10, 3); ctx.restore();
    }
    roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, paddle.h / 2);
    ctx.fill();
    ctx.globalAlpha = 1;


    if (state !== 'over' && state !== 'allClear') {
      // ボールが多い時はビームを先頭12個まで（重くならないように）
      balls.forEach((b, i) => { useBall(b); if (i < 12) drawTrail(); drawBall(); });
      if (balls.length) useBall(balls[0]);
    }



    drawShots();
    drawExtras();
    drawBossBar();

    let msg = null, sub = null;
    if (paused)                 { msg = 'PAUSE'; sub = panelOpen ? '⚙ で閉じると再開' : '右上の ▶ で再開'; }
    else if (state === 'ready' && !banner) { msg = 'タップで発射'; sub = '横に擦ると回転・上に振ると強打・下に振ると減速'; }
    else if (state === 'over')  { msg = 'GAME OVER'; sub = `SCORE ${score} / 最高 ${bestRally} ラリー / タップでタイトルへ`; }
    else if (state === 'allClear') { msg = 'ALL CLEAR!!'; sub = `SCORE ${score} / タップでタイトルへ`; }
    if (msg) {
      if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H); }
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px -apple-system, "Hiragino Sans", sans-serif';
      ctx.fillText(msg, W / 2, H * 0.58);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = '13px -apple-system, "Hiragino Sans", sans-serif';
      ctx.fillText(sub, W / 2, H * 0.58 + 30);
    }
  }

  // ---- 調整パネル ----
  const sliderBox = document.getElementById('sliders');
  let soundTestBtns = [];
  const inputs = {};
  const decimals = step => (String(step).split('.')[1] || '').length;

  // ---- カテゴリごとに「開く／閉じる」（開閉状態は端末に保存。最初は全部閉じる） ----
  const OPEN_KEY = 'spinsmash-panel-open';
  let openState = {};
  try { openState = JSON.parse(localStorage.getItem(OPEN_KEY) || '{}'); } catch (e) {}
  function makeSection(title, parent) {
    const head = document.createElement('button');
    head.className = 'secHead';
    const body = document.createElement('div');
    body.className = 'secBody';
    const set = open => {
      body.classList.toggle('closed', !open);
      head.innerHTML = `<span>${title}</span><span class="arrow">${open ? '▼ 閉じる' : '▶ 開く'}</span>`;
    };
    set(!!openState[title]);
    head.addEventListener('click', () => {
      const open = body.classList.contains('closed');
      set(open);
      openState[title] = open;
      try { localStorage.setItem(OPEN_KEY, JSON.stringify(openState)); } catch (e) {}
    });
    parent.appendChild(head); parent.appendChild(body);
    return body;
  }
  let curSection = sliderBox;
  const sectionOf = {};
  for (const s of SLIDERS) {
    if (s.group) {
      curSection = makeSection(s.group, sliderBox);
      sectionOf[s.group] = curSection;
      continue;
    }
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML =
      `<div class="lab"><b>${s.label}</b><span></span></div>` +
      `<div class="key">${s.key}</div>` +
      `<input type="range" min="${s.min}" max="${s.max}" step="${s.step}">`;
    const input = row.querySelector('input');
    const val = row.querySelector('span');
    const show = () => { val.textContent = Number(CFG[s.key]).toFixed(decimals(s.step)); };
    input.value = CFG[s.key];
    show();
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      applyChange(s.key, v);
      show();
      saveCfg();
    });
    inputs[s.key] = { input, show };
    curSection.appendChild(row);
  }

  // ---- 実験：サイズ切り替え（ボール・ブロック・パドル） ----
  {
    const wrap = document.createElement('div');
    wrap.className = 'row';
    wrap.innerHTML = '<div class="lab"><b>サイズ（実験）</b></div><div class="key">ボール・ブロック・パドル</div>';
    const grid = document.createElement('div'); grid.className = 'stageBtns'; grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
    const opts = [[1, '1'], [0.5, '1/2'], [0.25, '1/4'], [0.125, '1/8']];
    const btns = opts.map(([v, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.addEventListener('click', () => {
        applyChange('sizeScale', v); saveCfg(); mark();
        if (state !== 'title') { // 今のステージを新しいサイズでやり直す
          paddle.w = W * CFG.paddleW * sizeK();
          loadStage(stage);
          pausedByPanel = false; setPanel(false); setPaused(false);
        }
      });
      grid.appendChild(b);
      return [v, b];
    });
    const mark = () => btns.forEach(([v, b]) => { b.style.background = Math.abs(CFG.sizeScale - v) < 1e-6 ? '#3d6bff' : ''; });
    mark();
    wrap.appendChild(grid);
    (sectionOf['基本'] || sliderBox).appendChild(wrap);
  }

  // ---- サウンドテスト ----
  {
    const box = makeSection('サウンドテスト', sliderBox);
    const list = [['title', 'タイトル']];
    for (let n = 1; n <= STAGES; n++) list.push(['s' + n, `${n} ${themeOf(n).name}`]);
    list.push(['boss', 'ボス'], ['last', 'ラスボス'], ['j:clear', 'クリア'], ['j:over', 'ゲームオーバー'], ['j:allclear', 'オールクリア']);
    const grid = document.createElement('div'); grid.className = 'songBtns';
    const btns = [];
    for (const [id, label] of list) {
      const b = document.createElement('button');
      b.textContent = '♪ ' + label;
      b.addEventListener('click', () => {
        SFX.init();
        SFX.music.preview(id);
        btns.forEach(x => x.classList.toggle('on', x === b && !id.startsWith('j:')));
      });
      btns.push(b); grid.appendChild(b);
    }
    const stop = document.createElement('button');
    stop.textContent = '■ 停止';
    stop.addEventListener('click', () => { SFX.music.stop(); btns.forEach(x => x.classList.remove('on')); });
    grid.appendChild(stop);
    box.appendChild(grid);
    soundTestBtns = btns;
  }
  // ---- テスト用（ボス戦・ステージ移動） ----
  makeSection('テスト用', sliderBox).appendChild(document.getElementById('testBox'));

  // 値の変更をプレイ中のボール・パドルへ即反映
  function applyChange(key, v) {
    if (state !== 'title' && !FREE_KEYS.includes(key)) rankedRun = false; // プレイ中に設定を変えたら参考記録
    const old = CFG[key];
    CFG[key] = v;
    if (key === 'paddleW' && paddle) layoutPaddle();
    if (key === 'maxSpeed' && ball && state === 'play' && speedOf() > H * v) setSpeed(H * v);
    if (key === 'maxSpin' && ball) clampSpin();
    if (key === 'volume' || key === 'muted') SFX.setVolume();
    if (key === 'bgmVol') SFX.music.setVol();
  }

  const pauseBtn = document.getElementById('pauseBtn');
  function setPaused(p) {
    paused = p;
    SFX.music.pause(p);
    pauseBtn.textContent = p ? '▶' : '⏸';
    pauseBtn.classList.toggle('on', p);
  }
  pauseBtn.addEventListener('click', () => { SFX.init(); pausedByPanel = false; setPaused(!paused); });

  // ⚙：パネル開閉。開いている間は自動でポーズ
  const panel = document.getElementById('panel');
  const gearBtn = document.getElementById('gearBtn');
  let pausedByPanel = false;
  function setPanel(open) {
    panelOpen = open;
    panel.classList.toggle('open', open);
    gearBtn.classList.toggle('on', open);
    if (open && !paused) { setPaused(true); pausedByPanel = true; }
    if (!open && pausedByPanel) { setPaused(false); pausedByPanel = false; }
    if (!open) { // サウンドテストのあと、今の場面の曲に戻す
      soundTestBtns.forEach(x => x.classList.remove('on'));
      if (state === 'title') SFX.music.play('title');
      else if (state === 'play' || state === 'ready') SFX.music.play(boss ? (stage === STAGES ? 'last' : 'boss') : 's' + stage);
      else SFX.music.stop();
      SFX.music.pause(paused);
    }
  }
  gearBtn.addEventListener('click', () => { SFX.init(); setPanel(!panelOpen); });

  const vMoveBtn = document.getElementById('vMoveBtn');
  function showVMove() {
    vMoveBtn.textContent = CFG.vMove ? '↕ 上下移動：オン' : '↔ 上下移動：オフ';
    vMoveBtn.classList.toggle('on', CFG.vMove);
  }
  vMoveBtn.addEventListener('click', () => {
    CFG.vMove = !CFG.vMove;
    if (paddle) { targetY = paddle.baseY; layoutPaddle(); }
    showVMove();
    saveCfg();
  });
  showVMove();

  const muteBtn = document.getElementById('muteBtn');
  function showMute() {
    muteBtn.textContent = CFG.muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('on', CFG.muted);
  }
  muteBtn.addEventListener('click', () => {
    SFX.init();
    applyChange('muted', !CFG.muted);
    showMute();
    saveCfg();
  });
  showMute();
  // パネル操作でも音を有効化
  document.getElementById('panel').addEventListener('touchstart', () => SFX.init(), { passive: true });
  document.getElementById('resetBtn').addEventListener('click', () => {
    for (const k in DEFAULTS) {
      if (k === 'muted' || k === 'vMove') continue; // ミュート・上下移動は初期化しない
      applyChange(k, DEFAULTS[k]);
      if (inputs[k]) { inputs[k].input.value = DEFAULTS[k]; inputs[k].show(); }
    }
    saveCfg();
  });
  document.getElementById('restartBtn').addEventListener('click', () => { goTitle(); pausedByPanel = false; setPanel(false); setPaused(false); });
  // ---- 巻き戻しボタン（押している間だけ） ----
  const rewindBtn = document.getElementById('rewindBtn');
  const setRewind = on => { rewinding = on; rewindBtn.classList.toggle('on', on); };
  rewindBtn.addEventListener('touchstart', e => { e.preventDefault(); SFX.init(); setRewind(true); }, { passive: false });
  rewindBtn.addEventListener('touchend', e => { e.preventDefault(); setRewind(false); }, { passive: false });
  rewindBtn.addEventListener('touchcancel', () => setRewind(false));
  rewindBtn.addEventListener('mousedown', () => { SFX.init(); setRewind(true); });
  window.addEventListener('mouseup', () => setRewind(false));

  // ---- タイトル画面 ----
  const titleUI = document.getElementById('titleUI');
  const rankUI = document.getElementById('rankUI');
  function setTitle(show) {
    titleUI.classList.toggle('hidden', !show);
    pauseBtn.classList.toggle('hidden', show);
    rewindBtn.classList.toggle('hidden', show);
    if (show) rankUI.classList.add('hidden');
  }
  document.getElementById('startBtn').addEventListener('click', () => { SFX.init(); newGame(1); });
  // ---- ランキング画面（みんな＝オンライン／この端末） ----
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rankList = document.getElementById('rankList'), rankNote = document.getElementById('rankNote');
  const tabAll = document.getElementById('tabAll'), tabMine = document.getElementById('tabMine');
  async function showRanking(tab) {
    tabAll.classList.toggle('on', tab === 'all'); tabMine.classList.toggle('on', tab === 'mine');
    if (tab === 'mine') {
      const list = loadScores();
      rankNote.textContent = 'この端末での記録（「参考」は設定を変えたプレイ）';
      rankList.innerHTML = list.length
        ? list.map((r, i) => `<li><span class="no">${i + 1}</span><span class="sc">${r.score}</span><span class="meta">STAGE ${r.stage}・${r.date}${r.ranked === false ? '・参考' : ''}</span></li>`).join('')
        : '<li><span class="meta">まだ記録がありません</span></li>';
      return;
    }
    if (!RANKING_URL) { rankNote.textContent = 'オンラインランキングは準備中です'; rankList.innerHTML = ''; return; }
    rankNote.textContent = '読み込み中…'; rankList.innerHTML = '';
    try {
      const res = await fetch(RANKING_URL);
      const data = await res.json();
      if (!tabAll.classList.contains('on')) return;
      rankNote.textContent = '上位50件';
      rankList.innerHTML = data.top && data.top.length
        ? data.top.map((r, i) => `<li><span class="no">${i + 1}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span><span class="meta">ST${r.stage}・${esc(r.date)}</span></li>`).join('')
        : '<li><span class="meta">まだ記録がありません</span></li>';
    } catch (e) {
      rankNote.textContent = '読み込めませんでした（通信を確認してください）';
    }
  }
  tabAll.addEventListener('click', () => showRanking('all'));
  tabMine.addEventListener('click', () => showRanking('mine'));
  document.getElementById('rankBtn').addEventListener('click', () => {
    SFX.init();
    rankUI.classList.remove('hidden');
    showRanking('all');
  });

  // ---- ゲーム終了時：名前を入れてランキングに送信 ----
  const NAME_KEY = 'spinsmash-name';
  const resultUI = document.getElementById('resultUI'), resNote = document.getElementById('resNote');
  const resForm = document.getElementById('resForm'), resOk = document.getElementById('resOk');
  const nameInput = document.getElementById('nameInput'), sendBtn = document.getElementById('sendBtn'), skipBtn = document.getElementById('skipBtn');
  function openResult() {
    if (!scoreSaved) saveScore();
    const cleared = state === 'allClear';
    state = 'result';
    document.getElementById('resTitle').textContent = cleared ? 'ALL CLEAR!!' : 'GAME OVER';
    document.getElementById('resScore').innerHTML = `SCORE <b>${score}</b><br>STAGE ${stage}・最高 ${bestRally} ラリー`;
    resNote.textContent = '';
    resOk.classList.add('hidden');
    sendBtn.disabled = skipBtn.disabled = false;
    const canSend = RANKING_URL && rankedRun && score > 0;
    resForm.classList.toggle('hidden', !canSend);
    if (!canSend) {
      resNote.textContent = !RANKING_URL ? 'オンラインランキングは準備中です（この端末に記録しました）'
        : !rankedRun ? '設定を変えたプレイのため、ランキングには送れません（この端末に参考記録として保存しました）'
        : '';
      resOk.classList.remove('hidden');
    } else {
      try { nameInput.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
    }
    resultUI.classList.remove('hidden');
  }
  function closeResult() { resultUI.classList.add('hidden'); goTitle(); }
  async function sendScore() {
    const name = nameInput.value.trim().slice(0, 10);
    if (!name) { resNote.textContent = '名前を入れてください'; nameInput.focus(); return; }
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
    nameInput.blur();
    sendBtn.disabled = skipBtn.disabled = true;
    resNote.textContent = '送信中…';
    try {
      // text/plain で送る（Apps Script の受け口で事前確認なしに受け取れる形式）
      const res = await fetch(RANKING_URL, { method: 'POST', body: JSON.stringify({ name, score, stage, rally: bestRally }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      resNote.textContent = `${data.rank}位にランクイン！`;
      resForm.classList.add('hidden');
      resOk.classList.remove('hidden');
      SFX.music.jingle('clear');
    } catch (e) {
      resNote.textContent = '送信できませんでした。通信を確認してもう一度お試しください';
      sendBtn.disabled = skipBtn.disabled = false;
    }
  }
  sendBtn.addEventListener('click', sendScore);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendScore(); });
  skipBtn.addEventListener('click', closeResult);
  resOk.addEventListener('click', closeResult);
  document.getElementById('rankClose').addEventListener('click', () => rankUI.classList.add('hidden'));

  // テスト用：ブロックを全部消してボス戦へ
  document.getElementById('bossBtn').addEventListener('click', () => {
    if (state === 'title') newGame(stage);
    rankedRun = false;
    for (const b of bricks) { b.alive = false; b.reviveT = 0; }
    if (!boss) spawnBoss();
    if (state === 'ready') launch();
    pausedByPanel = false; setPanel(false); setPaused(false);
  });

  // テスト用：ステージへ直接移動
  const stageBtns = document.getElementById('stageBtns');
  for (let n = 1; n <= STAGES; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', () => {
      if (state === 'title') newGame(n); else loadStage(n);
      rankedRun = false;
      pausedByPanel = false; setPanel(false); setPaused(false);
    });
    stageBtns.appendChild(b);
  }

  // アプリ切替などで非表示になったら自動ポーズ
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPaused(true); });

  // 回転メーター
  const spinVal = document.getElementById('spinVal');
  const spinFill = document.getElementById('spinFill');
  let lastMeter = null;
  const speedVal = document.getElementById('speedVal');
  const speedFill = document.getElementById('speedFill');
  const beamMark = document.getElementById('beamMark');
  let lastSpeedTxt = null;
  function updateSpeedMeter() {
    const v = state === 'play' ? speedOf() / H : 0;
    const txt = v.toFixed(2);
    if (txt === lastSpeedTxt) return;
    lastSpeedTxt = txt;
    const max = Math.max(CFG.maxSpeed, 0.1);
    speedVal.textContent = state === 'play' ? `${txt}（ダメージ ${damageAt(v * H)}）` : txt;
    speedFill.style.width = Math.min(100, v / max * 100) + '%';
    speedFill.style.background = v >= CFG.beamSpeed ? `rgb(${beamColor((v - CFG.beamSpeed) / Math.max(max - CFG.beamSpeed, 0.01)).join(',')})` : '#8890b0';
    beamMark.style.left = Math.min(100, CFG.beamSpeed / max * 100) + '%';
  }

  function updateMeter() {
    updateSpeedMeter();
    const ratio = Math.max(-1, Math.min(1, (ball.spin || 0) / (H * Math.max(CFG.maxSpin, 0.01))));
    const pct = Math.round(ratio * 100);
    if (pct === lastMeter) return;
    lastMeter = pct;
    spinVal.textContent = pct + '%';
    spinFill.style.width = Math.abs(ratio) * 50 + '%';
    spinFill.style.left = ratio >= 0 ? '50%' : (50 - Math.abs(ratio) * 50) + '%';
    spinFill.style.background = ratio >= 0 ? BALL_COLOR_B : BALL_COLOR_A;
  }

  // ---- 巻き戻し：直近5秒の状態を記録し、ボタンを押している間さかのぼる ----
  const REWIND_SEC = 5;
  let history = [], rewinding = false, rewindSfxT = 0, lastPX = 0, lastPY = 0;
  function snapshot() {
    return {
      balls: balls.map(b => ({ ...b, trail: null })), px: paddle.x, py: paddle.y, pw: paddle.w,
      br: bricks.map(b => [b.alive, b.hp, b.reviveT, b.revived]),
      score, lives, state, rally, chain, stageTime, windT, bossDone,
      items: items.map(i => ({ ...i })), eff: { ...eff }, fever, feverGauge,
      boss: boss ? { ...boss } : null, shots: shots.map(x => ({ ...x })),
    };
  }
  function restore(sn) {
    balls = sn.balls.map(b => ({ ...b, trail: [] }));
    useBall(balls[0]);
    paddle.x = paddle.prevX = sn.px; paddle.y = paddle.frameStartY = sn.py; paddle.w = sn.pw;
    paddle.vx = 0; paddle.vy = 0;
    targetX = sn.px; targetY = sn.py;
    // 指を置いたままでもパドルが飛ばないよう、ドラッグの基準を今の指の位置に合わせ直す
    touchStartX = lastPX; paddleStartX = sn.px; touchStartY = lastPY; paddleStartY = sn.py;
    sn.br.forEach((v, i) => { const b = bricks[i]; if (b) [b.alive, b.hp, b.reviveT, b.revived] = v; });
    ({ score, lives, state, rally, chain, stageTime, windT, bossDone, fever, feverGauge } = sn);
    items = sn.items.map(i => ({ ...i }));
    Object.assign(eff, sn.eff);
    boss = sn.boss ? { ...sn.boss } : null;
    shots = sn.shots.map(x => ({ ...x }));
    moveBricks(0);
    if (state === 'play' || state === 'ready') SFX.music.play(boss ? (stage === STAGES ? 'last' : 'boss') : 's' + stage);
    SFX.music.setFever(fever > 0);
  }
  function recordHistory() {
    if (state !== 'play' && state !== 'ready') return;
    history.push(snapshot());
    if (history.length > REWIND_SEC * 60) history.shift();
  }
  const canRewind = () => (state === 'play' || state === 'ready' || state === 'over') && history.length > 0;
  function rewindStep(dt) {
    // 2倍速でさかのぼる
    for (let i = 0; i < 2 && history.length; i++) restore(history.pop());
    rewindSfxT -= dt;
    if (rewindSfxT <= 0) { SFX.rewind(); rewindSfxT = 0.22; }
    updateBg(-dt * 2);
  }
  // 巻き戻し中の見た目（点滅なし：青みがかった色と表示）
  function drawRewind() {
    if (!rewinding || !canRewind()) return;
    ctx.fillStyle = 'rgba(60,110,255,0.14)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = 0; y < H; y += 4) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'italic 900 28px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('◀◀ REWIND', W / 2, H * 0.3);
    ctx.font = 'bold 12px -apple-system, "Hiragino Sans", sans-serif';
    ctx.fillText(`のこり ${(history.length / 60).toFixed(1)} 秒`, W / 2, H * 0.3 + 26);
  }

  // ---- ループ ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!paused) {
      if (rewinding && canRewind()) rewindStep(dt);
      else { update(dt); recordHistory(); }
    }
    draw();
    drawRewind();
    updateMeter();
    requestAnimationFrame(loop);
  }

  resize();
  goTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
