<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>SpinSmash</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b1020; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    color: #e8ecff;
  }
  #wrap { display: flex; width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; flex: 1 1 auto; min-width: 0; height: 100%; }

  /* ---- 調整パネル ---- */
  /* タイトル画面・ランキング */
  .hidden { display: none !important; }
  #titleUI {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 14px; padding-bottom: calc(env(safe-area-inset-bottom) + 16vh);
  }
  #titleUI button {
    pointer-events: auto; width: min(64vw, 260px); padding: 16px 0; border: 0; border-radius: 14px;
    font: 900 20px -apple-system, "Hiragino Sans", sans-serif; letter-spacing: .08em; color: #fff;
    background: linear-gradient(90deg, #ff4d6d, #4dd8ff); box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    touch-action: manipulation;
  }
  #titleUI button.sub { background: rgba(255,255,255,0.14); font-size: 16px; padding: 12px 0; }
  #rankUI {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .rankBox {
    width: min(86vw, 360px); max-height: 80vh; overflow-y: auto; box-sizing: border-box;
    background: #141a30; border-radius: 16px; padding: 18px; text-align: center;
  }
  .rankBox h2 { margin: 0 0 4px; font-size: 20px; }
  .rankBox .note { font-size: 11px; color: #9aa6d6; margin-bottom: 10px; }
  #rankList { list-style: none; margin: 0 0 14px; padding: 0; text-align: left; font-variant-numeric: tabular-nums; }
  #rankList li { display: flex; gap: 10px; padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
  #rankList li .no { width: 22px; color: #9aa6d6; }
  #rankList li .sc { flex: 1; font-weight: bold; }
  #rankList li .meta { color: #9aa6d6; font-size: 12px; }
  .rankBox button { padding: 10px 28px; border: 0; border-radius: 10px; background: #2b3560; color: #fff; font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin: 8px 0; }
  .tabs button { flex: 1; padding: 8px 0; border: 0; border-radius: 8px; background: #2b3560; color: #fff; font-size: 13px; }
  .tabs button.on { background: linear-gradient(90deg, #ff4d6d, #4dd8ff); font-weight: bold; }
  #rankList li .nm { width: 6.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #resultUI { position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
  .resScore { font-size: 15px; margin: 6px 0 12px; line-height: 1.6; }
  .resScore b { font-size: 26px; }
  #nameInput {
    width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25);
    background: #0b1020; color: #fff; font-size: 16px; text-align: center;
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  .resBtns { display: flex; gap: 8px; margin: 10px 0 6px; }
  .resBtns button, #resOk { flex: 1; padding: 12px 0; border: 0; border-radius: 10px; color: #fff; font-size: 14px; font-weight: bold;
    background: linear-gradient(90deg, #ff4d6d, #4dd8ff); }
  .resBtns button.sub { background: #2b3560; font-weight: normal; }
  #resOk { width: 100%; margin-top: 8px; }
  .stageBtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
  .stageBtns button { padding: 6px 0; border: 0; border-radius: 6px; background: #2b3560; color: #fff; font-size: 12px; }

  /* 右上の小さなボタン（ミュート・ポーズ・設定） */
  #hudBtns {
    position: fixed; z-index: 30;
    top: calc(env(safe-area-inset-top) + 10px); right: 8px;
    display: flex; gap: 6px;
  }
  #hudBtns button {
    width: 36px; height: 36px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 16px;
    padding: 0; touch-action: manipulation; font-family: inherit;
  }
  #hudBtns button.on { background: #ff4d6d; }
  #rewindBtn {
    position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 10px); left: 8px;
    width: 40px; height: 36px; border: 0; border-radius: 10px; padding: 0;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 16px; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #rewindBtn.on { background: #3d6bff; }

  /* 調整パネル：⚙で右から重ねて表示 */
  #panel {
    position: fixed; z-index: 20; top: 0; right: 0;
    width: clamp(150px, 44vw, 240px);
    height: 100%; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 56px) 8px calc(env(safe-area-inset-bottom) + 12px);
    background: rgba(20,26,48,0.96); border-left: 1px solid rgba(255,255,255,0.1);
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
    transform: translateX(105%); transition: transform 0.2s ease;
    overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    font-size: 11px;
  }
  #panel.open { transform: none; }
  .btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .btns button {
    flex: 1; padding: 9px 0; border: 0; border-radius: 8px;
    background: #2b3560; color: #fff; font-size: 12px; font-weight: bold; white-space: nowrap;
    font-family: inherit; touch-action: manipulation;
  }
  .btns button.on { background: #ff4d6d; }
  .meter { margin-bottom: 10px; }
  .meter .bar { position: relative; height: 8px; background: rgba(255,255,255,0.12); border-radius: 4px; margin-top: 4px; }
  .meter .fill { position: absolute; top: 0; height: 100%; border-radius: 4px; }
  .meter .mid { position: absolute; left: 50%; top: -3px; width: 1px; height: 14px; background: rgba(255,255,255,0.6); }
  .secHead {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    margin: 8px 0 4px; padding: 8px 8px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: #dfe6ff; font: bold 12px -apple-system, "Hiragino Sans", sans-serif;
    touch-action: manipulation;
  }
  .secHead .arrow { color: #9aa6d6; font-size: 10px; white-space: nowrap; margin-left: 6px; }
  .secHead span:first-child { text-align: left; }
  .secBody { padding: 4px 2px 2px; }
  .secBody.closed { display: none; }
  .songBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 6px; }
  .songBtns button { padding: 7px 2px; border: 0; border-radius: 6px; background: #2b3560; color: #fff; font-size: 11px; }
  .songBtns button.on { background: #3d6bff; }
  h3 { font-size: 11px; margin: 10px 0 4px; color: #9aa6d6; letter-spacing: .05em; }
  .row { margin-bottom: 8px; }
  .row .lab { display: flex; justify-content: space-between; gap: 4px; }
  .row .lab b { font-weight: 600; }
  .row .lab span { color: #4dd8ff; font-variant-numeric: tabular-nums; }
  .row .key { color: #6c78a8; font-size: 10px; }
  input[type=range] { width: 100%; margin: 4px 0 0; touch-action: pan-x; accent-color: #4dd8ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="titleUI" class="hidden">
    <button id="startBtn">スタート</button>
    <button id="rankBtn" class="sub">ランキング</button>
  </div>
  <div id="rankUI" class="hidden">
    <div class="rankBox">
      <h2>ランキング</h2>
      <div class="tabs"><button id="tabAll" class="on">みんな</button><button id="tabMine">この端末</button></div>
      <div class="note" id="rankNote"></div>
      <ol id="rankList"></ol>
      <button id="rankClose">とじる</button>
    </div>
  </div>
  <div id="resultUI" class="hidden">
    <div class="rankBox">
      <h2 id="resTitle">GAME OVER</h2>
      <div class="resScore" id="resScore"></div>
      <div id="resForm">
        <input id="nameInput" maxlength="10" placeholder="なまえ（10文字まで）" autocomplete="nickname" enterkeyhint="send">
        <div class="resBtns"><button id="sendBtn">ランキングに送信</button><button id="skipBtn" class="sub">送信しない</button></div>
      </div>
      <div class="note" id="resNote"></div>
      <button id="resOk" class="hidden">タイトルへ</button>
    </div>
  </div>
  <button id="rewindBtn" aria-label="巻き戻し" class="hidden">⏪</button>
  <div id="hudBtns">
    <button id="muteBtn" aria-label="ミュート">🔊</button>
    <button id="pauseBtn" aria-label="ポーズ">⏸</button>
    <button id="gearBtn" aria-label="設定">⚙</button>
  </div>
  <div id="panel">
    <div class="btns">
      <button id="resetBtn">値を初期化</button>
      <button id="restartBtn">タイトルへ</button>
    </div>
    <div class="btns">
      <button id="vMoveBtn">↕ 上下移動</button>
    </div>
    <div id="testBox">
      <div class="btns"><button id="bossBtn">ボス戦へ</button></div>
      <div class="lab" style="margin-bottom:4px">ステージへ移動</div>
      <div class="stageBtns" id="stageBtns"></div>
    </div>
    <div id="soundBox"></div>
    <div class="meter">
      <div class="lab">速度 <span id="speedVal">0</span></div>
      <div class="bar"><div class="fill" id="speedFill" style="left:0"></div><div class="mid" id="beamMark"></div></div>
    </div>
    <div class="meter">
      <div class="lab">回転 <span id="spinVal">0</span></div>
      <div class="bar"><div class="fill" id="spinFill"></div><div class="mid"></div></div>
    </div>
    <div id="sliders"></div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---- 基本設定 ----
  const COLS = 7, ROWS = 6, LIVES = 5;
  // ブロックのHP（上＝奥の段 → 下＝手前の段）
  const HP_BY_ROW = [100, 75, 55, 35, 20, 10];
  const DMG_MIN = 1, DMG_MAX = 100; // 初期速度で1、最高速度で100
  const COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];
  const BALL_COLOR_A = '#ff4d6d';
  const BALL_COLOR_B = '#4dd8ff';
  const STAGES = 10;
  // オンラインランキングの送信先（Google Apps Script のウェブアプリURL）。空なら端末内のみ
  const RANKING_URL = 'https://script.google.com/macros/s/AKfycbxRo_Qw_NBhHSL5RvNaRYkSm--3pAhc8pyG5BgpHlO1gPM9aRoY62q5XXf04JaB_o5B/exec';

  // ---- ステージのテーマ（属性） ----
  // bg: 背景の基本色（上下同色→中央色で継ぎ目なくループ）、blocks: 上の段→下の段の色、paint: 背景の模様
  function rngOf(seed) {
    return () => {
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // 縦にループする背景用：はみ出した模様を反対側にも描く
  function wrapY(th, y, size, fn) {
    fn(y);
    if (y - size < 0) fn(y + th);
    if (y + size > th) fn(y - th);
  }
  const THEMES = [
    { key: 'grass', name: 'くさ', bg: ['#0e2614', '#17391d'], accent: '#7ddc6a',
      blocks: ['#1b5e20', '#2e7d32', '#43a047', '#66bb6a', '#9ccc65', '#c5e1a5'],
      paint(g, w, th, R) {
        for (let i = 0; i < 70; i++) {               // 草むら
          const x = R() * w, y = R() * th, n = 3 + (R() * 4 | 0), hgt = 10 + R() * 22;
          wrapY(th, y, hgt, yy => {
            g.strokeStyle = `rgba(90,180,80,${0.18 + R() * 0.2})`; g.lineWidth = 1.5;
            for (let k = 0; k < n; k++) {
              g.beginPath(); g.moveTo(x + k * 3, yy);
              g.quadraticCurveTo(x + k * 3 + (R() - 0.5) * 8, yy - hgt * 0.6, x + k * 3 + (R() - 0.5) * 14, yy - hgt);
              g.stroke();
            }
          });
        }
        for (let i = 0; i < 30; i++) {               // 葉っぱ
          const x = R() * w, y = R() * th, sz = 6 + R() * 10, a = R() * Math.PI;
          wrapY(th, y, sz, yy => {
            g.fillStyle = 'rgba(70,150,60,0.25)';
            g.beginPath(); g.ellipse(x, yy, sz, sz * 0.4, a, 0, Math.PI * 2); g.fill();
          });
        }
      } },
    { key: 'water', name: 'みず', bg: ['#061d36', '#0b2f52'], accent: '#5ec8ff',
      blocks: ['#0d47a1', '#1565c0', '#1e88e5', '#29b6f6', '#4dd0e1', '#80deea'],
      paint(g, w, th, R) {
        const rows = Math.round(th / 70);
        for (let i = 0; i < rows; i++) {             // 波
          const y0 = i * th / rows, ph = R() * 6;
          g.strokeStyle = 'rgba(120,200,255,0.13)'; g.lineWidth = 2;
          g.beginPath();
          for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x * 0.03 + ph) * 8);
          g.stroke();
        }
        for (let i = 0; i < 45; i++) {               // 泡
          const x = R() * w, y = R() * th, r = 2 + R() * 9;
          wrapY(th, y, r, yy => {
            g.strokeStyle = `rgba(170,230,255,${0.2 + R() * 0.25})`; g.lineWidth = 1.2;
            g.beginPath(); g.arc(x, yy, r, 0, Math.PI * 2); g.stroke();
          });
        }
      } },
    { key: 'fire', name: 'ほのお', bg: ['#260a05', '#3d1408'], accent: '#ff8a3d',
      blocks: ['#b71c1c', '#d84315', '#f4511e', '#fb8c00', '#ffb300', '#ffd54f'],
      paint(g, w, th, R) {
        for (let i = 0; i < 22; i++) {               // 炎のゆらめき
          const x = R() * w, y = R() * th, s = 14 + R() * 26;
          wrapY(th, y, s * 1.6, yy => {
            g.fillStyle = `rgba(255,${90 + R() * 60 | 0},30,0.16)`;
            g.beginPath(); g.moveTo(x, yy - s * 1.6);
            g.bezierCurveTo(x + s, yy - s * 0.4, x + s * 0.7, yy + s * 0.6, x, yy + s * 0.6);
            g.bezierCurveTo(x - s * 0.7, yy + s * 0.6, x - s, yy - s * 0.4, x, yy - s * 1.6);
            g.fill();
          });
        }
        for (let i = 0; i < 90; i++) {               // 火の粉
          const x = R() * w, y = R() * th;
          wrapY(th, y, 3, yy => {
            g.fillStyle = `rgba(255,${150 + R() * 80 | 0},60,${0.3 + R() * 0.4})`;
            g.beginPath(); g.arc(x, yy, 0.8 + R() * 1.8, 0, Math.PI * 2); g.fill();
          });
        }
      } },
    { key: 'electric', name: 'でんき', bg: ['#0f1228', '#1b1f3e'], accent: '#ffe14d',
      blocks: ['#ff8f00', '#ffab00', '#ffc400', '#ffd600', '#ffea00', '#fff59d'],
      paint(g, w, th, R) {
        const n = Math.round(th / 40), step = th / n;  // 回路のグリッド
        g.strokeStyle = 'rgba(255,230,80,0.06)'; g.lineWidth = 1;
        for (let i = 0; i < n; i++) { g.beginPath(); g.moveTo(0, i * step); g.lineTo(w, i * step); g.stroke(); }
        for (let x = 0; x < w; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, th); g.stroke(); }
        for (let i = 0; i < 10; i++) {               // 稲妻
          const x0 = R() * w, y0 = R() * th, len = 60 + R() * 90;
          const pts = [[x0, y0]];
          for (let k = 0; k < 6; k++) pts.push([pts[k][0] + (R() - 0.5) * 30, pts[k][1] + len / 6]);
          wrapY(th, y0 + len / 2, len / 2 + 10, yy => {
            const off = yy - (y0 + len / 2);
            g.strokeStyle = 'rgba(255,235,90,0.32)'; g.lineWidth = 2;
            g.beginPath(); pts.forEach(([px, py], k) => k ? g.lineTo(px, py + off) : g.moveTo(px, py + off)); g.stroke();
          });
        }
      } },
    { key: 'sky', name: 'ひこう', bg: ['#173b63', '#25588a'], accent: '#bfe6ff',
      blocks: ['#1565c0', '#1e88e5', '#42a5f5', '#90caf9', '#e3f2fd', '#fff9c4'],
      paint(g, w, th, R) {
        for (let i = 0; i < 14; i++) {               // 雲
          const x = R() * w, y = R() * th, s = 20 + R() * 30;
          wrapY(th, y, s, yy => {
            g.fillStyle = 'rgba(255,255,255,0.13)';
            for (let k = 0; k < 5; k++) {
              g.beginPath(); g.ellipse(x + (k - 2) * s * 0.55, yy + (R() - 0.5) * s * 0.4, s * 0.6, s * 0.4, 0, 0, Math.PI * 2); g.fill();
            }
          });
        }
        for (let i = 0; i < 30; i++) {               // 風の筋
          const x = R() * w, y = R() * th, len = 30 + R() * 70;
          wrapY(th, y, len, yy => {
            g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 1;
            g.beginPath(); g.moveTo(x, yy - len / 2); g.lineTo(x, yy + len / 2); g.stroke();
          });
        }
      } },
    { key: 'rock', name: 'いわ', bg: ['#241b14', '#36291e'], accent: '#d2a679',
      blocks: ['#4e342e', '#6d4c41', '#8d6e63', '#a1887f', '#bcaaa4', '#d7ccc8'],
      paint(g, w, th, R) {
        for (let i = 0; i < 45; i++) {               // 岩
          const x = R() * w, y = R() * th, s = 8 + R() * 26, n = 5 + (R() * 3 | 0);
          const vs = []; for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, r = s * (0.7 + R() * 0.3); vs.push([Math.cos(a) * r, Math.sin(a) * r * 0.8]); }
          wrapY(th, y, s, yy => {
            g.fillStyle = 'rgba(120,95,70,0.35)'; g.strokeStyle = 'rgba(30,20,12,0.5)'; g.lineWidth = 1.5;
            g.beginPath(); vs.forEach(([vx, vy], k) => k ? g.lineTo(x + vx, yy + vy) : g.moveTo(x + vx, yy + vy)); g.closePath(); g.fill(); g.stroke();
          });
        }
      } },
    { key: 'ice', name: 'こおり', bg: ['#0b2534', '#123a50'], accent: '#a8ecff',
      blocks: ['#01579b', '#0288d1', '#4fc3f7', '#81d4fa', '#b3e5fc', '#e1f5fe'],
      paint(g, w, th, R) {
        for (let i = 0; i < 20; i++) {               // 雪の結晶
          const x = R() * w, y = R() * th, s = 8 + R() * 16;
          wrapY(th, y, s, yy => {
            g.strokeStyle = 'rgba(200,240,255,0.3)'; g.lineWidth = 1.2;
            for (let k = 0; k < 6; k++) {
              const a = k * Math.PI / 3, ex = x + Math.cos(a) * s, ey = yy + Math.sin(a) * s;
              g.beginPath(); g.moveTo(x, yy); g.lineTo(ex, ey); g.stroke();
              const mx = x + Math.cos(a) * s * 0.6, my = yy + Math.sin(a) * s * 0.6;
              for (const d of [-0.6, 0.6]) { g.beginPath(); g.moveTo(mx, my); g.lineTo(mx + Math.cos(a + d) * s * 0.3, my + Math.sin(a + d) * s * 0.3); g.stroke(); }
            }
          });
        }
        for (let i = 0; i < 18; i++) {               // 氷のかけら
          const x = R() * w, y = R() * th, s = 10 + R() * 20;
          wrapY(th, y, s, yy => {
            g.fillStyle = 'rgba(160,220,255,0.1)';
            g.beginPath(); g.moveTo(x, yy - s); g.lineTo(x + s * 0.4, yy + s * 0.6); g.lineTo(x - s * 0.4, yy + s * 0.3); g.closePath(); g.fill();
          });
        }
      } },
    { key: 'poison', name: 'どく', bg: ['#1c0b28', '#2b1240'], accent: '#a6ff4d',
      blocks: ['#4a148c', '#6a1b9a', '#8e24aa', '#ab47bc', '#76ff03', '#b2ff59'],
      paint(g, w, th, R) {
        for (let i = 0; i < 30; i++) {               // 毒のもや
          const x = R() * w, y = R() * th, r = 10 + R() * 30;
          wrapY(th, y, r, yy => { g.fillStyle = 'rgba(170,60,220,0.12)'; g.beginPath(); g.arc(x, yy, r, 0, Math.PI * 2); g.fill(); });
        }
        for (let i = 0; i < 16; i++) {               // しずく

      function stop() { song = null; songId = null; pendingId = null; }
      function jingle(id) {
        stop();
        if (!ac || !bus) return;
        const j = JINGLES[id], six = 60 / j.bpm / 4;
        let t = ac.currentTime + 0.05;
        for (const [m, len] of j.lead) { note(0.25, m, t, len * six * 0.95, 0.14); t += len * six; }
        t = ac.currentTime + 0.05;
        for (const [m, len] of j.bass) { note('tri', m, t, len * six * 0.95, 0.26); t += len * six; }
      }
      return {
        setup, play, stop, jingle, setVol,
        setFever(on) { fever = on; },
        // サウンドテスト用：ポーズ中でも最初から鳴らす
        preview(id) {
          paused = false; setVol();
          if (id.startsWith('j:')) { jingle(id.slice(2)); return; }
          songId = null; play(id);
        },
        pause(p) { paused = p; setVol(); if (!p && ac) nextT = ac.currentTime + 0.05; },
        current: () => songId,
      };
    })();

    function init() {
      if (ac) { if (ac.state !== 'running') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      // iOS 17+：マナーモード中でも鳴らす（未対応なら無視）
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ac = new AC();
      master = ac.createGain();
      master.connect(ac.destination);
      setVolume();
      // 使い回すホワイトノイズ
      noise = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      Music.setup();
    }

    function setVolume() {
      if (master) master.gain.value = CFG.muted ? 0 : CFG.volume;
    }

    // 同じ種類の音が同時に重なりすぎないように
    function ok(kind, gapMs) {
      if (!ac || CFG.muted || CFG.volume <= 0) return false;
      const now = performance.now();
      if (lastPlay[kind] && now - lastPlay[kind] < gapMs) return false;
      lastPlay[kind] = now;
      return true;
    }

    // 卓球の「コン」：短い倍音＋ごく短いノイズのアタック
    function pock(freq, decay, gain, bright) {
      const t = ac.currentTime;
      const out = ac.createGain();
      out.gain.setValueAtTime(gain, t);
      out.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      out.connect(master);

      for (const [mul, g] of [[1, 1], [2.32, 0.35], [3.9, 0.12]]) {
        const o = ac.createOscillator();
        const og = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq * mul * 1.15, t);
        o.frequency.exponentialRampToValueAtTime(freq * mul, t + 0.012);
        og.gain.value = g;
        o.connect(og); og.connect(out);
        o.start(t); o.stop(t + decay + 0.02);
      }

      const n = ac.createBufferSource();
      n.buffer = noise;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = bright; bp.Q.value = 1.2;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(gain * 0.9, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
      n.connect(bp); bp.connect(ng); ng.connect(master);
      n.start(t); n.stop(t + 0.02);
    }

    // 鋭いアタック「カッ」：ごく短い高域ノイズ
    function click(gain, freq, len) {
      const t = ac.currentTime;
      const n = ac.createBufferSource();
      n.buffer = noise;
      const hp = ac.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = freq;
      const g = ac.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      n.connect(hp); hp.connect(g); g.connect(master);
      n.start(t); n.stop(t + len + 0.01);
    }

    // 打球後の風切り「シュー！」：帯域が上がって下がる（通り過ぎる感じ）
    function whoosh(amount, pitch) {
      const t = ac.currentTime + 0.015;
      const len = 0.2 + 0.5 * amount;
      const n = ac.createBufferSource();
      n.buffer = noise; n.loop = true;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(1400 * pitch, t);
      bp.frequency.exponentialRampToValueAtTime(5500 * pitch, t + len * 0.35);
      bp.frequency.exponentialRampToValueAtTime(2200 * pitch, t + len);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.15 + 0.6 * amount, t + len * 0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      n.connect(bp); bp.connect(g); g.connect(master);
      n.start(t); n.stop(t + len + 0.02);
    }

    function tone(f0, f1, start, dur, gain, type) {
      const t = ac.currentTime + start;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.02);
    }

    // ラリーが続くほど音程が上がる
    const rallyPitch = (rally) => 1 + Math.min(rally, 16) * 0.025;

    return {
      init, setVolume, music: Music,
      // power: 当たりの強さ 0〜1 / spin: 回転の強さ 0〜1
      paddle(power, spin, rally) {
        if (!ok('paddle', 40)) return;
        const p = rallyPitch(rally);
        tone(170 * p, 65, 0, 0.09, 0.55 + 0.4 * power);               // ドンという芯（力強さ）
        pock(820 * p, 0.1, 0.5 + 0.35 * power, 2600);                // ラバーの「コン」
        pock(2400 * p, 0.035, 0.12 + 0.3 * power, 6000);             // スマッシュの抜け
        click(0.2 + 0.9 * spin, 2500 + 3500 * spin, 0.008 + 0.012 * spin); // 「カッ！」
        if (spin > 0.06) whoosh(Math.min(1, spin), p);               // 「シュー！」
      },
      wall(power) {
        if (!ok('wall', 35)) return;

        click(0.12 + 0.2 * power, 4500, 0.006);
      },
      // 削っただけ：鈍い「ゴッ」。削れているほど低く濁る
      brickHit(row, power, worn) {
        if (!ok('brickHit', 30)) return;
        const f = (700 + (ROWS - 1 - row) * 40) * (1 - 0.25 * worn);
        tone(180, 90, 0, 0.06, 0.25 + 0.2 * power);
        pock(f, 0.05, 0.3 + 0.3 * power, 1800);
      },
      brick(row, power, chain, pierce) {
        if (!ok('brick', 30)) return;
        if (pierce) click(0.35, 3000, 0.02); // 砕ける「バキッ」
        const f = (1500 + (ROWS - 1 - row) * 90) * (1 + Math.min(chain, 10) * 0.05);
        tone(240, 110, 0, 0.05, 0.2 + 0.25 * power);
        pock(f, 0.08, 0.45 + 0.4 * power, 4000);
        click(0.18 + 0.25 * power, 5000, 0.007);
      },
      rallyUp(rally) { // 5ラリーごとのごほうび音
        if (!ok('rallyUp', 300)) return;
        const p = rallyPitch(rally);
        [0, 0.07, 0.14].forEach((d, i) => tone(1320 * p * (1 + i * 0.26), 1320 * p * (1 + i * 0.26), d, 0.12, 0.18, 'triangle'));
      },
      // 「ギュイーン！」：amount=加速の大きさ 0〜1、level=今の速さ 0〜1
      powerUp(amount, level) {
        if (!ok('powerUp', 60)) return;
        const a = Math.max(0.15, Math.min(1, amount));
        const t = ac.currentTime + 0.03;
        const dur = 0.25 + 0.45 * a;
        const f0 = 140 + 420 * level, f1 = f0 * (2 + 1.2 * a);
        const out = ac.createGain();
        out.gain.setValueAtTime(0.0001, t);
        out.gain.exponentialRampToValueAtTime(0.16 + 0.18 * a, t + 0.05);
        out.gain.setValueAtTime(0.16 + 0.18 * a, t + dur * 0.7);
        out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.Q.value = 9;
        lp.frequency.setValueAtTime(500, t);
        lp.frequency.exponentialRampToValueAtTime(5000 + 4000 * level, t + dur * 0.8);
        lp.connect(out); out.connect(master);
        // うなり（ビブラート）
        const lfo = ac.createOscillator();
        const lfoG = ac.createGain();
        lfo.frequency.value = 16 + 10 * a;
        lfoG.gain.value = f0 * 0.05;
        lfo.connect(lfoG);
        for (const [type, det] of [['sawtooth', 1], ['square', 1.007]]) {
          const o = ac.createOscillator();
          o.type = type;
          o.frequency.setValueAtTime(f0 * det, t);
          o.frequency.exponentialRampToValueAtTime(f1 * det, t + dur * 0.85);
          lfoG.connect(o.frequency);
          const g = ac.createGain(); g.gain.value = type === 'square' ? 0.4 : 0.6;
          o.connect(g); g.connect(lp);
          o.start(t); o.stop(t + dur + 0.02);
        }
        lfo.start(t); lfo.stop(t + dur + 0.02);
      },
      // ビームが出た瞬間：きらめき＋噴射
      beamOn() {
        if (!ok('beamOn', 400)) return;
        [1760, 2217, 2637].forEach((f, i) => tone(f, f * 1.02, 0.12 + i * 0.05, 0.25, 0.14, 'triangle'));
        whoosh(1, 0.8);
        tone(90, 45, 0.05, 0.4, 0.45);
      },
      // アイテム取得：ピロリン
      item() {
        if (!ok('item', 80)) return;
        [1320, 1760, 2640].forEach((f, i) => tone(f, f, i * 0.05, 0.09, 0.18, 'square'));
      },
      // 1UP：ファンファーレ
      oneUp() {
        if (!ok('oneUp', 300)) return;
        [1046, 1318, 1568, 2093, 1568, 2093].forEach((f, i) => tone(f, f, i * 0.07, 0.1, 0.2, 'square'));
      },
      // PERFECT：キラーン
      perfect() {
        if (!ok('perfect', 100)) return;
        tone(2637, 2637, 0, 0.08, 0.22, 'triangle');
        tone(3520, 3520, 0.06, 0.18, 0.2, 'triangle');
        click(0.4, 6000, 0.01);
      },
      // 防御で弾かれた：カキン
      clank() {
        if (!ok('clank', 60)) return;
        tone(2200, 2100, 0, 0.12, 0.2, 'square');
        tone(3300, 3200, 0, 0.08, 0.12, 'triangle');
      },
      // 放電：バチッ
      zap() {
        if (!ok('zap', 80)) return;
        click(0.6, 1500, 0.06);
        tone(1800, 300, 0, 0.08, 0.15, 'sawtooth');
      },
      // 延焼：ボッ
      burn() {
        if (!ok('burn', 80)) return;
        whoosh(0.5, 0.4);
        tone(160, 60, 0, 0.15, 0.3);
      },
      // 毒：ぶくぶく
      poisoned() {
        if (!ok('poisoned', 300)) return;
        [0, 0.06, 0.12].forEach(d => tone(300 + Math.random() * 200, 120, d, 0.08, 0.15, 'sine'));
      },
      // フィーバー開始・終了
      feverStart() {
        if (!ok('feverStart', 500)) return;
        [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, f * 1.01, i * 0.06, 0.16, 0.2, 'square'));
        whoosh(1, 1.2);
      },
      feverEnd() {
        if (!ok('feverEnd', 500)) return;
        tone(1046, 392, 0, 0.4, 0.15, 'square');
      },
      // ボス登場：警報
      bossAppear() {
        if (!ok('bossAppear', 1000)) return;
        for (let i = 0; i < 3; i++) { tone(880, 660, i * 0.45, 0.2, 0.25, 'square'); tone(660, 880, i * 0.45 + 0.2, 0.2, 0.25, 'square'); }
        tone(80, 40, 0, 1.2, 0.5);
      },
      bossShoot(key) {
        if (!ok('bossShoot', 120)) return;
        tone(key === 'electric' ? 1800 : 700, key === 'electric' ? 900 : 250, 0, 0.12, 0.15, 'square');
      },
      bossHit(power) {
        if (!ok('bossHit', 50)) return;
        tone(140, 50, 0, 0.15, 0.5 + 0.3 * power);
        pock(500, 0.08, 0.5, 1500);
        click(0.4, 2000, 0.02);
      },
      bossDown() {
        if (!ok('bossDown', 1000)) return;
        for (let i = 0; i < 5; i++) setTimeout(() => { tone(200, 30, 0, 0.6, 0.6); click(0.6, 800, 0.15); }, i * 160);
      },
      // 巻き戻し：キュルキュル
      rewind() {
        if (!ok('rewind', 100)) return;
        tone(1400, 500, 0, 0.1, 0.08, 'sawtooth');
        tone(1800, 700, 0.1, 0.1, 0.06, 'sawtooth');
      },
      // マグネット吸着：カチッ
      magnet() {
        if (!ok('magnet', 60)) return;
        tone(600, 900, 0, 0.05, 0.18, 'square');
      },
      // ハズレ（透明）：ポワワン
      ghost() {
        if (!ok('ghost', 300)) return;
        tone(600, 200, 0, 0.35, 0.2, 'sine');
        tone(620, 210, 0.05, 0.35, 0.12, 'triangle');
      },
      // 弾を消した：パリン
      shotBreak() {
        if (!ok('shotBreak', 40)) return;
        click(0.35, 4000, 0.03);
        tone(1600, 2400, 0, 0.06, 0.12, 'triangle');
      },
      // しびれた：ビリビリ
      stunned() {
        if (!ok('stunned', 200)) return;
        const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
        o.type = 'square'; o.frequency.value = 220;
        lfo.frequency.value = 30; lg.gain.value = 120; lfo.connect(lg); lg.connect(o.frequency);
        g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.52); lfo.start(t); lfo.stop(t + 0.52);
      },
      // 減速：「ヒュゥン」と下がっていく音
      powerDown(amount) {
        if (!ok('powerDown', 80)) return;
        const t = ac.currentTime + 0.02, dur = 0.25 + 0.25 * amount;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.Q.value = 6;
        lp.frequency.setValueAtTime(4000, t);
        lp.frequency.exponentialRampToValueAtTime(300, t + dur);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.25 + 0.15 * amount, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        lp.connect(g); g.connect(master);
        const o = ac.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(900, t);
        o.frequency.exponentialRampToValueAtTime(160, t + dur);
        o.connect(lp); o.start(t); o.stop(t + dur + 0.02);
      },
      // 自爆：ドカーン
      selfDestruct() {
        if (!ok('selfDestruct', 300)) return;
        const t = ac.currentTime;
        const n = ac.createBufferSource();
        n.buffer = noise; n.loop = true;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(4000, t);
        lp.frequency.exponentialRampToValueAtTime(120, t + 0.8);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.9, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        n.connect(lp); lp.connect(g); g.connect(master);
        n.start(t); n.stop(t + 0.95);
        tone(140, 35, 0, 0.7, 0.8);
        tone(420, 140, 0.05, 0.4, 0.25, 'triangle');
      },
      miss() {
        if (!ok('miss', 200)) return;
        tone(420, 140, 0, 0.35, 0.35, 'triangle');
      },
      clear() {
        if (!ok('clear', 500)) return;
        [1320, 1660, 1980, 2640].forEach((f, i) => setTimeout(() => { pock(f, 0.15, 0.6, 4000); click(0.3, 5000, 0.01); }, i * 100));
      },
    };
  })();

  const STORE_KEY = 'breakout-test-cfg-v2';
  const CFG = { ...DEFAULTS };
  try { Object.assign(CFG, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}
  // 旧方式（加算）の値が残っていたら新方式（倍率）の初期値にする
  if (!(CFG.spinAccel >= 1)) CFG.spinAccel = DEFAULTS.spinAccel;
  // 最高速度の初期値を2.5→1.8に変更（保存済みの値が旧初期値のままなら新しい値に）
  if (!(CFG.cfgVer >= 3)) { if (CFG.maxSpeed === 2.5) CFG.maxSpeed = DEFAULTS.maxSpeed; CFG.cfgVer = 3; }
  // 残機の初期値を3→5に変更
  if (!(CFG.cfgVer >= 4)) { if (CFG.startLives === 3) CFG.startLives = DEFAULTS.startLives; CFG.cfgVer = 4; }
  function saveCfg() { try { localStorage.setItem(STORE_KEY, JSON.stringify(CFG)); } catch (e) {} }

  let W, H, dpr, top, safeBottom;
  let paddle, ball, bricks, score, lives, state, targetX, targetY, paused = false, panelOpen = false;
  let brickBottom = 0;            // ブロック領域の下端
  let stage = 1, stageTimer = 0, scoreSaved = false;
  let touchStartY = 0, paddleStartY = 0;
  // 演出用
  let rally = 0, chain = 0, bestRally = 0;
  let paddleGlow = 0, rallyPop = 0;
  let trail = [], particles = [], dmgTexts = [], banner = null;
  // 複数ボール：balls に全部、ball は「いま処理・描画しているボール」
  let balls = [];
  function useBall(b) { ball = b; trail = b.trail || (b.trail = []); }
  let fingerDown = false, releasing = false;

  // ---- 背景：テーマの模様を1枚描いておき、上から下へスクロール ----
  let bgTile = null, bgOffset = 0, bgTheme = null, streakLen = 0;
  const streaks = Array.from({ length: 16 }, () => ({ x: Math.random(), y: Math.random(), len: 0.04 + Math.random() * 0.08, sp: 1.6 + Math.random() * 1.6 }));
  function buildBg(theme) {
    bgTheme = theme;
    const th = Math.ceil(H * 3); // 速くスクロールしても繰り返しが目立たない長さ
    const c = document.createElement('canvas');
    c.width = Math.ceil(W * dpr); c.height = Math.ceil(th * dpr);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    const grad = g.createLinearGradient(0, 0, 0, th);
    grad.addColorStop(0, theme.bg[0]); grad.addColorStop(0.5, theme.bg[1]); grad.addColorStop(1, theme.bg[0]);
    g.fillStyle = grad; g.fillRect(0, 0, W, th);
    theme.paint(g, W, th, rngOf(STAGE_ORDER.indexOf(theme.key) * 97 + 13));
    bgTile = { c, th };
  }
  function drawBg() {
    if (!bgTile) return;
    const th = bgTile.th, y0 = bgOffset % th;
    ctx.drawImage(bgTile.c, 0, y0 - th, W, th);
    ctx.drawImage(bgTile.c, 0, y0, W, th);
    // 高速で前進している感じの光の筋
    if (CFG.fx > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (const s of streaks) {
        const x = s.x * W, y = (s.y * H) % H;
        ctx.moveTo(x, y); ctx.lineTo(x, y + (s.len + streakLen) * H);
      }
      ctx.stroke();
    }
  }
  function updateBg(dt) {
    // ボールが速いほどスクロールも速く
    const v = (state === 'play' && ball && ball.vx != null) ? speedOf() / H : 0;
    const sp = H * (0.25 + 0.35 * Math.min(1, v / Math.max(CFG.maxSpeed, 0.1))) * CFG.bgSpeed;
    bgOffset = ((bgOffset + sp * dt) % 1e7 + 1e7) % 1e7;
    // 光の筋：速いほど長く伸ばし、動きは抑えめにしてチラつきを防ぐ
    streakLen = Math.min(0.6, sp / H * 0.12);
    const ssp = Math.min(sp, H * 3);
    for (const s of streaks) { s.y += s.sp * ssp / H * dt; if (s.y > 1.1) { s.y -= 1.2 + s.len; s.x = Math.random(); } if (s.y < -0.3) s.y += 1.3; }
  }

  // ---- 画面サイズに合わせてレイアウト ----
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    top = 56;
    safeBottom = Math.max(40, H * 0.08);
    if (bricks) layoutBricks();
    if (paddle) layoutPaddle();
    if (bgTheme) buildBg(bgTheme);
  }

  function layoutPaddle() {
    paddle.w = W * CFG.paddleW * sizeK();
    paddle.h = Math.max(10, W * 0.035) * sizeK();
    paddle.baseY = H - safeBottom - paddle.h;      // 一番下（従来の位置）
    paddle.minY = Math.min(paddle.baseY, brickBottom + Math.max(12, W * 0.06)); // ブロックのすぐ下
    if (!CFG.vMove || paddle.y == null) paddle.y = paddle.baseY;
    paddle.y = Math.max(paddle.minY, Math.min(paddle.baseY, paddle.y));
    if (targetY == null || !CFG.vMove) targetY = paddle.y;
    paddle.x = Math.min(Math.max(paddle.x, -paddle.w / 2), W + paddle.w / 2);
  }

  let rowAmp = [];
  function layoutBricks() {
    const S = sizeK(), cols = colsInStage;
    const gap = Math.max(0.5, 3 * S), side = 6;
    const bw = (W - side * 2 - gap * (cols - 1)) / cols;
    const bh = Math.max(12, H * 0.024) * S;
    brickTop = top + 20; brickRowH = bh + gap;
    bricksByRow = [];
    for (const b of bricks) {
      b.baseX = side + b.c * (bw + gap);
      b.x = b.baseX;
      b.y = brickTop + b.r * brickRowH;
      b.w = bw; b.h = bh;
      (bricksByRow[b.r] || (bricksByRow[b.r] = [])).push(b);
    }
    // 動く列：その列の空きスペースぶんだけ左右に揺れる
    rowAmp = [];
    for (let r = 0; r < rowsInStage; r++) {
      if (!movingRows[r]) { rowAmp[r] = 0; continue; }
      const cs = bricks.filter(b => b.r === r).map(b => b.c);
      if (!cs.length) { rowAmp[r] = 0; continue; }
      const left = Math.min(...cs), right = colsInStage - 1 - Math.max(...cs);
      rowAmp[r] = Math.min(left, right) * (bw + gap) + side * 0.5;
    }
    brickBottom = top + 20 + rowsInStage * (bh + gap);
  }
  // 動く列の位置を更新
  let stageTime = 0;
  function moveBricks(dt) {
    stageTime += dt;
    const sp = 0.7 + stage * 0.08;
    for (const b of bricks) {
      const a = rowAmp[b.r] || 0;
      b.x = a ? b.baseX + Math.sin(stageTime * sp + (b.or ?? b.r) * 1.7) * a : b.baseX;
    }
  }

  // ヒビの形（ブロック内の相対座標 0〜1）。HPが減るほど本数が増える
  function makeCracks() {
    const list = [];
    for (let k = 0; k < 3; k++) {
      let x = Math.random(), y = Math.random() < 0.5 ? 0 : 1;
      const pts = [x, y];
      const dir = y === 0 ? 1 : -1;
      for (let i = 0; i < 3; i++) {
        x = Math.max(0.05, Math.min(0.95, x + (Math.random() - 0.5) * 0.35));
        y += dir * (0.2 + Math.random() * 0.25);
        pts.push(x, Math.max(0, Math.min(1, y)));
      }
      list.push(pts);
    }
    return list;
  }

  // 速度 → ダメージ（初期速度でほぼ0、最高速度で最奥の段も一撃）
  function damageAt(v) {
    const lo = H * CFG.speed, hi = H * CFG.maxSpeed;
    const u = Math.max(0, Math.min(1, (v - lo) / Math.max(hi - lo, 1)));
    return Math.round((DMG_MIN + (DMG_MAX - DMG_MIN) * u * u) * CFG.dmgScale);
  }

  // ステージが進むほどブロックが硬くなる（第10ステージで約2倍）
  const hpScaleOf = n => 1 + 0.11 * (n - 1);
  // 段の深さ（0=一番奥 1=一番手前）からHPを決める（6段のときの HP_BY_ROW と同じ）
  function hpAtDepth(f) {
    const x = f * (HP_BY_ROW.length - 1), i = Math.min(Math.floor(x), HP_BY_ROW.length - 2);
    return HP_BY_ROW[i] + (HP_BY_ROW[i + 1] - HP_BY_ROW[i]) * (x - i);
  }
  let rowsInStage = ROWS, movingRows = [];
  // サイズを小さくすると、配置図の1マスを f×f 個の小さなブロックに分ける
  const sizeK = () => CFG.sizeScale || 1;
  const subdiv = () => Math.max(1, Math.round(1 / sizeK()));
  let colsInStage = COLS, bricksByRow = [], brickTop = 0, brickRowH = 1;
  function makeBricks() {
    bricks = [];
    const theme = themeOf(stage), k = hpScaleOf(stage), f = subdiv();
    const lay = LAYOUTS[theme.key];
    rowsInStage = lay.length * f;
    colsInStage = COLS * f;
    movingRows = [];
    lay.forEach((rowStr, r0) => {
      const row = rowStr.startsWith('>') ? rowStr.slice(1) : rowStr;
      const depth = lay.length > 1 ? r0 / (lay.length - 1) : 1;
      const colorIdx = Math.round(depth * (theme.blocks.length - 1));
      for (let sr = 0; sr < f; sr++) {
        const r = r0 * f + sr;
        movingRows[r] = rowStr.startsWith('>');
        for (let c0 = 0; c0 < COLS; c0++) {
          let t = row[c0];
          if (t === '.') continue;
          for (let sc = 0; sc < f; sc++) {
            const type = t === 'I' && (sr || sc) ? '1' : t; // ★は1マスにつき1個だけ
            let hp = hpAtDepth(depth) * k * sizeK();       // 小さいブロックはHPも小さく
            if (type === 'H') hp *= 2.5;
            hp = Math.max(1, Math.round(hp));
            bricks.push({ r, c: c0 * f + sc, or: r0, type, alive: true, color: type === 'P' ? '#7cff3a' : theme.blocks[colorIdx],
              hp, maxHp: hp, cracks: makeCracks(), hitT: 0, revived: false, reviveT: 0, lastHit: 0 });
          }
        }
      }
    });
    layoutBricks();
  }

  function resetBall() {
    ball = { trail: [] };
    balls = [ball];
    trail = ball.trail;
    eff.magnet = 0; // マグネットはミスで解除
    ball.r = Math.max(2, W * 0.022 * sizeK());
    ball.x = Math.max(ball.r, Math.min(W - ball.r, paddle.x));
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0; ball.vy = 0;
    ball.spin = 0;
    ball.rot = 0;
    ball.extra = 0;
    ball.selfHit = false;
    ball.stuck = null;
    rally = 0; chain = 0;
    state = 'ready';
  }

  function launch() {
    const speed = H * CFG.speed;
    const ang = (-90 + (Math.random() * 40 - 20)) * Math.PI / 180;
    ball.vx = Math.cos(ang) * speed;
    ball.vy = Math.sin(ang) * speed;
    state = 'play';
  }

  // ステージ開始（ブロック・背景・ボールを用意して発射待ち）
  function loadStage(n) {
    stage = n;
    particles = []; dmgTexts = []; items = []; popups = []; zaps = []; swingHist = [];
    eff.wide = 0; eff.power = 0; eff.poison = 0; eff.barrier = 0;
    fever = 0; feverGauge = 0; stageTime = 0; windT = 0;
    SFX.music.setFever(false);
    boss = null; shots = []; bossDone = false; eff.stun = 0; eff.safe = 0;
    history = [];
    makeBricks(); // 先にブロック（パドルの上限がブロック位置で決まるため）
    if (!paddle) paddle = { x: W / 2, vx: 0, prevX: W / 2, vy: 0, y: null };
    paddle.y = null; targetY = null;
    layoutPaddle();
    targetX = paddle.x;
    ball = {};
    resetBall();
    buildBg(themeOf(n));
    SFX.music.play('s' + n);
    const t = themeOf(n);
    banner = { text: `STAGE ${n}`, sub: t.name, color: t.accent, life: 2.2 };
  }

  // ランキングに送れるのは、遊びに関わる設定が初期値のままのプレイだけ（巻き戻しはOK）
  const FREE_KEYS = ['volume', 'bgmVol', 'muted', 'fx', 'bgSpeed', 'sensX', 'sensY', 'vMove', 'cfgVer'];
  const isDefaultPlay = () => Object.keys(DEFAULTS).every(k => FREE_KEYS.includes(k) || Math.abs(Number(CFG[k]) - Number(DEFAULTS[k])) < 1e-6);
  let rankedRun = true;

  function newGame(startStage) {
    score = 0; lives = Math.round(CFG.startLives) || LIVES; bestRally = 0; scoreSaved = false;
    rankedRun = isDefaultPlay() && (startStage || 1) === 1;
    setTitle(false);
    loadStage(startStage || 1);
  }

  function goTitle() {
    if (!scoreSaved && score > 0) saveScore();
    state = 'title';
    if (!paddle) { paddle = { x: W / 2, vx: 0, prevX: W / 2, vy: 0, y: null }; layoutPaddle(); targetX = paddle.x; }
    if (!ball || ball.r == null) { ball = { trail: [] }; balls = [ball]; trail = ball.trail; bricks = bricks || []; ball.r = Math.max(2, W * 0.022 * sizeK()); ball.x = W / 2; ball.y = H / 2; ball.vx = 0; ball.vy = 0; ball.spin = 0; ball.rot = 0; }
    buildBg(themeOf(1));
    SFX.music.play('title');
    setTitle(true);
  }

  // ---- 端末内の記録（オンラインは RANKING_URL へ送信） ----
  const SCORE_KEY = 'spinsmash-scores';
  function loadScores() { try { return JSON.parse(localStorage.getItem(SCORE_KEY) || '[]'); } catch (e) { return []; } }
  function saveScore() {
    scoreSaved = true;
    const list = loadScores();
    const d = new Date();
    list.push({ score, stage, rally: bestRally, ranked: rankedRun, date: `${d.getMonth() + 1}/${d.getDate()}` });
    list.sort((a, b) => b.score - a.score);
    try { localStorage.setItem(SCORE_KEY, JSON.stringify(list.slice(0, 10))); } catch (e) {}
  }

  // ---- 入力（指ドラッグ） ----
  function pointerX(e) {
    const t = e.touches ? e.touches[0] : e;
    return t ? t.clientX - cv.getBoundingClientRect().left : null;
  }
  function pointerY(e) {
    const t = e.touches ? e.touches[0] : e;
    return t ? t.clientY : null;
  }
  // 縦は「触れた位置からの移動量」で動かす（タップした場所へ瞬間移動しない）
  // 縦横とも「触れた位置から指を動かした量 × 感度」で動かす
  let touchStartX = 0, paddleStartX = 0;
  function startDrag(e) {
    const x = pointerX(e), y = pointerY(e);
    if (x === null || y === null) return;
    lastPX = x; lastPY = y;
    touchStartX = x; paddleStartX = paddle.x;
    touchStartY = y; paddleStartY = paddle.y;
  }
  function moveDrag(e) {
    const x = pointerX(e), y = pointerY(e);
    if (x === null || y === null) return;
    lastPX = x; lastPY = y;
    // 横：端に着いたら基準点をずらし、戻す時にすぐ反応するようにする
    let tx = paddleStartX + (x - touchStartX) * CFG.sensX;
    const minX = -paddle.w / 2, maxX = W + paddle.w / 2; // 画面外へパドル1個分まで出られる
    const cx = Math.max(minX, Math.min(maxX, tx));
    if (cx !== tx) { paddleStartX -= (tx - cx); tx = cx; }
    targetX = tx;
    if (!CFG.vMove) return;
    let ty = paddleStartY + (y - touchStartY) * CFG.sensY;
    const cy = Math.max(paddle.minY, Math.min(paddle.baseY, ty));
    if (cy !== ty) { paddleStartY -= (ty - cy); ty = cy; }
    targetY = ty;
  }
  function onDown(e) {
    e.preventDefault();
    if (panelOpen) { setPanel(false); return; } // パネル外をタップで閉じる
    SFX.init(); // iOSは画面に触れた時に音を有効化する必要がある
    if (paused || state === 'title' || state === 'stageClear') return;
    startDrag(e);
    fingerDown = true;
    if (state === 'ready') { launch(); SFX.paddle(0.5, 0, 0); }
    else if (state === 'over' || state === 'allClear') openResult();
  }
  // 指を離した：吸着中のボールを弾く（その瞬間の擦り・振り上げも効く）
  function releaseStuck() {
    if (state !== 'play') return;
    for (const b of balls) {
      if (b.stuck == null) continue;
      useBall(b);
      b.stuck = null;
      b.vx = 0; b.vy = b.stuckSpeed || H * CFG.speed;
      releasing = true; hitPaddle(-1); releasing = false;
    }
    if (balls.length) useBall(balls[0]);
  }
  function onUp(e) {
    if (e.touches && e.touches.length) return; // まだ別の指が触れている
    fingerDown = false;
    releaseStuck();
  }
  function onMove(e) {
    e.preventDefault();
    if (paused) return;
    moveDrag(e);
  }
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  cv.addEventListener('touchend', onUp);
  cv.addEventListener('touchcancel', onUp);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', e => { if (e.buttons) onMove(e); });
  window.addEventListener('resize', resize);

  // ---- 物理の補助 ----
  const speedOf = () => Math.hypot(ball.vx, ball.vy);

  function setSpeed(s) {
    const cur = speedOf() || 1;
    ball.vx *= s / cur; ball.vy *= s / cur;
  }

  function clampSpin() {
    const m = H * CFG.maxSpin;
    ball.spin = Math.max(-m, Math.min(m, ball.spin));
  }

  function keepVertical(preferUp) {
    const s = speedOf();
    const minVy = s * CFG.minVert;
    if (Math.abs(ball.vy) < minVy) {
      const dir = ball.vy !== 0 ? Math.sign(ball.vy) : (preferUp ? -1 : 1);
      ball.vy = dir * minVy;
      ball.vx = (Math.sign(ball.vx) || 1) * Math.sqrt(s * s - minVy * minVy);
    }
  }

  // 面との摩擦：回転 ⇄ 接線方向の速度 を交換する
  function friction(nx, ny, surfVel, grip, kick) {
    const tx = -ny, ty = nx;
    const vt = ball.vx * tx + ball.vy * ty - surfVel;
    const slip = vt - ball.spin;
    ball.vx -= kick * slip * tx;
    ball.vy -= kick * slip * ty;
    ball.spin += grip * slip;
    clampSpin();
  }

  // 当たりの強さ（0〜1）：面に垂直な速さで決める
  const powerOf = (dot) => Math.min(1, Math.abs(dot) / (H * 1.2));

  function bounce(nx, ny, sound, row) {
    const s = speedOf();
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot >= 0) return;
    if (!sound) SFX.wall(powerOf(dot));
    ball.vx -= 2 * dot * nx;
    ball.vy -= 2 * dot * ny;
    // こおり：壁やブロックで回転が減らない（滑る）
    friction(nx, ny, 0, themeOf(stage).key === 'ice' ? 0 : CFG.wallGrip, CFG.wallKick);
    setSpeed(s);
    keepVertical(ny < 0);
  }

  // ---- 更新 ----
  function spawnParticles(b, nX, nY, amount) {
    const n = Math.round(7 * CFG.fx * (amount == null ? 1 : amount));
    for (let i = 0; i < n && particles.length < 90; i++) {
      const sp = H * (0.25 + Math.random() * 0.5);
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: b.x + Math.random() * b.w, y: b.y + Math.random() * b.h,
        vx: Math.cos(a) * sp * 0.6 - nX * sp * 0.3 + ball.vx * 0.15,
        vy: Math.sin(a) * sp * 0.6 - nY * sp * 0.3,
        life: 0.4 + Math.random() * 0.3, max: 0.7,
        s: 2 + Math.random() * 4, color: b.color,
      });
    }
  }

  // ビーム用の軌跡を記録（近すぎる点は間引く）
  function recordTrail() {
    const n = trail.length;
    if (n >= 2) {
      const dx = ball.x - trail[n - 2], dy = ball.y - trail[n - 1];
      if (dx * dx + dy * dy < 16) return;
    }
    trail.push(ball.x, ball.y);
    if (trail.length > 600) trail.splice(0, trail.length - 600);
  }

  function explode(x, y) {
    const cols = ['#ff4d1a', '#ff9f1a', '#ffd23f', '#ffffff'];
    const n = Math.round(28 * Math.max(CFG.fx, 0.3));
    for (let i = 0; i < n && particles.length < 140; i++) {
      const a = -Math.PI * Math.random();           // 上半分へ飛び散る
      const sp = H * (0.4 + Math.random() * 0.9);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.5, max: 1, s: 3 + Math.random() * 5, color: cols[i % cols.length] });
    }
  }

  function addDamageText(b, dmg, kill) {
    if (CFG.fx <= 0) return;
    if (dmgTexts.length > 30) dmgTexts.shift();
    dmgTexts.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, text: kill ? `${dmg}!` : `${dmg}`, kill, life: 0.7 });
  }

  function updateFx(dt) {
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    for (const p of popups) { p.y -= H * 0.05 * dt; p.life -= dt; }
    if (popups.length) popups = popups.filter(p => p.life > 0);
    for (const z of zaps) z.life -= dt;
    if (zaps.length) zaps = zaps.filter(z => z.life > 0);
    for (const t of dmgTexts) { t.y -= H * 0.06 * dt; t.life -= dt; }
    if (dmgTexts.length) dmgTexts = dmgTexts.filter(t => t.life > 0);
    for (const b of bricks) if (b.hitT > 0) b.hitT = Math.max(0, b.hitT - dt * 8);
    paddleGlow *= Math.exp(-dt * 7);
    rallyPop *= Math.exp(-dt * 6);
    for (const p of particles) {
      p.vy += H * 1.6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
    }
    if (particles.length) particles = particles.filter(p => p.life > 0);
    if (state === 'play') {
      // 記録は step() 内で行う
    } else for (const b of balls) if (b.trail) b.trail.length = 0;
  }

  function update(dt) {
    updateBg(dt);
    if (state === 'title') return;
    updateFx(dt);
    if (state === 'stageClear') {
      stageTimer -= dt;
      if (stageTimer <= 0) {
        if (stage >= STAGES) { state = 'allClear'; saveScore(); SFX.music.jingle('allclear'); }
        else loadStage(stage + 1);
      }
      return;
    }
    moveBricks(dt);
    gimmicks(dt);
    updateItems(dt);
    updateFever(dt);
    updateBoss(dt);
    updateShots(dt);
    // WIDE中は広がり、しびれ中は縮んで動きが鈍る
    const wantW = W * CFG.paddleW * sizeK() * (eff.wide > 0 ? 1.5 : 1) * (eff.stun > 0 ? 0.7 : 1);
    paddle.w += (wantW - paddle.w) * Math.min(1, dt * 10);
    const tx = Math.min(Math.max(targetX, -paddle.w / 2), W + paddle.w / 2);
    paddle.x = eff.stun > 0 ? paddle.x + (tx - paddle.x) * Math.min(1, dt * 4) : tx;
    const instVx = (paddle.x - paddle.prevX) / Math.max(dt, 1e-3);
    paddle.vx += (instVx - paddle.vx) * 0.5;
    paddle.prevX = paddle.x;
    paddle.frameStartY = paddle.y;
    if (CFG.vMove) {
      const ty = Math.max(paddle.minY, Math.min(paddle.baseY, targetY));
      paddle.y = eff.stun > 0 ? paddle.y + (ty - paddle.y) * Math.min(1, dt * 4) : ty;
    }
    else paddle.y = paddle.baseY;
    const instVy = (paddle.y - paddle.frameStartY) / Math.max(dt, 1e-3);
    paddle.vy += (instVy - paddle.vy) * 0.5;
    recordSwing();

    if (state === 'ready') {
      ball.x = Math.max(ball.r, Math.min(W - ball.r, paddle.x)); // パドルが画面外でもボールは画面内
      ball.y = paddle.y - ball.r - 1;
      return;
    }
    if (state !== 'play') return;

    for (const b of balls.slice()) {
      if (b.dead || state !== 'play') continue;
      useBall(b);
      if (b.stuck != null) { // マグネットで吸着中：パドルと一緒に動く
        b.x = Math.max(b.r, Math.min(W - b.r, paddle.x + b.stuck));
        b.y = paddle.y - b.r;
        continue;
      }
      const steps = Math.max(1, Math.ceil(speedOf() * dt / (ball.r * 0.8)));
      const sdt = dt / steps;
      for (let i = 0; i < steps && state === 'play' && !b.dead && b.stuck == null; i++) step(sdt);
    }
    if (state === 'play') balls = balls.filter(b => !b.dead);
    if (balls.length) useBall(balls[0]);
  }

  // dir = -1：表で上へ打つ / +1：裏で下へ打つ（自爆の危険）
  function hitPaddle(dir) {
    // マグネット：指を置いている間は表で受けたボールが吸着（指を離すと弾く）
    if (dir < 0 && eff.magnet > 0 && fingerDown && !releasing) {
      if (ball.extra) { setSpeed(Math.max(speedOf() - ball.extra, H * 0.05)); ball.extra = 0; }
      ball.stuckSpeed = Math.max(speedOf(), H * CFG.speed);
      ball.stuck = Math.max(-paddle.w / 2, Math.min(paddle.w / 2, ball.x - paddle.x));
      ball.vx = 0; ball.vy = 0;
      ball.y = paddle.y - ball.r;
      SFX.magnet();
      return;
    }
    // 前の強打で上乗せされていた分は外して計算
    if (ball.extra) { setSpeed(Math.max(speedOf() - ball.extra, H * 0.05)); ball.extra = 0; }
    const drive = Math.max(0, dir * paddle.vy); // 打つ向きへ振る速さ（px/秒）
    const power = Math.min(1, powerOf(ball.vy - paddle.vy) + Math.min(1, Math.abs(paddle.vx) / (W * 4)) * 0.5 + Math.min(1, drive / (H * 2)) * 0.6);
    const spin0 = ball.spin;
    const hit = (ball.x - paddle.x) / (paddle.w / 2);
    const ang = Math.max(-1, Math.min(1, hit)) * 60 * Math.PI / 180;
    const sp = Math.min(Math.max(speedOf(), H * 0.05), H * CFG.maxSpeed);
    ball.vx = Math.sin(ang) * sp;
    ball.vy = dir * Math.cos(ang) * sp;
    // 面の接線方向へのパドル速度で擦る（裏面は接線の向きが逆）
    friction(0, dir, paddle.vx * -dir, CFG.paddleGrip, CFG.paddlePush);
    setSpeed(sp);
    if (ball.vy * dir < 0) ball.vy = -ball.vy;
    keepVertical(dir < 0);
    ball.y = dir < 0 ? paddle.y - ball.r : paddle.y + paddle.h + ball.r;
    ball.selfHit = dir > 0;
    // 回転の強さ：かけた量と打球後の回転の大きい方
    const maxS = H * Math.max(CFG.maxSpin, 0.01);
    const spinAmt = Math.min(1, Math.max(Math.abs(ball.spin - spin0), Math.abs(ball.spin)) / maxS);
    // 打つ向きと逆へ振りながら打つと減速（速くなりすぎた時の救済）。少しずつ下がる
    const away = Math.max(0, -dir * paddle.vy);
    let braked = 0;
    if (CFG.vMove && away > H * 0.15 && CFG.slowPower > 0) {
      const f = Math.min(1, away / (H * 1.5));
      const before = speedOf();
      const after = Math.max(H * CFG.speed, before * (1 - CFG.slowPower * f));
      if (after < before * 0.995) { setSpeed(after); braked = f; }
    }
    // 回転をかけるほど加速（減速した打球では加速しない）
    if (!braked && spinAmt > 0.05 && CFG.spinAccel > 1) {
      const before = speedOf();
      const mul = 1 + (CFG.spinAccel - 1) * spinAmt; // 最大回転で spinAccel 倍
      const after = Math.min(before * mul, H * CFG.maxSpeed);
      if (after > before * 1.002) {
        setSpeed(after);
        const level = Math.min(1, after / (H * Math.max(CFG.maxSpeed, 0.1)));
        SFX.powerUp((after / before - 1) / (CFG.spinAccel - 1), level);
        if (before < H * CFG.beamSpeed && after >= H * CFG.beamSpeed) SFX.beamOn();
      }
    }
    // 振り上げ（裏なら振り下ろし）強打：その打球だけ速くなり、時間とともに元に戻る
    if (CFG.vMove && drive > H * 0.2 && CFG.liftPower > 0) {
      const before = speedOf();
      const after = Math.min(before + drive * 0.5 * CFG.liftPower, H * CFG.maxSpeed);
      if (after > before * 1.01) {
        setSpeed(after);
        ball.extra = after - before;
        SFX.powerUp(Math.min(1, ball.extra / (H * 0.8)), Math.min(1, after / (H * CFG.maxSpeed)));
        if (before < H * CFG.beamSpeed && after >= H * CFG.beamSpeed) SFX.beamOn();
      }
    }
    // ジャストショット
    if (isPerfect()) {
      setSpeed(Math.min(speedOf() * 1.08, H * CFG.maxSpeed));
      ball.spin = Math.max(-H * CFG.maxSpin, Math.min(H * CFG.maxSpin, ball.spin * 1.3));
      score += 100 * stage;
      addPopup(ball.x, paddle.y - 34, 'PERFECT!', '#fff27a');
      SFX.perfect();
    }
    rally++; chain = 0;
    bestRally = Math.max(bestRally, rally);
    if (rally % 5 === 0) addPopup(W / 2, H * 0.55, `x${rallyMult().toFixed(1)}`, '#ffd23f');
    SFX.paddle(power, spinAmt, rally);
    if (braked) SFX.powerDown(braked);
    if (rally % 5 === 0) SFX.rallyUp(rally);
    paddleGlow = 1;
    rallyPop = 1;
  }

  function step(dt) {
    // 空中のカーブ
    const s = speedOf();
    const a = CFG.curve * ball.spin * (themeOf(stage).key === 'ice' ? 1.5 : 1); // こおり：よく曲がる
    applyCurrents(dt);
    const vx0 = ball.vx, vy0 = ball.vy;
    ball.vx += (-vy0 / s) * a * dt;
    ball.vy += ( vx0 / s) * a * dt;
    setSpeed(s);

    ball.spin *= Math.exp(-CFG.decay * dt);
    // 強打の上乗せ分を少しずつ戻す
    if (ball.extra > 0) {
      const ne = ball.extra * Math.exp(-CFG.liftDecay * dt);
      setSpeed(Math.max(speedOf() - (ball.extra - ne), H * 0.05));
      ball.extra = ne < H * 0.002 ? 0 : ne;
    }
    clampSpin();
    ball.rot += ball.spin / ball.r * dt;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    recordTrail();

    // 壁
    if (ball.x < ball.r)       { ball.x = ball.r;       bounce(1, 0); }
    if (ball.x > W - ball.r)   { ball.x = W - ball.r;   bounce(-1, 0); }
    if (ball.y < top + ball.r) { ball.y = top + ball.r; bounce(0, 1); ball.selfHit = false; }

    // パドル
    const px = paddle.x - paddle.w / 2;
    // パドル：表（上面）で上へ、裏（下面）で下へ打ち返す
    // パドルが動いた分も当たり判定に含める（すり抜け防止）
    const py0 = paddle.frameStartY ?? paddle.y;
    const inX = ball.x >= px - ball.r && ball.x <= px + paddle.w + ball.r;
    const fromAbove = ball.y < py0 + paddle.h / 2; // フレーム開始時のパドルより上にいたか
    if (inX && fromAbove && ball.vy - paddle.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= Math.max(paddle.y, py0) + paddle.h) {
      hitPaddle(-1);
    } else if (inX && !fromAbove && ball.vy - paddle.vy < 0 &&
        ball.y - ball.r <= paddle.y + paddle.h && ball.y + ball.r >= Math.min(paddle.y, py0)) {
      hitPaddle(1);
    }

    // ブロック（ボールの高さにある段だけ調べる）
    const ry0 = Math.max(0, Math.floor((ball.y - ball.r - brickTop) / brickRowH));
    const ry1 = Math.min(rowsInStage - 1, Math.floor((ball.y + ball.r - brickTop) / brickRowH));
    brickLoop:
    for (let rr = ry0; rr <= ry1; rr++) for (const b of bricksByRow[rr] || []) {
      if (!b.alive) continue;
      const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      let dx = ball.x - nx, dy = ball.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 <= ball.r * ball.r) {
        let d = Math.sqrt(d2);
        if (d < 1e-6) {
          const s2 = speedOf(); dx = -ball.vx / s2; dy = -ball.vy / s2; d = 1;
        }
        const nX = dx / d, nY = dy / d;
        const power = powerOf(ball.vx * nX + ball.vy * nY);
        ball.selfHit = false;
        const raw = fever > 0 ? 99999 : ballDamage();
        if (themeOf(stage).key === 'poison' && b.type === 'P') { eff.poison = 5; SFX.poisoned(); }
        const killed = damageBrick(b, raw, 'ball', power);
        if (state !== 'play') break brickLoop;
        if (killed) continue; // 倒した：跳ね返らずに貫通
        // 倒せなかった：削って跳ね返る
        ball.x = nx + nX * ball.r;
        ball.y = ny + nY * ball.r;
        bounce(nX, nY, 'brickHit', b.r);
        spawnParticles(b, nX, nY, 0.3);
        break brickLoop;
      }
    }

    if (state === 'play') collideBoss();
    // ボールで弾を消せる
    for (const sh of shots) {
      if (sh.dead || sh.delay > 0) continue;
      const dx = sh.x - ball.x, dy = sh.y - ball.y, rr = ball.r + sh.size;
      if (dx * dx + dy * dy < rr * rr) {
        sh.dead = true;
        score += 20;
        SFX.shotBreak();
        for (let i = 0; i < 6 && particles.length < 140; i++) {
          const a = Math.random() * Math.PI * 2, v = H * (0.2 + Math.random() * 0.3);
          particles.push({ x: sh.x, y: sh.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35, max: 0.35, s: 2 + Math.random() * 3, color: sh.color });
        }
      }
    }

    // 下：バリアかフィーバー中は跳ね返る
    const floorY = H - safeBottom * 0.35;
    if (ball.vy > 0 && ball.y + ball.r >= floorY && (eff.barrier > 0 || fever > 0)) {
      ball.y = floorY - ball.r;
      ball.vy = -Math.abs(ball.vy);
      if (fever <= 0) { eff.barrier = 0; addPopup(ball.x, floorY - 20, 'BARRIER!', '#7df9ff'); }
      SFX.wall(1);
    }

    // 落下：他にボールが残っていればミスにならない（そのボールが消えるだけ）
    if (ball.y - ball.r > H) {
      if (balls.filter(b => !b.dead).length > 1) {
        ball.dead = true;
        for (let i = 0; i < 6 && particles.length < 140; i++) particles.push({ x: ball.x, y: H - 4, vx: (Math.random() - 0.5) * H * 0.4, vy: -Math.random() * H * 0.5, life: 0.4, max: 0.4, s: 3, color: '#ffffff' });
        return;
      }
      ball.dead = true;
      lives--;
      // ミス（自分で下へ打ち込んだ自爆も同じ）：ドカーン＋破片
      SFX.selfDestruct();
      explode(ball.x, H - 4);
      feverGauge = 0;
      if (lives <= 0) { state = 'over'; SFX.music.jingle('over'); eff.magnet = 0; } // 記録はタイトルへ戻る時（巻き戻しで復活できるように）
      else resetBall();
    }
  }

  // ---- ダメージ・ギミック ----
  // 今のボールのダメージ（POWで2倍、毒で半分）
  function ballDamage() {
    let d = damageAt(speedOf());
    if (eff.power > 0) d *= 2;
    if (eff.poison > 0) d *= 0.5;
    return Math.max(1, Math.round(d));
  }
  // 属性による防御（いわ・はがね）
  function armorOf() {
    const k = themeOf(stage).key;
    return k === 'rock' ? 3 : k === 'steel' ? 8 : 0;
  }
  const rallyMult = () => Math.min(4, 1 + Math.floor(rally / 5) * 0.5);

  // ブロックにダメージ。倒したら true
  function damageBrick(b, raw, source, power) {
    if (!b.alive) return false;
    const dmg = Math.min(Math.max(0, raw - (fever > 0 ? 0 : armorOf())), b.hp);
    b.hitT = 1;
    b.lastHit = stageTime;
    if (dmg <= 0) {
      addDamageText(b, 0, false);
      if (source === 'ball') SFX.clank();
      return false;
    }
    b.hp -= dmg;
    addDamageText(b, dmg, b.hp <= 0);
    if (b.hp > 0) {
      if (source === 'ball') SFX.brickHit(b.r, power || 0.5, 1 - b.hp / b.maxHp);
      if (source === 'ball' && themeOf(stage).key === 'electric') zap(b, dmg);
      return false;
    }
    // 倒した
    b.alive = false;
    chain++;
    score += Math.round(b.maxHp * rallyMult() * (fever > 0 ? 2 : 1));
    SFX.brick(b.r, power || 0.6, chain, true);
    const s2 = speedOf() || 1;
    spawnParticles(b, -ball.vx / s2, -ball.vy / s2, 1);
    // アイテム：★ブロックは必ず、他は7%
    if (b.type === 'I' || Math.random() < 0.07 * sizeK() * sizeK()) dropItem(b); // 小さいブロックは落ちにくく
    const key = themeOf(stage).key;
    if (key === 'bio' && !b.revived && Math.random() < 0.35) { b.reviveT = 7; }
    if (key === 'fire' && source !== 'fire') burn(b);
    if (key === 'electric' && source === 'ball') zap(b, b.maxHp * 0.5);
    if (bricks.every(k => !k.alive) && !boss && !bossDone) spawnBoss();
    return true;
  }

  function stageClear() {
    if (state !== 'play') return;
    state = 'stageClear'; stageTimer = 2.6; SFX.music.jingle('clear'); SFX.music.setFever(false);
    for (const k of bricks) k.reviveT = 0;
    score += 500 * stage;
    banner = { text: 'STAGE CLEAR!', sub: `ボーナス +${500 * stage}`, color: '#fff27a', life: 2.2 };
  }

  // ほのお：倒したブロックの周り8マスに延焼ダメージ
  function burn(b) {
    SFX.burn();
    for (const n of bricks) {
      if (!n.alive || n === b) continue;
      if (Math.abs(n.r - b.r) <= 1 && Math.abs(n.c - b.c) <= 1) {
        damageBrick(n, Math.round(n.maxHp * 0.35), 'fire');
        if (state !== 'play') return;
      }
    }
  }

  // でんき：他のブロック2個に放電
  let zaps = [];
  function zap(from, amount) {
    const targets = bricks.filter(k => k.alive && k !== from);
    for (let i = 0; i < 2 && targets.length; i++) {
      const t = targets.splice(Math.random() * targets.length | 0, 1)[0];
      zaps.push({ x0: from.x + from.w / 2, y0: from.y + from.h / 2, x1: t.x + t.w / 2, y1: t.y + t.h / 2, life: 0.18 });
      damageBrick(t, Math.round(amount * 0.5), 'zap');
      if (state !== 'play') return;
    }
    SFX.zap();
  }

  // ---- アイテム ----
  const ITEMS = [
    { id: 'wide',    label: 'WIDE',    color: '#4dd8ff', w: 22 },
    { id: 'power',   label: 'POW',     color: '#ff4d6d', w: 18 },
    { id: 'spin',    label: 'SPIN',    color: '#c77dff', w: 18 },
    { id: 'slow',    label: 'SLOW',    color: '#7cff8a', w: 14 },
    { id: 'barrier', label: 'BARRIER', color: '#7df9ff', w: 18 },
    { id: 'oneup',   label: '1UP',     color: '#ffd23f', w: 10 },
    { id: 'multi2',  label: '×2',      color: '#ffe66d', w: 14, mult: 2 },
    { id: 'multi3',  label: '×3',      color: '#ffb84d', w: 9,  mult: 3 },
    { id: 'multi5',  label: '×5',      color: '#ff8c42', w: 5,  mult: 5 },
    { id: 'multi10', label: '×10',     color: '#ff5e5e', w: 2,  mult: 10 },
    { id: 'magnet',  label: 'MAG',     color: '#b388ff', w: 10 },
    { id: 'ghost',   label: '透明',    color: '#3a3f55', w: 8, text: '#9aa0b8' }, // ハズレ
  ];
  let items = [];
  const eff = { wide: 0, power: 0, poison: 0, barrier: 0, stun: 0, safe: 0, ghost: 0, magnet: 0 }; // アイテム・毒の効果時間
  function dropItem(b) {
    let r = Math.random() * ITEMS.reduce((a, it) => a + it.w, 0), it = ITEMS[0];
    for (const x of ITEMS) { r -= x.w; if (r <= 0) { it = x; break; } }
    items.push({ ...it, x: b.x + b.w / 2, y: b.y + b.h / 2, vy: H * 0.22 });
  }
  function updateItems(dt) {
    for (const it of items) it.y += it.vy * dt;
    const pw = paddle.w, ph = paddle.h;
    items = items.filter(it => {
      if (it.y > H + 20) return false;
      const iw = W * 0.13, ih = 16;
      if (Math.abs(it.x - paddle.x) < (pw + iw) / 2 && Math.abs(it.y - (paddle.y + ph / 2)) < (ph + ih) / 2) {
        applyItem(it);
        return false;
      }
      return true;
    });
    for (const k of ['wide', 'power', 'poison', 'ghost']) if (eff[k] > 0) eff[k] = Math.max(0, eff[k] - dt);
  }
  function applyItem(it) {
    if (it.id === 'wide') eff.wide = 15;
    if (it.id === 'power') eff.power = 12;
    if (it.id === 'barrier') eff.barrier = 1;
    if (it.id === 'magnet') eff.magnet = 1;  // 次のミスまで
    if (it.id === 'ghost') eff.ghost = 6;    // ハズレ：6秒間パドルが見えない
    if (state === 'play' && (it.id === 'spin' || it.id === 'slow')) {
      for (const b of balls) {
        if (b.stuck != null) continue;
        useBall(b);
        const s0 = speedOf();
        if (it.id === 'spin') { b.spin = (Math.sign(b.spin) || 1) * H * CFG.maxSpin; setSpeed(Math.min(s0 * 1.15, H * CFG.maxSpeed)); }
        else setSpeed(Math.max(H * CFG.speed, s0 * 0.75));
      }
      useBall(balls[0]);
    }
    if (it.mult) multiplyBalls(it.mult);
    if (it.id === 'oneup') { lives = Math.min(99, lives + 1); SFX.oneUp(); }
    else if (it.id === 'ghost') SFX.ghost();
    else SFX.item();
    addPopup(it.x, paddle.y - 24, it.label === '1UP' ? '1UP!' : it.label, it.color);
    score += 50;
  }

  // ボールを増やす：今あるボールそれぞれを k 倍に（少しずつ違う向きへ）
  function multiplyBalls(k) {
    if (state === 'ready') launch();
    if (state !== 'play') return;
    const add = [];
    for (const b of balls) {
      if (b.dead) continue;
      const sp = Math.hypot(b.vx, b.vy), ang = Math.atan2(b.vy, b.vx);
      for (let i = 1; i < k; i++) {
        const nb = { ...b, trail: [] };
        if (b.stuck != null) { nb.stuck = Math.max(-paddle.w / 2, Math.min(paddle.w / 2, b.stuck + (Math.random() - 0.5) * paddle.w * 0.6)); }
        else {
          const a = ang + (Math.random() - 0.5) * 1.2;
          nb.vx = Math.cos(a) * sp; nb.vy = Math.sin(a) * sp;
          if (Math.abs(nb.vy) < sp * 0.3) nb.vy = Math.sign(b.vy || -1) * sp * 0.3;
        }
        add.push(nb);
      }
    }
    balls.push(...add);
  }

  // ---- 属性ギミック（毎フレーム） ----
  let windT = 0, windDir = 1, flowDir = 1;
  function gimmicks(dt) {
    const key = themeOf(stage).key;
    // くさ・せいぶつ：削れたブロックが回復（最後に当てて1秒後から）
    const heal = key === 'grass' ? 0.015 : key === 'bio' ? 0.03 : 0;
    for (const b of bricks) {
      if (heal && b.alive && b.hp < b.maxHp && stageTime - b.lastHit > 1) b.hp = Math.min(b.maxHp, b.hp + b.maxHp * heal * dt);
      // せいぶつ：倒したブロックが時々復活
      if (!b.alive && b.reviveT > 0) {
        b.reviveT -= dt;
        if (b.reviveT <= 0) { b.alive = true; b.revived = true; b.hp = Math.round(b.maxHp * 0.5); b.hitT = 1; addPopup(b.x + b.w / 2, b.y, '復活', '#ff6f91'); }
      }
    }
    // みず：画面中央の水流（5秒ごとに向きが変わる）／ひこう：時々横風
    windT += dt;
    if (key === 'water') flowDir = Math.floor(windT / 5) % 2 ? -1 : 1;
    if (key === 'sky') windDir = Math.floor(windT / 7) % 2 ? -1 : 1;
  }
  const windOn = () => themeOf(stage).key === 'sky' && (windT % 7) > 5;   // 7秒ごとに2秒間の突風
  const inFlow = y => themeOf(stage).key === 'water' && y > H * 0.45 && y < H * 0.6;
  function applyCurrents(dt) {
    if (inFlow(ball.y)) ball.vx += flowDir * H * 0.7 * dt;
    if (windOn()) ball.vx += windDir * H * 0.9 * dt;
  }

  // ---- ジャストショット・フィーバー ----
  let swingHist = [];      // パドルの速さの履歴 [時刻, 速さ]
  let fever = 0, feverGauge = 0;
  function recordSwing() {
    const v = Math.hypot(paddle.vx, paddle.vy);
    swingHist.push([stageTime, v]);
    while (swingHist.length && stageTime - swingHist[0][0] > 0.4) swingHist.shift();
  }
  // 止めていたパドルを、当たる直前（0.25秒以内）に振り始めて打ったか
  function isPerfect() {
    const now = Math.hypot(paddle.vx, paddle.vy);
    if (now < H * 1.0) return false;
    const before = swingHist.find(([t]) => stageTime - t <= 0.3 && stageTime - t >= 0.18);
    return !!before && before[1] < H * 0.25;
  }
  function updateFever(dt) {
    if (fever > 0) { fever = Math.max(0, fever - dt); if (fever === 0) { SFX.feverEnd(); SFX.music.setFever(false); } return; }
    if (state !== 'play') return;
    const near = speedOf() >= H * CFG.maxSpeed * 0.9;
    feverGauge = Math.max(0, Math.min(1, feverGauge + (near ? dt / 3 : -dt / 6)));
    if (feverGauge >= 1) {
      fever = 8; feverGauge = 0;
      SFX.feverStart();
      SFX.music.setFever(true);
      banner = { text: 'FEVER!!', sub: '8秒間 一撃・落ちない・スコア2倍', color: '#ff7ae0', life: 1.8 };
    }
  }

  // ---- ボス ----
  // shot: n=弾数 spread=広がり(rad) speed=速さ(画面高さ/秒) aim=パドル狙い wobble=揺れ grav=重力 homing=追尾 warn=予告(秒)
  const BOSSES = {
    grass:    { name: 'フロラ・グランデ',   shot: { n: 3, spread: 0.35, speed: 0.35, size: 6,  color: '#b6ff7a' } },
    water:    { name: 'アクアジェリー',     shot: { n: 4, spread: 0.6,  speed: 0.22, size: 9,  color: '#8fd8ff', wobble: 1 } },
    fire:     { name: 'イグニス',           shot: { n: 1, spread: 0,    speed: 0.5,  size: 9,  color: '#ff7a1a', aim: true, burst: 3 } },
    electric: { name: 'ボルトクラウド',     shot: { n: 1, spread: 0,    speed: 1.3,  size: 5,  color: '#ffe14d', aim: true, warn: 0.7 } },
    sky:      { name: 'ゲイルホーク',       shot: { n: 5, spread: 0.9,  speed: 0.3,  size: 6,  color: '#e6f4ff', wobble: 1.5 } },
    rock:     { name: 'ガンセキゴーレム',   shot: { n: 2, spread: 0.5,  speed: 0.1,  size: 13, color: '#a1887f', grav: 0.9 } },
    ice:      { name: 'フロストクリスタ',   shot: { n: 3, spread: 0.25, speed: 0.6,  size: 6,  color: '#bdf3ff' } },
    poison:   { name: 'ヴェノムスライム',   shot: { n: 6, spread: 1.2,  speed: 0.25, size: 8,  color: '#9cff57', grav: 0.2 } },
    steel:    { name: 'アイアンフォート',   shot: { n: 5, spread: 0.7,  speed: 0.45, size: 5,  color: '#e0e6ea', aim: true } },
    bio:      { name: 'セルマザー',         shot: { n: 4, spread: 0.8,  speed: 0.3,  size: 8,  color: '#ff6f91', homing: 0.9 } },
  };
  let boss = null, shots = [], bossDone = false;

  function spawnBoss() {
    const key = themeOf(stage).key, last = stage === STAGES;
    const hp = Math.round((1000 + 330 * (stage - 1)) * (last ? 1.5 : 1));
    boss = { key, name: BOSSES[key].name, hp, maxHp: hp, t: 0, hitT: 0, inv: 0, fireT: 2.5, burstLeft: 0,
      w: W * (last ? 0.56 : 0.46), h: H * (last ? 0.18 : 0.15), x: W / 2, y: 0, enter: 1 };
    boss.baseY = top + 26 + boss.h / 2;
    boss.y = -boss.h;
    for (const b of bricks) b.reviveT = 0;
    banner = { text: 'WARNING', sub: boss.name, color: '#ff4d4d', life: 2.2 };
    SFX.bossAppear();
    SFX.music.stop();
    setTimeout(() => { if (boss) SFX.music.play(stage === STAGES ? 'last' : 'boss'); }, 1300); // 警報のあとボス曲
  }

  function updateBoss(dt) {
    if (!boss) return;
    const b = boss, angry = b.hp < b.maxHp * 0.5;
    b.t += dt;
    b.hitT = Math.max(0, b.hitT - dt * 5);
    b.inv = Math.max(0, b.inv - dt);
    if (b.enter > 0) { // 上から降りてくる
      b.enter = Math.max(0, b.enter - dt * 0.6);
      b.y = b.baseY - b.enter * (b.h + b.baseY);
      return;
    }
    const sp = (0.5 + stage * 0.04) * (angry ? 1.5 : 1) * (b.key === 'sky' ? 1.6 : b.key === 'poison' ? 0.6 : 1);
    b.x = W / 2 + Math.sin(b.t * sp) * (W / 2 - b.w / 2 - 8);
    b.y = b.baseY + Math.sin(b.t * 1.3) * (b.key === 'sky' ? 22 : 8);
    // 攻撃
    b.fireT -= dt;
    if (b.fireT <= 0) {
      const cfg = BOSSES[b.key].shot;
      if (cfg.burst && b.burstLeft <= 0) b.burstLeft = cfg.burst;
      fireShots(cfg, angry);
      if (b.burstLeft > 0) { b.burstLeft--; b.fireT = b.burstLeft > 0 ? 0.25 : nextFire(angry); }
      else b.fireT = nextFire(angry);
    }
  }
  const nextFire = angry => Math.max(1.2, 2.8 - stage * 0.12) * (angry ? 0.65 : 1) * (0.8 + Math.random() * 0.4);

  function fireShots(cfg, angry) {
    const b = boss, n = cfg.n + (angry ? 1 : 0) + (stage === STAGES ? 1 : 0);
    const ox = b.x, oy = b.y + b.h * 0.4;
    let base = Math.PI / 2;
    if (cfg.aim) base = Math.atan2(paddle.y - oy, paddle.x - ox);
    for (let i = 0; i < n; i++) {
      const a = base + (n > 1 ? (i / (n - 1) - 0.5) * cfg.spread * 2 : 0);
      const v = H * cfg.speed;
      shots.push({ x: cfg.warn ? paddle.x : ox + (n > 1 ? (i / (n - 1) - 0.5) * b.w * 0.5 : 0), y: oy,
        vx: cfg.warn ? 0 : Math.cos(a) * v, vy: cfg.warn ? v : Math.sin(a) * v,
        size: cfg.size, color: cfg.color, wobble: cfg.wobble || 0, grav: cfg.grav || 0, homing: cfg.homing || 0,
        delay: cfg.warn || 0, t: Math.random() * 6 });
    }
    SFX.bossShoot(b.key);
  }

  function updateShots(dt) {
    for (const s of shots) {
      if (s.delay > 0) { s.delay -= dt; continue; }
      s.t += dt;
      if (s.grav) s.vy += H * s.grav * dt;
      if (s.homing) s.vx += Math.sign(paddle.x - s.x) * H * s.homing * 0.4 * dt;
      s.x += (s.vx + (s.wobble ? Math.sin(s.t * 6) * H * 0.15 * s.wobble : 0)) * dt;
      s.y += s.vy * dt;
      // パドルに当たるとしびれる（しびれ中・しびれ後の無敵中は当たらない）
      if (eff.stun <= 0 && eff.safe <= 0 &&
          Math.abs(s.x - paddle.x) < paddle.w / 2 + s.size && s.y + s.size > paddle.y && s.y - s.size < paddle.y + paddle.h) {
        s.dead = true;
        eff.stun = boss && boss.key === 'electric' ? 1.8 : 1.2;
        SFX.stunned();
        addPopup(paddle.x, paddle.y - 26, 'しびれた！', '#ff9b9b');
      }
      if (s.y > H + 30 || s.x < -40 || s.x > W + 40) s.dead = true;
    }
    if (shots.length) shots = shots.filter(s => !s.dead);
    if (eff.stun > 0) {
      eff.stun = Math.max(0, eff.stun - dt);
      if (eff.stun === 0) eff.safe = 2; // しびれが解けたら2秒間無敵
    } else if (eff.safe > 0) eff.safe = Math.max(0, eff.safe - dt);
  }

  // ボールとボスの当たり判定
  function collideBoss() {
    if (!boss || boss.enter > 0) return;
    const b = boss, x0 = b.x - b.w / 2, y0 = b.y - b.h / 2;
    const nx = Math.max(x0, Math.min(ball.x, x0 + b.w)), ny = Math.max(y0, Math.min(ball.y, y0 + b.h));
    let dx = ball.x - nx, dy = ball.y - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > ball.r * ball.r) return;
    let d = Math.sqrt(d2);
    if (d < 1e-6) { const s2 = speedOf(); dx = -ball.vx / s2; dy = -ball.vy / s2; d = 1; }
    const nX = dx / d, nY = dy / d;
    ball.x = nx + nX * ball.r; ball.y = ny + nY * ball.r;
    const power = powerOf(ball.vx * nX + ball.vy * nY);
    bounce(nX, nY, 'boss');
    ball.selfHit = false;
    // フィーバー中でも一撃にはしない（上限150）
    // 連続ヒット防止の無敵時間（0.35秒）。ただし無敵中でも3回に1回はダメージが入る
    if (b.inv > 0) {
      b.invHits = (b.invHits || 0) + 1;
      if (b.invHits < 3) { SFX.wall(power); return; }
    }
    b.invHits = 0;
    b.inv = 0.35;
    const raw = fever > 0 ? Math.max(150, ballDamage()) : ballDamage();
    const dmg = Math.min(b.hp, Math.max(0, raw - armorOf()));
    b.hitT = 1;
    dmgTexts.push({ x: ball.x, y: ball.y - 10, text: dmg > 0 ? `${dmg}` : '0', kill: false, life: 0.7 });
    if (dmg <= 0) { SFX.clank(); return; }
    b.hp -= dmg;
    score += Math.round(dmg * rallyMult() * (fever > 0 ? 2 : 1));
    SFX.bossHit(power);
    if (b.hp <= 0) bossDefeated();
  }

  function bossDefeated() {
    const b = boss;
    SFX.bossDown();
    for (let i = 0; i < 4; i++) explode(b.x + (Math.random() - 0.5) * b.w, b.y + (Math.random() - 0.5) * b.h + H * 0.05);
    score += 3000 * stage;
    addPopup(b.x, b.y, `+${3000 * stage}`, '#fff27a');
    boss = null; shots = []; bossDone = true;
    stageClear();
  }

  // ---- ボスの見た目（属性ごとのオリジナル怪物） ----
  function drawBoss() {
    if (!boss) return;
    const b = boss, t = b.t, angry = b.hp < b.maxHp * 0.5, th = themeOf(stage);
    const { x, y, w, h } = b;
    ctx.save();
    ctx.translate(x, y);
    const body = th.accent, dark = th.blocks[0];
    ctx.lineJoin = 'round';
    const P = (fn) => { ctx.beginPath(); fn(); };
    switch (b.key) {
      case 'grass': { // 巨大な花
        for (let i = 0; i < 10; i++) {
          const a = i / 10 * Math.PI * 2 + t * 0.4;
          ctx.fillStyle = i % 2 ? '#ff7eb6' : '#ffb3d1';
          P(() => ctx.ellipse(Math.cos(a) * w * 0.3, Math.sin(a) * h * 0.38, w * 0.17, h * 0.2, a, 0, Math.PI * 2)); ctx.fill();
        }
        ctx.fillStyle = '#4caf50';
        for (const s of [-1, 1]) { P(() => ctx.ellipse(s * w * 0.42, h * 0.3, w * 0.14, h * 0.12, s * 0.5, 0, Math.PI * 2)); ctx.fill(); }
        ctx.fillStyle = '#ffd23f'; P(() => ctx.arc(0, 0, h * 0.34, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'water': { // クラゲ
        ctx.strokeStyle = 'rgba(140,210,255,0.7)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        for (let i = 0; i < 7; i++) {
          const tx = (i / 6 - 0.5) * w * 0.7;
          P(() => { ctx.moveTo(tx, h * 0.1); for (let k = 1; k <= 6; k++) ctx.lineTo(tx + Math.sin(t * 3 + i + k) * 8, h * 0.1 + k * h * 0.12); }); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(94,200,255,0.85)';
        P(() => { ctx.ellipse(0, 0, w * 0.45, h * 0.5, 0, Math.PI, 0); ctx.closePath(); }); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)'; P(() => ctx.ellipse(-w * 0.15, -h * 0.25, w * 0.12, h * 0.1, -0.3, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'fire': { // 炎の魔人
        for (let i = 0; i < 7; i++) {
          const a = (i / 6 - 0.5) * 1.8, fl = 1 + Math.sin(t * 9 + i) * 0.15;
          ctx.fillStyle = i % 2 ? '#ff7a1a' : '#ffb347';
          P(() => { const bx = Math.sin(a) * w * 0.32, by = -h * 0.1;
            ctx.moveTo(bx, by - h * 0.55 * fl); ctx.quadraticCurveTo(bx + w * 0.12, by, bx, by + h * 0.3); ctx.quadraticCurveTo(bx - w * 0.12, by, bx, by - h * 0.55 * fl); }); ctx.fill();
        }
        ctx.fillStyle = '#ff4d1a'; P(() => ctx.ellipse(0, h * 0.05, w * 0.32, h * 0.42, 0, 0, Math.PI * 2)); ctx.fill();
        break; }
      case 'electric': { // 雷雲
        ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) { const bx = (i - 1) * w * 0.3; P(() => { ctx.moveTo(bx, h * 0.25); ctx.lineTo(bx + 8, h * 0.4); ctx.lineTo(bx - 4, h * 0.45); ctx.lineTo(bx + 6, h * 0.62); }); if (Math.sin(t * 7 + i * 2) > 0) ctx.stroke(); }
        ctx.fillStyle = '#3a3f66';
        for (const [cx, cy, r] of [[-0.3, 0.05, 0.3], [0, -0.1, 0.36], [0.3, 0.05, 0.3], [-0.12, 0.15, 0.3], [0.15, 0.15, 0.3]]) { P(() => ctx.arc(cx * w, cy * h, r * h * 1.1, 0, Math.PI * 2)); ctx.fill(); }
        break; }
      case 'sky': { // 巨大な鳥
        const flap = Math.sin(t * 6) * 0.5;
        ctx.fillStyle = '#e6f4ff';
