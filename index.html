<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>SpinSmash</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<meta name="apple-mobile-web-app-title" content="SpinSmash">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b1020; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    color: #e8ecff;
  }
  #wrap { display: flex; width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; flex: 1 1 auto; min-width: 0; height: 100%; }

  /* ---- 調整パネル ---- */
  /* タイトル画面・ランキング */
  .hidden { display: none !important; }
  #titleUI {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 12px; padding-bottom: calc(env(safe-area-inset-bottom) + 5vh); /* ボタンを下寄せ（キャッチコピーと重ならないように） */
  }
  #titleUI button {
    pointer-events: auto; width: min(64vw, 260px); padding: 16px 0; border: 0; border-radius: 14px;
    font: 900 20px -apple-system, "Hiragino Sans", sans-serif; letter-spacing: .08em; color: #fff;
    background: linear-gradient(90deg, #ff4d6d, #4dd8ff); box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    touch-action: manipulation;
  }
  #ver { position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 8px); font: 600 11px -apple-system, sans-serif; color: rgba(255,255,255,0.45); letter-spacing: .05em; }
  #titleUI button.sub { background: rgba(255,255,255,0.14); font-size: 16px; padding: 12px 0; }
  #optUI { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
  .rankBox.optBox { text-align: left; }
  .optBox h2 { text-align: center; margin-bottom: 14px; }
  .optHead { font-size: 11px; color: #9aa6d6; letter-spacing: .05em; margin: 4px 0 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }
  .optRow { display: block; font-size: 14px; font-weight: bold; margin-bottom: 16px; }
  .optRow span { color: #4dd8ff; float: right; font-variant-numeric: tabular-nums; }
  .optRow input[type=range] { display: block; width: 100%; margin-top: 10px; accent-color: #4dd8ff; touch-action: pan-x; }
  #optName {
    display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 11px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25); background: #0b1020; color: #fff; font-size: 16px; font-weight: normal;
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  .optBox #optClose { display: block; margin: 4px auto 0; }
  #rankUI {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .rankBox {
    width: min(86vw, 360px); max-height: 80vh; overflow-y: auto; box-sizing: border-box;
    background: #141a30; border-radius: 16px; padding: 18px; text-align: center;
  }
  .rankBox h2 { margin: 0 0 4px; font-size: 20px; }
  .rankBox .note { font-size: 11px; color: #9aa6d6; margin-bottom: 10px; }
  #rankList { list-style: none; margin: 0 0 14px; padding: 0; text-align: left; font-variant-numeric: tabular-nums; }
  #rankList li { display: flex; gap: 10px; padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
  #rankList li .no { width: 22px; color: #9aa6d6; }
  #rankList li .sc { flex: 1; font-weight: bold; }
  #rankList li .meta { color: #9aa6d6; font-size: 12px; }
  .rankBox button { padding: 10px 28px; border: 0; border-radius: 10px; background: #2b3560; color: #fff; font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin: 8px 0; }
  .tabs button { flex: 1; padding: 8px 0; border: 0; border-radius: 8px; background: #2b3560; color: #fff; font-size: 13px; }
  .tabs button.on { background: linear-gradient(90deg, #ff4d6d, #4dd8ff); font-weight: bold; }
  #rankList li .nm { width: 6.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #resultUI { position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
  .resScore { font-size: 15px; margin: 6px 0 12px; line-height: 1.6; }
  .resScore b { font-size: 26px; }
  #nameInput {
    width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25);
    background: #0b1020; color: #fff; font-size: 16px; text-align: center;
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  .resBtns { display: flex; gap: 8px; margin: 10px 0 6px; }
  .resBtns button, #resOk { flex: 1; padding: 12px 0; border: 0; border-radius: 10px; color: #fff; font-size: 14px; font-weight: bold;
    background: linear-gradient(90deg, #ff4d6d, #4dd8ff); }
  .resBtns button.sub { background: #2b3560; font-weight: normal; }
  #resOk { width: 100%; margin-top: 8px; }
  .stageBtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
  .stageBtns button { padding: 6px 0; border: 0; border-radius: 6px; background: #2b3560; color: #fff; font-size: 12px; }

  /* 右上の小さなボタン（ミュート・ポーズ・設定） */
  #hudBtns {
    position: fixed; z-index: 30;
    top: calc(env(safe-area-inset-top) + 10px); right: 8px;
    display: flex; gap: 6px;
  }
  #hudBtns button {
    width: 36px; height: 36px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 16px;
    padding: 0; touch-action: manipulation; font-family: inherit;
  }
  #hudBtns button.on { background: #ff4d6d; }
  #rewindBtn {
    position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 10px); left: 8px;
    width: 40px; height: 36px; border: 0; border-radius: 10px; padding: 0;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 16px; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #rewindBtn.on { background: #3d6bff; }

  /* 調整パネル：⚙で右から重ねて表示 */
  #panel {
    position: fixed; z-index: 20; top: 0; right: 0;
    width: clamp(150px, 44vw, 240px);
    height: 100%; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 56px) 8px calc(env(safe-area-inset-bottom) + 12px);
    background: rgba(20,26,48,0.96); border-left: 1px solid rgba(255,255,255,0.1);
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
    transform: translateX(105%); transition: transform 0.2s ease;
    overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    font-size: 11px;
  }
  #panel.open { transform: none; }
  .btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .btns button {
    flex: 1; padding: 9px 0; border: 0; border-radius: 8px;
    background: #2b3560; color: #fff; font-size: 12px; font-weight: bold; white-space: nowrap;
    font-family: inherit; touch-action: manipulation;
  }
  .btns button.on { background: #ff4d6d; }
  .meter { margin-bottom: 10px; }
  .meter .bar { position: relative; height: 8px; background: rgba(255,255,255,0.12); border-radius: 4px; margin-top: 4px; }
  .meter .fill { position: absolute; top: 0; height: 100%; border-radius: 4px; }
  .meter .mid { position: absolute; left: 50%; top: -3px; width: 1px; height: 14px; background: rgba(255,255,255,0.6); }
  .secHead {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    margin: 8px 0 4px; padding: 8px 8px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: #dfe6ff; font: bold 12px -apple-system, "Hiragino Sans", sans-serif;
    touch-action: manipulation;
  }
  .secHead .arrow { color: #9aa6d6; font-size: 10px; white-space: nowrap; margin-left: 6px; }
  .secHead span:first-child { text-align: left; }
  .secBody { padding: 4px 2px 2px; }
  .secBody.closed { display: none; }
  .songBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 6px; }
  .songBtns button { padding: 7px 2px; border: 0; border-radius: 6px; background: #2b3560; color: #fff; font-size: 11px; }
  .songBtns button.on { background: #3d6bff; }
  h3 { font-size: 11px; margin: 10px 0 4px; color: #9aa6d6; letter-spacing: .05em; }
  .row { margin-bottom: 8px; }
  .row .lab { display: flex; justify-content: space-between; gap: 4px; }
  .row .lab b { font-weight: 600; }
  .row .lab span { color: #4dd8ff; font-variant-numeric: tabular-nums; }
  .row .key { color: #6c78a8; font-size: 10px; }
  input[type=range] { width: 100%; margin: 4px 0 0; touch-action: pan-x; accent-color: #4dd8ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="titleUI" class="hidden">
    <button id="startBtn">スタート</button>
    <button id="rankBtn" class="sub">ランキング</button>
    <button id="optBtn" class="sub">オプション</button>
    <div id="ver">ver 0.0.02</div>
  </div>
  <div id="optUI" class="hidden">
    <div class="rankBox optBox">
      <h2>オプション</h2>
      <label class="optRow">ユーザー名
        <input id="optName" maxlength="10" placeholder="ランキングに載る名前（10文字まで）" autocomplete="nickname">
      </label>
      <label class="optRow">BGMの音量 <span id="optBgmVal"></span>
        <input id="optBgm" type="range" min="0" max="1" step="0.05">
      </label>
      <label class="optRow">効果音の音量 <span id="optSeVal"></span>
        <input id="optSe" type="range" min="0" max="1" step="0.05">
      </label>
      <div class="optHead">演出</div>
      <label class="optRow">演出の強さ <span id="optFxVal"></span>
        <input id="optFx" type="range" min="0" max="2" step="0.1">
      </label>
      <label class="optRow">背景スクロール速度 <span id="optBgVal"></span>
        <input id="optBg" type="range" min="-20" max="20" step="0.5">
      </label>
      <button id="optClose">とじる</button>
    </div>
  </div>
  <div id="rankUI" class="hidden">
    <div class="rankBox">
      <h2>ランキング</h2>
      <div class="tabs"><button id="tabAll" class="on">みんな</button><button id="tabMine">この端末</button></div>
      <div class="note" id="rankNote"></div>
      <ol id="rankList"></ol>
      <button id="rankClose">とじる</button>
    </div>
  </div>
  <div id="resultUI" class="hidden">
    <div class="rankBox">
      <h2 id="resTitle">GAME OVER</h2>
      <div class="resScore" id="resScore"></div>
      <div id="resForm">
        <input id="nameInput" maxlength="10" placeholder="なまえ（10文字まで）" autocomplete="nickname" enterkeyhint="send">
        <div class="resBtns"><button id="sendBtn">ランキングに送信</button><button id="skipBtn" class="sub">送信しない</button></div>
      </div>
      <div class="note" id="resNote"></div>
      <button id="resOk" class="hidden">タイトルへ</button>
    </div>
  </div>
  <button id="rewindBtn" aria-label="巻き戻し" class="hidden">⏪</button>
  <div id="hudBtns">
    <button id="muteBtn" aria-label="ミュート">🔊</button>
    <button id="pauseBtn" aria-label="ポーズ">⏸</button>
    <button id="gearBtn" aria-label="設定">⚙</button>
  </div>
  <div id="panel">
    <div class="btns">
      <button id="resetBtn">値を初期化</button>
      <button id="restartBtn">タイトルへ</button>
    </div>
    <div class="btns">
      <button id="vMoveBtn">↕ 上下移動</button>
    </div>
    <div id="testBox">
      <div class="btns"><button id="bossBtn">ボス戦へ</button></div>
      <div class="lab" style="margin-bottom:4px">ステージへ移動</div>
      <div class="stageBtns" id="stageBtns"></div>
    </div>
    <div id="soundBox"></div>
    <div class="meter">
      <div class="lab">速度 <span id="speedVal">0</span></div>
      <div class="bar"><div class="fill" id="speedFill" style="left:0"></div><div class="mid" id="beamMark"></div></div>
    </div>
    <div class="meter">
      <div class="lab">回転 <span id="spinVal">0</span></div>
      <div class="bar"><div class="fill" id="spinFill"></div><div class="mid"></div></div>
    </div>
    <div id="sliders"></div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---- 基本設定 ----
  const COLS = 7, ROWS = 6, LIVES = 5;
  // ブロックのHP（上＝奥の段 → 下＝手前の段）
  const HP_BY_ROW = [100, 75, 55, 35, 20, 10];
  const DMG_MIN = 1, DMG_MAX = 100; // 初期速度で1、最高速度で100
  const COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];
  const BALL_COLOR_A = '#ff4d6d';
  const BALL_COLOR_B = '#4dd8ff';
  const STAGES = 10;
  // オンラインランキングの送信先（Google Apps Script のウェブアプリURL）。空なら端末内のみ
  const RANKING_URL = 'https://script.google.com/macros/s/AKfycbxRo_Qw_NBhHSL5RvNaRYkSm--3pAhc8pyG5BgpHlO1gPM9aRoY62q5XXf04JaB_o5B/exec';

  // ---- ステージのテーマ（属性） ----
  // bg: 背景の基本色（上下同色→中央色で継ぎ目なくループ）、blocks: 上の段→下の段の色、paint: 背景の模様
  function rngOf(seed) {
    return () => {
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // 縦にループする背景用：はみ出した模様を反対側にも描く
  function wrapY(th, y, size, fn) {
    fn(y);
    if (y - size < 0) fn(y + th);
    if (y + size > th) fn(y - th);
  }
  const THEMES = [
    { key: 'grass', name: 'くさ', bg: ['#0e2614', '#17391d'], accent: '#7ddc6a',
      blocks: ['#1b5e20', '#2e7d32', '#43a047', '#66bb6a', '#9ccc65', '#c5e1a5'],
      paint(g, w, th, R) {
        for (let i = 0; i < 70; i++) {               // 草むら
          const x = R() * w, y = R() * th, n = 3 + (R() * 4 | 0), hgt = 10 + R() * 22;
          wrapY(th, y, hgt, yy => {
            g.strokeStyle = `rgba(90,180,80,${0.18 + R() * 0.2})`; g.lineWidth = 1.5;
            for (let k = 0; k < n; k++) {
              g.beginPath(); g.moveTo(x + k * 3, yy);
              g.quadraticCurveTo(x + k * 3 + (R() - 0.5) * 8, yy - hgt * 0.6, x + k * 3 + (R() - 0.5) * 14, yy - hgt);
              g.stroke();
            }
          });
        }
        for (let i = 0; i < 30; i++) {               // 葉っぱ
          const x = R() * w, y = R() * th, sz = 6 + R() * 10, a = R() * Math.PI;
          wrapY(th, y, sz, yy => {
            g.fillStyle = 'rgba(70,150,60,0.25)';
            g.beginPath(); g.ellipse(x, yy, sz, sz * 0.4, a, 0, Math.PI * 2); g.fill();
          });
        }
      } },
    { key: 'water', name: 'みず', bg: ['#061d36', '#0b2f52'], accent: '#5ec8ff',
      blocks: ['#0d47a1', '#1565c0', '#1e88e5', '#29b6f6', '#4dd0e1', '#80deea'],
      paint(g, w, th, R) {
        const rows = Math.round(th / 70);
        for (let i = 0; i < rows; i++) {             // 波
          const y0 = i * th / rows, ph = R() * 6;
          g.strokeStyle = 'rgba(120,200,255,0.13)'; g.lineWidth = 2;
          g.beginPath();
          for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x * 0.03 + ph) * 8);
          g.stroke();
        }
        for (let i = 0; i < 45; i++) {               // 泡
          const x = R() * w, y = R() * th, r = 2 + R() * 9;
          wrapY(th, y, r, yy => {
            g.strokeStyle = `rgba(170,230,255,${0.2 + R() * 0.25})`; g.lineWidth = 1.2;
            g.beginPath(); g.arc(x, yy, r, 0, Math.PI * 2); g.stroke();
          });
        }
      } },
    { key: 'fire', name: 'ほのお', bg: ['#260a05', '#3d1408'], accent: '#ff8a3d',
      blocks: ['#b71c1c', '#d84315', '#f4511e', '#fb8c00', '#ffb300', '#ffd54f'],
      paint(g, w, th, R) {
        for (let i = 0; i < 22; i++) {               // 炎のゆらめき
          const x = R() * w, y = R() * th, s = 14 + R() * 26;
          wrapY(th, y, s * 1.6, yy => {
            g.fillStyle = `rgba(255,${90 + R() * 60 | 0},30,0.16)`;
            g.beginPath(); g.moveTo(x, yy - s * 1.6);
            g.bezierCurveTo(x + s, yy - s * 0.4, x + s * 0.7, yy + s * 0.6, x, yy + s * 0.6);
            g.bezierCurveTo(x - s * 0.7, yy + s * 0.6, x - s, yy - s * 0.4, x, yy - s * 1.6);
            g.fill();
          });
        }
        for (let i = 0; i < 90; i++) {               // 火の粉
          const x = R() * w, y = R() * th;
          wrapY(th, y, 3, yy => {
            g.fillStyle = `rgba(255,${150 + R() * 80 | 0},60,${0.3 + R() * 0.4})`;
            g.beginPath(); g.arc(x, yy, 0.8 + R() * 1.8, 0, Math.PI * 2); g.fill();
          });
        }
      } },
    { key: 'electric', name: 'でんき', bg: ['#0f1228', '#1b1f3e'], accent: '#ffe14d',
      blocks: ['#ff8f00', '#ffab00', '#ffc400', '#ffd600', '#ffea00', '#fff59d'],
      paint(g, w, th, R) {
        const n = Math.round(th / 40), step = th / n;  // 回路のグリッド
        g.strokeStyle = 'rgba(255,230,80,0.06)'; g.lineWidth = 1;
        for (let i = 0; i < n; i++) { g.beginPath(); g.moveTo(0, i * step); g.lineTo(w, i * step); g.stroke(); }
        for (let x = 0; x < w; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, th); g.stroke(); }
        for (let i = 0; i < 10; i++) {               // 稲妻
          const x0 = R() * w, y0 = R() * th, len = 60 + R() * 90;
          const pts = [[x0, y0]];
          for (let k = 0; k < 6; k++) pts.push([pts[k][0] + (R() - 0.5) * 30, pts[k][1] + len / 6]);
          wrapY(th, y0 + len / 2, len / 2 + 10, yy => {
            const off = yy - (y0 + len / 2);
            g.strokeStyle = 'rgba(255,235,90,0.32)'; g.lineWidth = 2;
            g.beginPath(); pts.forEach(([px, py], k) => k ? g.lineTo(px, py + off) : g.moveTo(px, py + off)); g.stroke();
          });
        }
      } },
    { key: 'sky', name: 'ひこう', bg: ['#173b63', '#25588a'], accent: '#bfe6ff',
      blocks: ['#1565c0', '#1e88e5', '#42a5f5', '#90caf9', '#e3f2fd', '#fff9c4'],
      paint(g, w, th, R) {
        for (let i = 0; i < 14; i++) {               // 雲
          const x = R() * w, y = R() * th, s = 20 + R() * 30;
          wrapY(th, y, s, yy => {
            g.fillStyle = 'rgba(255,255,255,0.13)';
            for (let k = 0; k < 5; k++) {
              g.beginPath(); g.ellipse(x + (k - 2) * s * 0.55, yy + (R() - 0.5) * s * 0.4, s * 0.6, s * 0.4, 0, 0, Math.PI * 2); g.fill();
            }
          });
        }
        for (let i = 0; i < 30; i++) {               // 風の筋
          const x = R() * w, y = R() * th, len = 30 + R() * 70;
          wrapY(th, y, len, yy => {
            g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 1;
            g.beginPath(); g.moveTo(x, yy - len / 2); g.lineTo(x, yy + len / 2); g.stroke();
          });
        }
      } },
    { key: 'rock', name: 'いわ', bg: ['#241b14', '#36291e'], accent: '#d2a679',
      blocks: ['#4e342e', '#6d4c41', '#8d6e63', '#a1887f', '#bcaaa4', '#d7ccc8'],
      paint(g, w, th, R) {
        for (let i = 0; i < 45; i++) {               // 岩

        s5:     { lv: 0.955, genre: 'trance',   root: 53, mode: 'minor',      bpm: 145, prog: [1, 6, 3, 7, 1, 6, 4, 5], seed: 65 },  // ひこう：トランス／ユーロビート
        s6:     { lv: 0.288, genre: 'rock',     root: 52, mode: 'minor',      bpm: 150, prog: [1, 6, 7, 1, 4, 6, 7, 5], seed: 76 },  // いわ：ロック
        s7:     { lv: 0.698, genre: 'icebox',   root: 59, mode: 'minor',      bpm: 140, prog: [1, 6, 3, 7, 1, 6, 4, 5], seed: 87 },  // こおり：オルゴール＋チルステップ
        s8:     { lv: 1.866, genre: 'swing',    root: 50, mode: 'harmonic',   bpm: 132, prog: [1, 4, 1, 5, 1, 4, 5, 1], seed: 98 },  // どく：怪しいスウィング
        s9:     { lv: 0.311, genre: 'metal',    root: 40, mode: 'phrygian',   bpm: 168, prog: [1, 1, 2, 1, 6, 7, 2, 1], seed: 109 }, // はがね：インダストリアル＋ヘビーメタル
        s10:    { lv: 1.107, custom: 'choir', bpm: 100, verb: 0.45 }, // せいぶつ：荘厳な混成合唱（オリジナル曲）
        boss:   { lv: 0.683, genre: 'epic',     root: 48, mode: 'harmonic',   bpm: 170, prog: [1, 1, 6, 6, 4, 4, 5, 5], seed: 131 }, // ボス：壮大なバトル曲
        last:   { lv: 1.782, custom: 'sutra', bpm: 120, verb: 0.4 },  // ラスボス：お経・木魚・りんの静かな緊張感
      };
      const JINGLES = { // [MIDI, 16分音符の長さ]
        clear:    { bpm: 150, lead: [[72, 2], [76, 2], [79, 2], [84, 6], [83, 2], [84, 10]], bass: [[48, 8], [55, 8], [48, 8]] },
        over:     { bpm: 100, lead: [[67, 4], [66, 4], [65, 4], [64, 6], [0, 2], [60, 12]], bass: [[43, 8], [41, 8], [36, 16]] },
        allclear: { bpm: 140, lead: [[72, 2], [72, 2], [72, 2], [72, 6], [68, 6], [70, 6], [72, 4], [70, 2], [72, 16]],
                    bass: [[48, 12], [44, 6], [46, 6], [48, 24]] },
      };

      const freq = m => 440 * Math.pow(2, (m - 69) / 12);
      // BGMの音の通り道（バス・残響への送り・ギターアンプ・こだま）を作る。曲を切り替える時は作り直して、前の曲の残りの音ごと消す
      function buildChain() {
        bus = ac.createGain(); bus.gain.value = 0;
        duck = ac.createGain(); duck.gain.value = 1;     // キックに合わせて伴奏を少し引っ込める（ポンプ感）
        duck.connect(bus);

        kickDrive = makeDrive(1.8); kickDrive.connect(bus); // キックを少し歪ませて太く
        // ギターアンプ：強い歪み → 高音を丸める → 中域を少し持ち上げる
        gtr = makeDrive(12);
        const cab = ac.createBiquadFilter(); cab.type = 'lowpass'; cab.frequency.value = 4200;
        const mid = ac.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 1500; mid.gain.value = 4;
        const gv = ac.createGain(); gv.gain.value = 0.35;
        gtr.connect(cab); cab.connect(mid); mid.connect(gv); gv.connect(duck);
        // 分散和音用のこだま（左右に跳ねる）
        echo = ac.createDelay(1); echo.delayTime.value = 0.21;
        const fb = ac.createGain(); fb.gain.value = 0.32;
        const ep = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
        if (ep.pan) ep.pan.value = 0.5;
        echo.connect(fb); fb.connect(echo); echo.connect(ep); ep.connect(duck);
        setVol();
      }
      // 今鳴っているBGM（長く伸ばしている音・残響も含む）を素早くフェードアウトして消す
      function cutOff(sec) {

        const old = bus, oldSend = musSend, t = ac.currentTime;
        old.gain.cancelScheduledValues(t); old.gain.setValueAtTime(old.gain.value, t); old.gain.linearRampToValueAtTime(0, t + sec);
        setTimeout(() => { try { old.disconnect(); oldSend.disconnect(); } catch (e) {} }, sec * 1000 + 300);
        buildChain();
      }
      function setup() {
        buildChain();
        for (const d of [0.125, 0.25, 0.5]) {
          const n = 40, re = new Float32Array(n), im = new Float32Array(n);
          for (let k = 1; k < n; k++) re[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * d);
          waves[d] = ac.createPeriodicWave(re, im);
        }
        if (pendingId) { const id = pendingId; pendingId = null; play(id); }
      }
      // lv=曲ごとの音量補正（ジャンルによる大きさの差をそろえる）
      function setVol() { if (bus) bus.gain.value = paused || CFG.muted ? 0 : CFG.bgmVol * ((songId && SONGS[songId].lv) || 1); }

      // 1音（エンベロープ付き）。pan で左右、lp で高音を丸める、vib でビブラート
      function voice(wave, m, t, dur, vol, opt) {
        if (!m) return;
        opt = opt || {};
        const o = ac.createOscillator();
        if (wave === 'tri' || wave === 'sine' || wave === 'sawtooth') o.type = wave === 'tri' ? 'triangle' : wave; else o.setPeriodicWave(waves[wave]);
        o.frequency.value = freq(m);
        if (opt.detune) o.detune.value = opt.detune;
        const g = ac.createGain();
        const a = opt.attack || 0.005;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + a);
        g.gain.linearRampToValueAtTime(vol * (opt.sus ?? 0.75), t + Math.min(0.1, dur * 0.5));
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        let node = o;
        if (opt.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opt.lp; f.Q.value = opt.q || 0.7; o.connect(f); node = f; }
        node.connect(g);
        let out = g;
        if (opt.pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = opt.pan; g.connect(p); out = p; }
        out.connect(opt.dest || duck);
        if (opt.vib && dur > 0.18) { // 伸ばす音だけ、少し遅れてビブラート
          const l = ac.createOscillator(), lg = ac.createGain();
          l.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(opt.vib, t + 0.15);
          l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(t + dur + 0.02);
        }
        o.start(t); o.stop(t + dur + 0.03);
      }
      function drum(kind, t, accent) {
        if (kind === 'K') { // 太いキック：音程の落ちる低音＋アタック
          const o = ac.createOscillator(), g = ac.createGain();
          o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
          g.gain.setValueAtTime(0.95, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
          o.connect(g); g.connect(kickDrive); o.start(t); o.stop(t + 0.26);
          nz(t, 0.012, 0.35, 'highpass', 3000, 0.7, bus);
          // 伴奏をキックに合わせて一瞬下げる
          duck.gain.cancelScheduledValues(t); duck.gain.setValueAtTime(0.55, t); duck.gain.linearRampToValueAtTime(1, t + 0.18);
          return;
        }
        if (kind === 'S') { // キレのあるスネア：胴鳴り＋ノイズ2層
          nz(t, 0.18, 0.45, 'bandpass', 1900, 0.9, bus);
          nz(t, 0.09, 0.3, 'highpass', 5500, 0.7, bus);
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
          g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
          o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.12);
          return;
        }
        if (kind === 'O') { nz(t, 0.22, 0.09, 'highpass', 7000, 0.7, bus); return; }       // オープンハイハット
        if (kind === 'C') { nz(t, 1.4, 0.16, 'highpass', 4500, 0.6, bus); return; }        // シンバル
        nz(t, 0.035, 0.1 * (accent ? 1.4 : 1), 'highpass', 8500, 0.7, bus);               // ハイハット
      }

      // 曲を組み立てる：主旋律は「モチーフ(リズム+上下の動き)」をコードに合わせて当てはめる（ABACABAD構成）
      function compose(spec) {
        const R = rngOf(spec.seed), sc = SCALES[spec.mode];
        const semi = i => sc[((i % 7) + 7) % 7] + 12 * Math.floor(i / 7);
        const RHY = [[2, 2, 2, 2, 4, 4], [3, 3, 2, 4, 4], [2, 1, 1, 2, 2, 4, 4], [4, 2, 2, 2, 2, 4],
                     [1, 1, 2, 1, 1, 2, 4, 4], [6, 2, 4, 4], [2, 2, 4, 2, 2, 4], [3, 1, 2, 2, 4, 2, 2]];
        const motifs = {};
        for (const L of 'ABCD') {
          const rh = RHY[R() * RHY.length | 0];
          motifs[L] = { rh, contour: rh.map(() => [-2, -1, -1, 0, 1, 1, 2, 3][R() * 8 | 0]) };
        }
        const lead = {}, bass = {}, chords = [];
        let idx = 9;
        'ABACABAD'.split('').forEach((L, bar) => {
          const deg = spec.prog[bar] - 1, chord = [deg, deg + 2, deg + 4];
          chords.push(chord.map(c => spec.root + 12 + semi(c)));
          const { rh, contour } = motifs[L];
          let st = bar * 16;
          rh.forEach((len, i) => {
            const strong = st % 4 === 0, lastNote = i === rh.length - 1;
            idx += contour[i];
            if (strong || lastNote) { // 強拍はコードの音に寄せる
              let best = idx, bd = 99;
              for (let o = 0; o <= 2; o++) for (const c of chord) { const cand = c + 7 * o; const d = Math.abs(cand - idx); if (d < bd) { bd = d; best = cand; } }
              idx = best;
            }
            if (bar === 7 && lastNote) idx = 14; // 最後は主音で落ち着かせる
            idx = Math.max(7, Math.min(16, idx));
            if (strong || R() > 0.08) lead[st] = [spec.root + semi(idx), len];
            st += len;
          });
          // ベース
          const b0 = spec.root - 12 + semi(deg) - (semi(deg) >= 7 ? 12 : 0);
          for (let k = 0; k < 16; k++) {
            const t = bar * 16 + k;
            if (spec.bass === 'oct' && k % 2 === 0) bass[t] = [k % 4 === 0 ? b0 : b0 + 12, 2];
            if (spec.bass === 'drive' && k % 2 === 0) bass[t] = [b0, 2];
            if (spec.bass === 'walk' && k % 4 === 0) bass[t] = [b0 + [0, 7, 12, 7][k / 4], 4];
          }
        });
        return { lead, bass, chords };
      }

      // ---- 声の合成：ノコギリ波を数本ずらして重ね（合唱）、母音の響き（フォルマント）を3つのフィルターで作る ----
      const VOWELS = { // [周波数, 強さ] ×3（男声の目安）
        a: [[730, 1], [1090, 0.5], [2440, 0.22]], o: [[570, 1], [840, 0.45], [2410, 0.15]],
        u: [[300, 1], [870, 0.3], [2240, 0.1]],   e: [[530, 1], [1840, 0.4], [2480, 0.2]],
        i: [[270, 1], [2290, 0.35], [3010, 0.2]],
      };
      function vox(m, t, dur, vol, vowel, opt) {
        if (!m) return;

        const env = ac.createGain();

          const g = ac.createGain(); g.gain.value = amp * 3;

        out.connect(opt.dest || bus);

        lfo.frequency.value = 4.8 + Math.random(); lg.gain.value = opt.vib ?? 14;
        lfo.connect(lg);
        for (let i = 0; i < n; i++) {
          const o = ac.createOscillator(); o.type = 'sawtooth';
          o.frequency.value = freq(m);
          o.detune.value = (Math.random() - 0.5) * (opt.spread ?? 22);
          lg.connect(o.detune); o.connect(sum);
          o.start(t); o.stop(t + dur + 0.05);

      }
      // ティンパニ
      function timp(m, t, vol) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.setValueAtTime(freq(m) * 1.05, t); o.frequency.exponentialRampToValueAtTime(freq(m), t + 0.08);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t + 1.15);
        nz(t, 0.08, vol * 0.6, 'lowpass', 600, 0.7, bus);
      }
      // 木魚（ポク）
      function mokugyo(t, vol) {
        nz(t, 0.025, vol, 'bandpass', 1300, 3, bus);
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.05);
        g.gain.setValueAtTime(vol * 0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.08);
      }
      // りん（鉢の鐘）：うなりのある倍音が長く響く
      function rin(t, vol) {
        for (const [f, a, d] of [[680, 1, 5], [683, 0.6, 5], [1875, 0.45, 3.5], [3610, 0.2, 2.2], [5390, 0.08, 1.4]]) {
          const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * a, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + 0.05);
        }
      }

      // ===== せいぶつ：荘厳な混成合唱（ニ短調、8小節。前半は静かな男声、後半は全員で爆発） =====
      const CH = { // 和音の声部（低音・男声・女声）
        Dm: { low: 38, male: [50, 57], fem: [62, 65, 69] }, Gm: { low: 43, male: [50, 55], fem: [62, 67, 70] },
        Bb: { low: 46, male: [50, 53], fem: [62, 65, 70] }, A:  { low: 45, male: [52, 57], fem: [61, 64, 69] },
      };
      const CHOIR_BARS = ['Dm', 'Dm', 'Bb', 'A', 'Dm', 'Gm', 'Bb', 'A'];
      const CHOIR_MEL = [[69, 69, 69, 70], [70, 69, 67, 69], [70, 70, 72, 74], [73, 73, 73, 69]]; // 後半のソプラノ（拍ごと）
      const cvox = (m, t, d, v, w, o) => vox(m, t, d, v * 1.3, w, o); // 合唱は少し大きめに
      function choirStep(st, t, six) {
        const bar = Math.floor(st / 16), k = st % 16, c = CH[CHOIR_BARS[bar]], beat = six * 4;
        if (bar < 4) { // 前半：静かに。男声の「オー」と弦の刻み
          if (k === 0) {
            c.male.forEach((m, i) => cvox(m, t, six * 16, 0.07, 'o', { attack: 0.5, release: 0.6, pan: i ? 0.3 : -0.3 }));
            voice('sawtooth', c.low, t, six * 16, 0.05, { lp: 500, attack: 0.4, sus: 0.95, dest: bus });
            timp(c.low + 12, t, 0.35);
          }
          if (k % 2 === 0) voice('sawtooth', c.fem[(k / 2) % 3] - 12, t, six * 1.5, fever ? 0.035 : 0.022, { lp: 1600, detune: k % 4 ? 6 : -6, pan: k % 4 ? 0.4 : -0.4, dest: bus });
          if (bar === 3 && k >= 12) timp(c.low + 12, t, 0.18 + (k - 12) * 0.06); // 爆発前のロール
          if (bar === 3 && k >= 8 && k % 2 === 1) timp(c.low + 12, t, 0.12 + (k - 8) * 0.03);
        } else { // 後半：全員で。拍ごとに和音を力強く
          if (k === 0 && bar === 4) drum('C', t);
          if (k % 4 === 0) {
            const mel = CHOIR_MEL[bar - 4][k / 4];
            c.male.forEach((m, i) => cvox(m, t, beat * 0.92, 0.075, 'a', { attack: 0.03, release: 0.12, pan: i ? 0.35 : -0.35 }));
            c.fem.forEach((m, i) => cvox(m, t, beat * 0.92, 0.05, 'a', { female: true, attack: 0.03, release: 0.12, pan: (i - 1) * 0.5 }));
            cvox(mel, t, beat * 0.95, 0.09, 'a', { female: true, voices: 4, attack: 0.02, release: 0.1 });
            cvox(c.low + 12, t, beat * 0.92, 0.07, 'o', { voices: 2, attack: 0.02, release: 0.1 });
            timp(c.low + 12, t, k === 0 ? 0.75 : 0.45);
            voice('sawtooth', c.low, t, beat * 0.9, 0.08, { lp: 700, attack: 0.01, dest: bus });
          }
          if (k % 2 === 0 || fever) voice('sawtooth', c.fem[(k >> 1) % 3], t, six * 1.4, 0.03, { lp: 2600, detune: k % 4 ? 7 : -7, pan: k % 4 ? 0.45 : -0.45, dest: bus });
        }
      }

      // ===== ラスボス：お経（静かな緊張感）。木魚に合わせて1拍1音で唱え、低い唸りが続く =====
      const SUTRA_VOWELS = 'aaaoaiau' + 'aoaieaua' + 'aaaoauai' + 'oaueaioo'; // 32音（4拍×8小節）
      function sutraStep(st, t, six) {
        const bar = Math.floor(st / 16), k = st % 16, beat = six * 4;
        if (st === 0) { // 8小節ぶん続く低い唸り（ん〜）と、遠くで鳴る高い音
          vox(38, t, six * 128, 0.08, 'u', { voices: 2, attack: 1.2, release: 1.5, vib: 4 });
          vox(45, t, six * 128, 0.04, 'u', { voices: 2, attack: 2, release: 1.5, vib: 4 });
          const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
          o.frequency.value = freq(86); l.frequency.value = 0.3; lg.gain.value = 0.006; l.connect(lg); lg.connect(g.gain);
          g.gain.value = 0.008; o.connect(g); g.connect(bus); o.start(t); o.stop(t + six * 128); l.start(t); l.stop(t + six * 128);
        }
        if (st === 0 && loop % 2 === 0) rin(t, 0.24); // 「チーン」は曲の頭と、2周に1回だけ
        if (k === 0 && bar % 2 === 0) { // 心音のような低い太鼓
          const o = ac.createOscillator(), g = ac.createGain();
          o.frequency.setValueAtTime(62, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.3);
          g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
          o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.5);
        }
        if (k % 4 === 0) {
          const idx = bar * 4 + k / 4, v = SUTRA_VOWELS[idx];
          const end = idx % 8 === 7;                                // 句の終わりは少し下がって伸ばす
          const m = end ? 48 : 50;
          mokugyo(t, idx % 4 === 0 ? 0.7 : 0.5);
          if (idx % 2 === 0) nz(t, 0.03, 0.05, 'bandpass', 2600, 1.5, bus); // 子音（か・さ）の息
          vox(m, t, beat * (end ? 0.98 : 0.85), 0.26, v, { voices: 4, attack: 0.03, release: 0.12, vib: 3, spread: 16 });
          vox(m - 12, t, beat * (end ? 0.98 : 0.85), 0.09, v, { voices: 2, attack: 0.03, release: 0.12, vib: 2 });
        }
        if (fever && k % 4 === 2) mokugyo(t, 0.25); // フィーバー中は木魚が倍に
      }
      // ================= ジャンル別の楽器セット =================
      const midi = m => freq(m);
      function env(g, t, a, peak, dur, sus) { // 簡単なエンベロープ
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + a);
        if (sus != null) g.gain.setTargetAtTime(peak * sus, t + a, dur * 0.3);
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
      }
      function route(node, pan, dest) {
        let out = node;
        if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); out = p; }
        out.connect(dest || duck);
      }
      // マリンバ／木琴：基音＋高い倍音がすぐ消える
      function mallet(m, t, vol, dec, pan) {

  const STORE_KEY = 'breakout-test-cfg-v2';
  const CFG = { ...DEFAULTS };

  if (!(CFG.cfgVer >= 5)) { delete CFG.sizeScale; CFG.objScale = DEFAULTS.objScale; CFG.brickScale = DEFAULTS.brickScale; CFG.cfgVer = 5; }
  if (!(CFG.cfgVer >= 6)) CFG.cfgVer = 6;

  function saveCfg() { try { localStorage.setItem(STORE_KEY, JSON.stringify(CFG)); } catch (e) {} }

  let W, H, dpr, top, safeBottom;
  let paddle, ball, bricks, score, lives, state, targetX, targetY, paused = false, panelOpen = false;
  let brickBottom = 0;            // ブロック領域の下端
  let stage = 1, stageTimer = 0, scoreSaved = false;
  let touchStartY = 0, paddleStartY = 0;
  // 演出用
  let rally = 0, chain = 0, bestRally = 0;
  let paddleGlow = 0, rallyPop = 0;
  let trail = [], particles = [], dmgTexts = [], banner = null;
  // 複数ボール：balls に全部、ball は「いま処理・描画しているボール」
  let balls = [];
  function useBall(b) { ball = b; trail = b.trail || (b.trail = []); }
  // ビーム付きで描くボールの数（多い時は減らして軽くする）
  const beamLimit = () => balls.length > 100 ? 3 : balls.length > 30 ? 6 : 12;

  // ---- 背景：遠・中・近の3層に模様を描いておき、それぞれ違う速さでスクロール（遠近感）----
  //  far : 小さく暗め・ゆっくり（土台のグラデーションもここ）
  //  mid : 今までどおりの大きさと速さ
  //  near: 大きく・ぼかして・数は少なめ・速く（低解像度で描いて拡大＝ボケ）
  const BG_LAYERS = [
    { key: 'far',  speed: 0.3, scale: 0.55, alpha: 0.5,  res: 1,    spread: 1 },
    { key: 'mid',  speed: 1,   scale: 1,    alpha: 1,    res: 0,    spread: 1 },
    { key: 'near', speed: 2.5, scale: 2.4,  alpha: 0.45, res: 0.22, spread: 3 },
  ];
  let bgTile = null, bgTheme = null, streakLen = 0;
  const bgOffs = [0, 0, 0];
  const streaks = Array.from({ length: 16 }, () => ({ x: Math.random(), y: Math.random(), len: 0.04 + Math.random() * 0.08, sp: 1.6 + Math.random() * 1.6 }));
  function buildBg(theme) {
    bgTheme = theme;
    const th = Math.ceil(H * 3); // 速くスクロールしても繰り返しが目立たない長さ
    const seed = STAGE_ORDER.indexOf(theme.key) * 97 + 13;
    const layers = BG_LAYERS.map((L, i) => {
      const res = L.res || dpr;
      const c = document.createElement('canvas');
      c.width = Math.ceil(W * res); c.height = Math.ceil(th * res);
      const g = c.getContext('2d');
      g.scale(res, res);
      if (i === 0) {
        const grad = g.createLinearGradient(0, 0, 0, th);
        grad.addColorStop(0, theme.bg[0]); grad.addColorStop(0.5, theme.bg[1]); grad.addColorStop(1, theme.bg[0]);
        g.fillStyle = grad; g.fillRect(0, 0, W, th);

      g.globalAlpha = L.alpha;
      g.scale(L.scale, L.scale);

      theme.paint(g, W / L.scale * L.spread, th / L.scale, rngOf(seed + i * 7919));
      g.restore();

    });
    bgTile = { layers, th };
  }
  function drawBg() {
    if (!bgTile) return;
    const th = bgTile.th;
    for (let i = 0; i < 3; i++) {
      const c = bgTile.layers[i], y0 = bgOffs[i] % th;
      ctx.drawImage(c, 0, y0 - th, W, th);
      ctx.drawImage(c, 0, y0, W, th);
    }
    // 高速で前進している感じの光の筋

  }
  function updateBg(dt) {
    // ボールが速いほどスクロールも速く
    const v = (state === 'play' && ball && ball.vx != null) ? speedOf() / H : 0;
    const sp = H * (0.25 + 0.35 * Math.min(1, v / Math.max(CFG.maxSpeed, 0.1))) * CFG.bgSpeed;
    const th = bgTile ? bgTile.th : H; // 背景1枚分で折り返す（どちら向きでも継ぎ目でずれない）

    // 光の筋：速いほど長く伸ばし、動きは抑えめにしてチラつきを防ぐ
    streakLen = Math.min(0.6, Math.abs(sp) / H * 0.12);
    const ssp = Math.sign(sp) * Math.min(Math.abs(sp), H * 3); // マイナスなら下から上へ流れる
    for (const s of streaks) { s.y += s.sp * ssp / H * dt; if (s.y > 1.1) { s.y -= 1.2 + s.len; s.x = Math.random(); } if (s.y < -0.3) s.y += 1.3; }
  }

  // ---- 画面サイズに合わせてレイアウト ----
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    top = 56;
    safeBottom = Math.max(40, H * 0.08);

    if (paddle) layoutPaddle();
    if (bgTheme) buildBg(bgTheme);
  }

  function layoutPaddle() {
    paddle.w = W * CFG.paddleW * objK();
    paddle.h = Math.max(10, W * 0.035) * objK();
    paddle.baseY = H - safeBottom - paddle.h;      // 一番下（従来の位置）
    paddle.minY = Math.min(paddle.baseY, brickBottom + Math.max(12, W * 0.06)); // ブロックのすぐ下
    if (!CFG.vMove || paddle.y == null) paddle.y = paddle.baseY;
    paddle.y = Math.max(paddle.minY, Math.min(paddle.baseY, paddle.y));
    if (targetY == null || !CFG.vMove) targetY = paddle.y;
    paddle.x = Math.min(Math.max(paddle.x, -paddle.w / 2), W + paddle.w / 2);
  }

  let rowAmp = [];
  function layoutBricks() {
    const S = brickK(), cols = colsInStage;
    const gap = Math.max(0.5, 3 * S), side = 6;
    const bw = (W - side * 2 - gap * (cols - 1)) / cols;
    const bh = Math.max(12, H * 0.024) * S;
    brickTop = top + 20; brickRowH = bh + gap; brickColW = bw + gap; brickSide = side;
    brickGrid = [];
    for (const b of bricks) {
      b.baseX = side + b.c * (bw + gap);
      b.x = b.baseX;
      b.y = brickTop + b.r * brickRowH;
      b.w = bw; b.h = bh;
      (brickGrid[b.r] || (brickGrid[b.r] = []))[b.c] = b; // 段・列から直接引けるように
    }
    // 動く列：その列の空きスペースぶんだけ左右に揺れる
    rowAmp = [];
    for (let r = 0; r < rowsInStage; r++) {
      if (!movingRows[r]) { rowAmp[r] = 0; continue; }
      const cs = bricks.filter(b => b.r === r).map(b => b.c);
      if (!cs.length) { rowAmp[r] = 0; continue; }
      const left = Math.min(...cs), right = colsInStage - 1 - Math.max(...cs);

  }
  // 動く列の位置を更新
  let stageTime = 0;
  function moveBricks(dt) {

    for (const b of bricks) {
      const a = rowAmp[b.r] || 0;

  }

  // ヒビの形（ブロック内の相対座標 0〜1）。HPが減るほど本数が増える
  function makeCracks() {
    const list = [];
    for (let k = 0; k < 3; k++) {
      let x = Math.random(), y = Math.random() < 0.5 ? 0 : 1;
      const pts = [x, y];
      const dir = y === 0 ? 1 : -1;
      for (let i = 0; i < 3; i++) {
        x = Math.max(0.05, Math.min(0.95, x + (Math.random() - 0.5) * 0.35));
        y += dir * (0.2 + Math.random() * 0.25);
        pts.push(x, Math.max(0, Math.min(1, y)));
      }
      list.push(pts);
    }
    return list;
  }

  // 速度 → ダメージ（初期速度でほぼ0、最高速度で最奥の段も一撃）
  function damageAt(v) {
    const lo = H * CFG.speed, hi = H * CFG.maxSpeed;
    const u = Math.max(0, Math.min(1, (v - lo) / Math.max(hi - lo, 1)));
    return Math.round((DMG_MIN + (DMG_MAX - DMG_MIN) * u * u) * CFG.dmgScale);
  }

  // ステージが進むほどブロックが硬くなる（第10ステージで約2倍）
  const hpScaleOf = n => 1 + 0.11 * (n - 1);
  // 段の深さ（0=一番奥 1=一番手前）からHPを決める（6段のときの HP_BY_ROW と同じ）
  function hpAtDepth(f) {
    const x = f * (HP_BY_ROW.length - 1), i = Math.min(Math.floor(x), HP_BY_ROW.length - 2);
    return HP_BY_ROW[i] + (HP_BY_ROW[i + 1] - HP_BY_ROW[i]) * (x - i);
  }
  let rowsInStage = ROWS, movingRows = [];
  // サイズを小さくすると、配置図の1マスを f×f 個の小さなブロックに分ける
  const objK = () => CFG.objScale || 1;     // ボール・パドル
  const brickK = () => CFG.brickScale || 1; // ブロック
  const subdiv = () => Math.max(1, Math.round(1 / brickK()));

  let aliveCount = 0; // 残っているブロックの数（毎回数え直さない）
  let colsInStage = COLS, brickGrid = [], brickTop = 0, brickRowH = 1, brickColW = 1, brickSide = 6, rowOff = [];
  function makeBricks() {
    bricks = [];
    const theme = themeOf(stage), k = hpScaleOf(stage), f = subdiv();

  }

  function resetBall() {

  const FREE_KEYS = ['volume', 'bgmVol', 'muted', 'fx', 'bgSpeed', 'sensX', 'sensY', 'vMove', 'cfgVer'];
  const isDefaultPlay = () => Object.keys(DEFAULTS).every(k => FREE_KEYS.includes(k) || Math.abs(Number(CFG[k]) - Number(DEFAULTS[k])) < 1e-6);

  // ---- 端末内の記録（オンラインは RANKING_URL へ送信） ----

  function loadScores() { try { return JSON.parse(localStorage.getItem(SCORE_KEY) || '[]'); } catch (e) { return []; } }
  function saveScore() {

  // ---- 入力（指ドラッグ） ----

  const firstTouch = e => e.targetTouches ? e.targetTouches[0] : e.touches ? e.touches[0] : e;
  function pointerX(e) {
    const t = firstTouch(e);

  }
