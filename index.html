<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>SpinSmash</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b1020; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    color: #e8ecff;
  }
  #wrap { display: flex; width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; flex: 1 1 auto; min-width: 0; height: 100%; }

  /* ---- 調整パネル ---- */
  #panel {
    flex: 0 0 clamp(138px, 36vw, 220px);
    height: 100%; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 12px);
    background: #141a30; border-left: 1px solid rgba(255,255,255,0.1);
    overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    font-size: 11px;
  }
  .btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .btns button {
    flex: 1; padding: 9px 0; border: 0; border-radius: 8px;
    background: #2b3560; color: #fff; font-size: 12px; font-weight: bold; white-space: nowrap;
    font-family: inherit; touch-action: manipulation;
  }
  .btns button.on { background: #ff4d6d; }
  #muteBtn { flex: 0 0 44px; }
  .meter { margin-bottom: 10px; }
  .meter .bar { position: relative; height: 8px; background: rgba(255,255,255,0.12); border-radius: 4px; margin-top: 4px; }
  .meter .fill { position: absolute; top: 0; height: 100%; border-radius: 4px; }
  .meter .mid { position: absolute; left: 50%; top: -3px; width: 1px; height: 14px; background: rgba(255,255,255,0.6); }
  h3 { font-size: 11px; margin: 10px 0 4px; color: #9aa6d6; letter-spacing: .05em; }
  .row { margin-bottom: 8px; }
  .row .lab { display: flex; justify-content: space-between; gap: 4px; }
  .row .lab b { font-weight: 600; }
  .row .lab span { color: #4dd8ff; font-variant-numeric: tabular-nums; }
  .row .key { color: #6c78a8; font-size: 10px; }
  input[type=range] { width: 100%; margin: 4px 0 0; touch-action: pan-x; accent-color: #4dd8ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="panel">
    <div class="btns">
      <button id="pauseBtn">⏸ ポーズ</button>
      <button id="muteBtn">🔊</button>
    </div>
    <div class="btns">
      <button id="resetBtn">値を初期化</button>
      <button id="restartBtn">最初から</button>
    </div>
    <div class="meter">
      <div class="lab">速度 <span id="speedVal">0</span></div>
      <div class="bar"><div class="fill" id="speedFill" style="left:0"></div><div class="mid" id="beamMark"></div></div>
    </div>
    <div class="meter">
      <div class="lab">回転 <span id="spinVal">0</span></div>
      <div class="bar"><div class="fill" id="spinFill"></div><div class="mid"></div></div>
    </div>
    <div id="sliders"></div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---- 基本設定 ----
  const COLS = 7, ROWS = 6, LIVES = 3;
  // ブロックのHP（上＝奥の段 → 下＝手前の段）
  const HP_BY_ROW = [100, 75, 55, 35, 20, 10];
  const DMG_MIN = 1, DMG_MAX = 100; // 初期速度で1、最高速度で100
  const COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];
  const BALL_COLOR_A = '#ff4d6d';
  const BALL_COLOR_B = '#4dd8ff';

  // ---- 調整できる値（初期値） ----
  const DEFAULTS = {
    // 回転
    paddleGrip: 2.0,   // パドルで擦った時に回転へ変わる割合
    paddlePush: 1.0,  // パドルで擦った時にボールが横へ押される割合
    wallGrip:   0.3,   // 壁・ブロックで回転が消費される割合
    wallKick:   0.35,  // 壁・ブロックで回転が反射角に変わる割合
    curve:      1.5,  // 空中でのカーブの強さ
    decay:      0.5,   // 時間による回転の減衰
    maxSpin:    2.0,   // 最大回転（画面高さ比）
    // 基本
    speed:      0.3,   // 発射時のボール速度（画面高さ/秒）
    spinAccel:  1.05,  // 回転をかけて打った時の加速倍率（最大回転でこの倍率、回転の強さに比例）
    beamSpeed:  1.0,   // ビームが出始める速度（画面高さ/秒）
    dmgScale:   1.0,   // ダメージ倍率
    maxSpeed:   2.5,   // 最高速度（画面高さ/秒）
    paddleW:    0.6,  // パドル幅（プレイ領域の幅比）
    minVert:    0.3,   // 縦方向の最小比（横に寝すぎ防止）
    // 音
    volume:     0.7,   // 効果音の音量
    muted:      false, // ミュート
    // 演出
    fx:         1.0,   // パドルの光・ビーム・破片の強さ
  };

  const SLIDERS = [
    { group: '回転' },
    { key: 'paddleGrip', label: '擦りの回転量', min: 0, max: 2,   step: 0.05 },
    { key: 'paddlePush', label: '擦りの横押し', min: 0, max: 1,   step: 0.05 },
    { key: 'wallGrip',   label: '反射で回転消費', min: 0, max: 1, step: 0.05 },
    { key: 'wallKick',   label: '反射の曲がり', min: 0, max: 1.5, step: 0.05 },
    { key: 'curve',      label: '空中カーブ',   min: 0, max: 1.5, step: 0.05 },
    { key: 'decay',      label: '回転の減衰',   min: 0, max: 3,   step: 0.05 },
    { key: 'maxSpin',    label: '最大回転',     min: 0.1, max: 2, step: 0.05 },
    { group: '基本' },
    { key: 'speed',      label: 'ボール速度（発射時）', min: 0.1, max: 1.5, step: 0.05 },
    { key: 'spinAccel',  label: '回転で加速（最大倍率）', min: 1, max: 1.2, step: 0.005 },
    { key: 'beamSpeed',  label: 'ビーム発生速度', min: 0.2, max: 2.5, step: 0.05 },
    { group: 'ブロック' },
    { key: 'dmgScale',   label: 'ダメージ倍率', min: 0.2, max: 3, step: 0.1 },
    { key: 'maxSpeed',   label: '最高速度',     min: 0.6, max: 2.5, step: 0.05 },
    { key: 'paddleW',    label: 'パドル幅',     min: 0.1, max: 0.6, step: 0.01 },
    { key: 'minVert',    label: '最小縦角度',   min: 0.1, max: 0.6, step: 0.02 },
    { group: '音' },
    { key: 'volume',     label: '音量',         min: 0, max: 1,   step: 0.05 },
    { group: '演出' },
    { key: 'fx',         label: '演出の強さ',   min: 0, max: 2,   step: 0.1 },
  ];

  // ---- 効果音（素材なし・Web Audioで合成） ----
  const SFX = (() => {
    let ac = null, master = null, noise = null;
    const lastPlay = {};

    function init() {
      if (ac) { if (ac.state !== 'running') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      // iOS 17+：マナーモード中でも鳴らす（未対応なら無視）
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ac = new AC();
      master = ac.createGain();
      master.connect(ac.destination);
      setVolume();
      // 使い回すホワイトノイズ
      noise = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }

    function setVolume() {
      if (master) master.gain.value = CFG.muted ? 0 : CFG.volume;
    }

    // 同じ種類の音が同時に重なりすぎないように
    function ok(kind, gapMs) {
      if (!ac || CFG.muted || CFG.volume <= 0) return false;
      const now = performance.now();
      if (lastPlay[kind] && now - lastPlay[kind] < gapMs) return false;
      lastPlay[kind] = now;
      return true;
    }

    // 卓球の「コン」：短い倍音＋ごく短いノイズのアタック
    function pock(freq, decay, gain, bright) {
      const t = ac.currentTime;
      const out = ac.createGain();
      out.gain.setValueAtTime(gain, t);
      out.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      out.connect(master);

      for (const [mul, g] of [[1, 1], [2.32, 0.35], [3.9, 0.12]]) {
        const o = ac.createOscillator();
        const og = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq * mul * 1.15, t);
        o.frequency.exponentialRampToValueAtTime(freq * mul, t + 0.012);
        og.gain.value = g;
        o.connect(og); og.connect(out);
        o.start(t); o.stop(t + decay + 0.02);
      }

      const n = ac.createBufferSource();
      n.buffer = noise;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = bright; bp.Q.value = 1.2;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(gain * 0.9, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
      n.connect(bp); bp.connect(ng); ng.connect(master);
      n.start(t); n.stop(t + 0.02);
    }

    // 鋭いアタック「カッ」：ごく短い高域ノイズ
    function click(gain, freq, len) {
      const t = ac.currentTime;
      const n = ac.createBufferSource();
      n.buffer = noise;
      const hp = ac.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = freq;
      const g = ac.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      n.connect(hp); hp.connect(g); g.connect(master);
      n.start(t); n.stop(t + len + 0.01);
    }

    // 打球後の風切り「シュー！」：帯域が上がって下がる（通り過ぎる感じ）
    function whoosh(amount, pitch) {
      const t = ac.currentTime + 0.015;
      const len = 0.2 + 0.5 * amount;
      const n = ac.createBufferSource();
      n.buffer = noise; n.loop = true;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(1400 * pitch, t);
      bp.frequency.exponentialRampToValueAtTime(5500 * pitch, t + len * 0.35);
      bp.frequency.exponentialRampToValueAtTime(2200 * pitch, t + len);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.15 + 0.6 * amount, t + len * 0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      n.connect(bp); bp.connect(g); g.connect(master);
      n.start(t); n.stop(t + len + 0.02);
    }

    function tone(f0, f1, start, dur, gain, type) {
      const t = ac.currentTime + start;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.02);
    }

    // ラリーが続くほど音程が上がる
    const rallyPitch = (rally) => 1 + Math.min(rally, 16) * 0.025;

    return {
      init, setVolume,
      // power: 当たりの強さ 0〜1 / spin: 回転の強さ 0〜1
      paddle(power, spin, rally) {
        if (!ok('paddle', 40)) return;
        const p = rallyPitch(rally);
        tone(170 * p, 65, 0, 0.09, 0.55 + 0.4 * power);               // ドンという芯（力強さ）
        pock(820 * p, 0.1, 0.5 + 0.35 * power, 2600);                // ラバーの「コン」
        pock(2400 * p, 0.035, 0.12 + 0.3 * power, 6000);             // スマッシュの抜け
        click(0.2 + 0.9 * spin, 2500 + 3500 * spin, 0.008 + 0.012 * spin); // 「カッ！」
        if (spin > 0.06) whoosh(Math.min(1, spin), p);               // 「シュー！」
      },
      wall(power) {
        if (!ok('wall', 35)) return;
        pock(1250, 0.06, 0.3 + 0.3 * power, 3500);
        click(0.12 + 0.2 * power, 4500, 0.006);
      },
      // 削っただけ：鈍い「ゴッ」。削れているほど低く濁る
      brickHit(row, power, worn) {
        if (!ok('brickHit', 30)) return;
        const f = (700 + (ROWS - 1 - row) * 40) * (1 - 0.25 * worn);
        tone(180, 90, 0, 0.06, 0.25 + 0.2 * power);
        pock(f, 0.05, 0.3 + 0.3 * power, 1800);
      },
      brick(row, power, chain, pierce) {
        if (!ok('brick', 30)) return;
        if (pierce) click(0.35, 3000, 0.02); // 砕ける「バキッ」
        const f = (1500 + (ROWS - 1 - row) * 90) * (1 + Math.min(chain, 10) * 0.05);
        tone(240, 110, 0, 0.05, 0.2 + 0.25 * power);
        pock(f, 0.08, 0.45 + 0.4 * power, 4000);
        click(0.18 + 0.25 * power, 5000, 0.007);
      },
      rallyUp(rally) { // 5ラリーごとのごほうび音
        if (!ok('rallyUp', 300)) return;
        const p = rallyPitch(rally);
        [0, 0.07, 0.14].forEach((d, i) => tone(1320 * p * (1 + i * 0.26), 1320 * p * (1 + i * 0.26), d, 0.12, 0.18, 'triangle'));
      },
      // 「ギュイーン！」：amount=加速の大きさ 0〜1、level=今の速さ 0〜1
      powerUp(amount, level) {
        if (!ok('powerUp', 60)) return;
        const a = Math.max(0.15, Math.min(1, amount));
        const t = ac.currentTime + 0.03;
        const dur = 0.25 + 0.45 * a;
        const f0 = 140 + 420 * level, f1 = f0 * (2 + 1.2 * a);
        const out = ac.createGain();
        out.gain.setValueAtTime(0.0001, t);
        out.gain.exponentialRampToValueAtTime(0.16 + 0.18 * a, t + 0.05);
        out.gain.setValueAtTime(0.16 + 0.18 * a, t + dur * 0.7);
        out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.Q.value = 9;
        lp.frequency.setValueAtTime(500, t);
        lp.frequency.exponentialRampToValueAtTime(5000 + 4000 * level, t + dur * 0.8);
        lp.connect(out); out.connect(master);
        // うなり（ビブラート）
        const lfo = ac.createOscillator();
        const lfoG = ac.createGain();
        lfo.frequency.value = 16 + 10 * a;
        lfoG.gain.value = f0 * 0.05;
        lfo.connect(lfoG);
        for (const [type, det] of [['sawtooth', 1], ['square', 1.007]]) {
          const o = ac.createOscillator();
          o.type = type;
          o.frequency.setValueAtTime(f0 * det, t);
          o.frequency.exponentialRampToValueAtTime(f1 * det, t + dur * 0.85);
          lfoG.connect(o.frequency);
          const g = ac.createGain(); g.gain.value = type === 'square' ? 0.4 : 0.6;
          o.connect(g); g.connect(lp);
          o.start(t); o.stop(t + dur + 0.02);
        }
        lfo.start(t); lfo.stop(t + dur + 0.02);
      },
      // ビームが出た瞬間：きらめき＋噴射
      beamOn() {
        if (!ok('beamOn', 400)) return;
        [1760, 2217, 2637].forEach((f, i) => tone(f, f * 1.02, 0.12 + i * 0.05, 0.25, 0.14, 'triangle'));
        whoosh(1, 0.8);
        tone(90, 45, 0.05, 0.4, 0.45);
      },
      miss() {
        if (!ok('miss', 200)) return;
        tone(420, 140, 0, 0.35, 0.35, 'triangle');
      },
      clear() {
        if (!ok('clear', 500)) return;
        [1320, 1660, 1980, 2640].forEach((f, i) => setTimeout(() => { pock(f, 0.15, 0.6, 4000); click(0.3, 5000, 0.01); }, i * 100));
      },
    };
  })();

  const STORE_KEY = 'breakout-test-cfg-v2';
  const CFG = { ...DEFAULTS };
  try { Object.assign(CFG, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}
  // 旧方式（加算）の値が残っていたら新方式（倍率）の初期値にする
  if (!(CFG.spinAccel >= 1)) CFG.spinAccel = DEFAULTS.spinAccel;
  function saveCfg() { try { localStorage.setItem(STORE_KEY, JSON.stringify(CFG)); } catch (e) {} }

  let W, H, dpr, top, safeBottom;
  let paddle, ball, bricks, score, lives, state, targetX, paused = false;
  // 演出用
  let rally = 0, chain = 0, bestRally = 0;
  let paddleGlow = 0, rallyPop = 0;
  let trail = [], particles = [], dmgTexts = [];

  // ---- 画面サイズに合わせてレイアウト ----
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    top = 56;
    safeBottom = Math.max(40, H * 0.08);
    if (paddle) layoutPaddle();
    if (bricks) layoutBricks();
  }

  function layoutPaddle() {
    paddle.w = W * CFG.paddleW;
    paddle.h = Math.max(10, W * 0.035);
    paddle.y = H - safeBottom - paddle.h;
    paddle.x = Math.min(Math.max(paddle.x, paddle.w / 2), W - paddle.w / 2);
  }

  function layoutBricks() {
    const gap = 3, side = 6;
    const bw = (W - side * 2 - gap * (COLS - 1)) / COLS;
    const bh = Math.max(12, H * 0.024);
    for (const b of bricks) {
      b.x = side + b.c * (bw + gap);
      b.y = top + 20 + b.r * (bh + gap);
      b.w = bw; b.h = bh;
    }
  }

  // ヒビの形（ブロック内の相対座標 0〜1）。HPが減るほど本数が増える
  function makeCracks() {
    const list = [];
    for (let k = 0; k < 3; k++) {
      let x = Math.random(), y = Math.random() < 0.5 ? 0 : 1;
      const pts = [x, y];
      const dir = y === 0 ? 1 : -1;
      for (let i = 0; i < 3; i++) {
        x = Math.max(0.05, Math.min(0.95, x + (Math.random() - 0.5) * 0.35));
        y += dir * (0.2 + Math.random() * 0.25);
        pts.push(x, Math.max(0, Math.min(1, y)));
      }
      list.push(pts);
    }
    return list;
  }

  // 速度 → ダメージ（初期速度でほぼ0、最高速度で最奥の段も一撃）
  function damageAt(v) {
    const lo = H * CFG.speed, hi = H * CFG.maxSpeed;
    const u = Math.max(0, Math.min(1, (v - lo) / Math.max(hi - lo, 1)));
    return Math.round((DMG_MIN + (DMG_MAX - DMG_MIN) * u * u) * CFG.dmgScale);
  }

  function makeBricks() {
    bricks = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        bricks.push({ r, c, alive: true, color: COLORS[r], hp: HP_BY_ROW[r], maxHp: HP_BY_ROW[r], cracks: makeCracks(), hitT: 0 });
    layoutBricks();
  }

  function resetBall() {
    ball.r = Math.max(6, W * 0.022);
    ball.x = paddle.x;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0; ball.vy = 0;
    ball.spin = 0;
    ball.rot = 0;
    trail = [];
    rally = 0; chain = 0;
    state = 'ready';
  }

  function launch() {
    const speed = H * CFG.speed;
    const ang = (-90 + (Math.random() * 40 - 20)) * Math.PI / 180;
    ball.vx = Math.cos(ang) * speed;
    ball.vy = Math.sin(ang) * speed;
    state = 'play';
  }

  function newGame() {
    score = 0; lives = LIVES; bestRally = 0; particles = []; dmgTexts = [];
    paddle = { x: W / 2, vx: 0, prevX: W / 2 };
    layoutPaddle();
    targetX = paddle.x;
    ball = {};
    makeBricks();
    resetBall();
  }

  // ---- 入力（指ドラッグ） ----
  function pointerX(e) {
    const t = e.touches ? e.touches[0] : e;
    return t ? t.clientX - cv.getBoundingClientRect().left : null;
  }
  function onDown(e) {
    e.preventDefault();
    SFX.init(); // iOSは画面に触れた時に音を有効化する必要がある
    if (paused) return;
    const x = pointerX(e);
    if (x !== null) targetX = x;
    if (state === 'ready') { launch(); SFX.paddle(0.5, 0, 0); }
    else if (state === 'over' || state === 'clear') newGame();
  }
  function onMove(e) {
    e.preventDefault();
    if (paused) return;
    const x = pointerX(e);
    if (x !== null) targetX = x;
  }
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', e => { if (e.buttons) onMove(e); });
  window.addEventListener('resize', resize);

  // ---- 物理の補助 ----
  const speedOf = () => Math.hypot(ball.vx, ball.vy);

  function setSpeed(s) {
    const cur = speedOf() || 1;
    ball.vx *= s / cur; ball.vy *= s / cur;
  }

  function clampSpin() {
    const m = H * CFG.maxSpin;
    ball.spin = Math.max(-m, Math.min(m, ball.spin));
  }

  function keepVertical(preferUp) {
    const s = speedOf();
    const minVy = s * CFG.minVert;
    if (Math.abs(ball.vy) < minVy) {
      const dir = ball.vy !== 0 ? Math.sign(ball.vy) : (preferUp ? -1 : 1);
      ball.vy = dir * minVy;
      ball.vx = (Math.sign(ball.vx) || 1) * Math.sqrt(s * s - minVy * minVy);
    }
  }

  // 面との摩擦：回転 ⇄ 接線方向の速度 を交換する
  function friction(nx, ny, surfVel, grip, kick) {
    const tx = -ny, ty = nx;
    const vt = ball.vx * tx + ball.vy * ty - surfVel;
    const slip = vt - ball.spin;
    ball.vx -= kick * slip * tx;
    ball.vy -= kick * slip * ty;
    ball.spin += grip * slip;
    clampSpin();
  }

  // 当たりの強さ（0〜1）：面に垂直な速さで決める
  const powerOf = (dot) => Math.min(1, Math.abs(dot) / (H * 1.2));

  function bounce(nx, ny, sound, row) {
    const s = speedOf();
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot >= 0) return;
    if (!sound) SFX.wall(powerOf(dot));
    ball.vx -= 2 * dot * nx;
    ball.vy -= 2 * dot * ny;
    friction(nx, ny, 0, CFG.wallGrip, CFG.wallKick);
    setSpeed(s);
    keepVertical(ny < 0);
  }

  // ---- 更新 ----
  function spawnParticles(b, nX, nY, amount) {
    const n = Math.round(7 * CFG.fx * (amount == null ? 1 : amount));
    for (let i = 0; i < n && particles.length < 90; i++) {
      const sp = H * (0.25 + Math.random() * 0.5);
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: b.x + Math.random() * b.w, y: b.y + Math.random() * b.h,
        vx: Math.cos(a) * sp * 0.6 - nX * sp * 0.3 + ball.vx * 0.15,
        vy: Math.sin(a) * sp * 0.6 - nY * sp * 0.3,
        life: 0.4 + Math.random() * 0.3, max: 0.7,
        s: 2 + Math.random() * 4, color: b.color,
      });
    }
  }

  // ビーム用の軌跡を記録（近すぎる点は間引く）
  function recordTrail() {
    const n = trail.length;
    if (n >= 2) {
      const dx = ball.x - trail[n - 2], dy = ball.y - trail[n - 1];
      if (dx * dx + dy * dy < 16) return;
    }
    trail.push(ball.x, ball.y);
    if (trail.length > 600) trail.splice(0, trail.length - 600);
  }

  function addDamageText(b, dmg, kill) {
    if (CFG.fx <= 0) return;
    if (dmgTexts.length > 30) dmgTexts.shift();
    dmgTexts.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, text: kill ? `${dmg}!` : `${dmg}`, kill, life: 0.7 });
  }

  function updateFx(dt) {
    for (const t of dmgTexts) { t.y -= H * 0.06 * dt; t.life -= dt; }
    if (dmgTexts.length) dmgTexts = dmgTexts.filter(t => t.life > 0);
    for (const b of bricks) if (b.hitT > 0) b.hitT = Math.max(0, b.hitT - dt * 8);
    paddleGlow *= Math.exp(-dt * 7);
    rallyPop *= Math.exp(-dt * 6);
    for (const p of particles) {
      p.vy += H * 1.6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
    }
    if (particles.length) particles = particles.filter(p => p.life > 0);
    if (state === 'play') {
      // 記録は step() 内で行う
    } else if (trail.length) trail = [];
  }

  function update(dt) {
    updateFx(dt);
    paddle.x = Math.min(Math.max(targetX, paddle.w / 2), W - paddle.w / 2);
    const instVx = (paddle.x - paddle.prevX) / Math.max(dt, 1e-3);
    paddle.vx += (instVx - paddle.vx) * 0.5;
    paddle.prevX = paddle.x;

    if (state === 'ready') {
      ball.x = paddle.x;
      ball.y = paddle.y - ball.r - 1;
      return;
    }
    if (state !== 'play') return;

    const steps = Math.max(1, Math.ceil(speedOf() * dt / (ball.r * 0.8)));
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === 'play'; i++) step(sdt);
  }

  function step(dt) {
    // 空中のカーブ
    const s = speedOf();
    const a = CFG.curve * ball.spin;
    const vx0 = ball.vx, vy0 = ball.vy;
    ball.vx += (-vy0 / s) * a * dt;
    ball.vy += ( vx0 / s) * a * dt;
    setSpeed(s);

    ball.spin *= Math.exp(-CFG.decay * dt);
    clampSpin();
    ball.rot += ball.spin / ball.r * dt;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    recordTrail();

    // 壁
    if (ball.x < ball.r)       { ball.x = ball.r;       bounce(1, 0); }
    if (ball.x > W - ball.r)   { ball.x = W - ball.r;   bounce(-1, 0); }
    if (ball.y < top + ball.r) { ball.y = top + ball.r; bounce(0, 1); }

    // パドル
    const px = paddle.x - paddle.w / 2;
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= px - ball.r && ball.x <= px + paddle.w + ball.r) {
      const power = Math.min(1, powerOf(ball.vy) + Math.min(1, Math.abs(paddle.vx) / (W * 4)) * 0.5);
      const spin0 = ball.spin;
      const hit = (ball.x - paddle.x) / (paddle.w / 2);
      const ang = Math.max(-1, Math.min(1, hit)) * 60 * Math.PI / 180;
      const sp = Math.min(speedOf(), H * CFG.maxSpeed);
      ball.vx = Math.sin(ang) * sp;
      ball.vy = -Math.cos(ang) * sp;
      friction(0, -1, paddle.vx, CFG.paddleGrip, CFG.paddlePush);
      setSpeed(sp);
      if (ball.vy > 0) ball.vy = -ball.vy;
      keepVertical(true);
      ball.y = paddle.y - ball.r;
      // 回転の強さ：かけた量と打球後の回転の大きい方
      const maxS = H * Math.max(CFG.maxSpin, 0.01);
      const spinAmt = Math.min(1, Math.max(Math.abs(ball.spin - spin0), Math.abs(ball.spin)) / maxS);
      // 回転をかけるほど加速
      if (spinAmt > 0.05 && CFG.spinAccel > 1) {
        const before = speedOf();
        const mul = 1 + (CFG.spinAccel - 1) * spinAmt; // 最大回転で spinAccel 倍
        const after = Math.min(before * mul, H * CFG.maxSpeed);
        if (after > before * 1.002) {
          setSpeed(after);
          const level = Math.min(1, after / (H * Math.max(CFG.maxSpeed, 0.1)));
          SFX.powerUp((after / before - 1) / (CFG.spinAccel - 1), level);
          if (before < H * CFG.beamSpeed && after >= H * CFG.beamSpeed) SFX.beamOn();
        }
      }
      rally++; chain = 0;
      bestRally = Math.max(bestRally, rally);
      SFX.paddle(power, spinAmt, rally);
      if (rally % 5 === 0) SFX.rallyUp(rally);
      // 演出：パドルが光る
      paddleGlow = 1;
      rallyPop = 1;
    }

    // ブロック
    for (const b of bricks) {
      if (!b.alive) continue;
      const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      let dx = ball.x - nx, dy = ball.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 <= ball.r * ball.r) {
        let d = Math.sqrt(d2);
        if (d < 1e-6) {
          const s2 = speedOf(); dx = -ball.vx / s2; dy = -ball.vy / s2; d = 1;
        }
        const nX = dx / d, nY = dy / d;
        const dmg = Math.min(damageAt(speedOf()), b.hp);
        const power = powerOf(ball.vx * nX + ball.vy * nY);
        b.hp -= dmg;
        b.hitT = 1;
        addDamageText(b, dmg, b.hp <= 0);
        if (b.hp <= 0) {
          // 倒した：跳ね返らずに貫通
          b.alive = false;
          score += b.maxHp;
          chain++;
          SFX.brick(b.r, power, chain, true);
          spawnParticles(b, -ball.vx / speedOf(), -ball.vy / speedOf(), 1);
          if (bricks.every(k => !k.alive)) { state = 'clear'; SFX.clear(); break; }
          continue; // 同じ瞬間に触れている他のブロックも判定
        }
        // 倒せなかった：削って跳ね返る
        ball.x = nx + nX * ball.r;
        ball.y = ny + nY * ball.r;
        bounce(nX, nY, 'brickHit', b.r);
        SFX.brickHit(b.r, power, 1 - b.hp / b.maxHp);
        spawnParticles(b, nX, nY, 0.3);
        break;
      }
    }

    // 落下
    if (ball.y - ball.r > H) {
      lives--;
      SFX.miss();
      if (lives <= 0) state = 'over';
      else resetBall();
    }
  }

  // ---- 描画 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- ビーム ----
  // 速度 → 色と長さ（赤→黄→青→紫→ピンク）／回転 → 太さと巻き付く稲妻の量
  const BEAM_COLORS = [[255, 50, 40], [255, 215, 30], [40, 140, 255], [165, 70, 255], [255, 80, 200]];
  function beamColor(t) {
    const x = Math.max(0, Math.min(1, t)) * (BEAM_COLORS.length - 1);
    const i = Math.min(Math.floor(x), BEAM_COLORS.length - 2), f = x - i;
    const a = BEAM_COLORS[i], b = BEAM_COLORS[i + 1];
    return [0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * f));
  }

  // 先頭（ボール）から指定の長さだけ軌跡をさかのぼった折れ線
  function beamPath(maxLen) {
    const pts = [ball.x, ball.y];
    let len = 0;
    for (let i = trail.length - 2; i >= 0; i -= 2) {
      const px = pts[pts.length - 2], py = pts[pts.length - 1];
      const x = trail[i], y = trail[i + 1];
      const d = Math.hypot(x - px, y - py);
      if (d < 1e-3) continue;
      if (len + d >= maxLen) {
        const f = (maxLen - len) / d;
        pts.push(px + (x - px) * f, py + (y - py) * f);
        len = maxLen;
        break;
      }
      len += d;
      pts.push(x, y);
    }
    return { pts, len };
  }

  function strokePart(pts, upto) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < upto; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.stroke();
  }

  function drawTrail() {
    if (CFG.fx <= 0 || trail.length < 2 || state !== 'play') return;
    const fx = Math.min(CFG.fx, 2);
    const speed = speedOf();
    const lo = H * CFG.beamSpeed, hi = H * CFG.maxSpeed;
    if (speed < lo) return; // ビーム発生速度に届くまでは出さない
    const sp = Math.max(0, Math.min(1, (speed - lo) / Math.max(hi - lo, 1)));
    const spinR = Math.min(1, Math.abs(ball.spin) / (H * Math.max(CFG.maxSpin, 0.01)));

    const { pts, len } = beamPath(H * (0.05 + 0.55 * sp) * Math.min(fx, 1.5));
    const n = pts.length;
    if (n < 4 || len < 2) return;

    const [r, g, b] = beamColor(sp);
    const w = ball.r * (0.9 + 2.2 * spinR) * (0.65 + 0.5 * sp);
    const a = (0.45 + 0.55 * sp) * Math.min(fx, 1.2);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 先頭ほど太く明るく：長さを変えて重ね描き
    const LEVELS = [1, 0.8, 0.6, 0.4, 0.22];
    for (let li = 0; li < LEVELS.length; li++) {
      // 全長のうち先頭側 LEVELS[li] の部分
      const want = len * LEVELS[li];
      let acc = 0, upto = 2;
      for (; upto < n; upto += 2) {
        acc += Math.hypot(pts[upto] - pts[upto - 2], pts[upto + 1] - pts[upto - 1]);
        if (acc >= want) { upto += 2; break; }
      }
      upto = Math.min(upto, n);
      const k = 0.55 + 0.45 * (li / (LEVELS.length - 1));
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.08 * a})`;
      ctx.lineWidth = w * 3.4 * k;
      strokePart(pts, upto);
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.28 * a})`;
      ctx.lineWidth = w * 1.7 * k;
      strokePart(pts, upto);
      ctx.strokeStyle = `rgba(255,255,255,${0.22 * a})`;
      ctx.lineWidth = w * 0.6 * k;
      strokePart(pts, upto);
    }

    // 巻き付く稲妻：回転が強いほど本数と振れ幅が増える
    const bolts = spinR > 0.08 ? Math.min(6, Math.ceil(spinR * 6)) : 0;
    if (bolts > 0) {
      const time = performance.now() / 1000;
      const dir = Math.sign(ball.spin) || 1;
      const stepLen = Math.max(9, ball.r * 1.3);
      const boltLen = len * 0.95;
      ctx.lineWidth = 1 + 1.2 * spinR;
      for (let k = 0; k < bolts; k++) {
        const ph = k * (Math.PI * 2 / bolts);
        ctx.strokeStyle = k % 2
          ? `rgba(255,255,255,${0.55 * a + 0.2})`
          : `rgba(${Math.min(255, r + 120)},${Math.min(255, g + 120)},${Math.min(255, b + 120)},${0.6 * a + 0.2})`;
        ctx.beginPath();
        // 毎フレーム違う区間に走らせてバチバチ点滅させる
        const from = Math.random() * boltLen * 0.45;
        const to = Math.min(boltLen, from + boltLen * (0.35 + 0.5 * Math.random()));
        let si = 2, segStart = 0, first = true;
        for (let d = from; d <= to; d += stepLen * (0.6 + Math.random() * 0.8)) {
          // 折れ線上の距離 d の位置と法線
          while (si < n - 2 && segStart + Math.hypot(pts[si] - pts[si - 2], pts[si + 1] - pts[si - 1]) < d) {
            segStart += Math.hypot(pts[si] - pts[si - 2], pts[si + 1] - pts[si - 1]);
            si += 2;
          }
          const x0 = pts[si - 2], y0 = pts[si - 1], x1 = pts[si], y1 = pts[si + 1];
          const sl = Math.hypot(x1 - x0, y1 - y0) || 1;
          const f = Math.min(1, (d - segStart) / sl);
          const nx = -(y1 - y0) / sl, ny = (x1 - x0) / sl;
          const taper = 1 - d / boltLen;
          // らせん（回転方向に流れる）＋ギザギザ
          const amp = w * (0.7 + 0.6 * spinR) * (0.4 + 0.6 * taper);
          const off = Math.sin(ph + d * 0.045 - dir * time * 14) * amp * 0.8 + (Math.random() - 0.5) * amp * 1.1;
          const x = x0 + (x1 - x0) * f + nx * off, y = y0 + (y1 - y0) * f + ny * off;
          if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    // ボール周りの光
    ctx.fillStyle = `rgba(${r},${g},${b},${0.25 * a})`;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r + w * 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ラリー数：画面中央に大きく
  function drawRally() {
    if (rally < 2 || state === 'over') return;
    const hue = (200 + rally * 18) % 360;
    const size = Math.min(W * 0.22, 40 + rally * 2) * (1 + 0.35 * rallyPop);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `hsla(${hue},90%,65%,${0.18 + 0.4 * rallyPop})`;
    ctx.font = `900 ${size}px -apple-system, "Hiragino Sans", sans-serif`;
    ctx.fillText(rally, W / 2, H * 0.5);
    ctx.font = `bold 13px -apple-system, "Hiragino Sans", sans-serif`;
    ctx.fillText('RALLY', W / 2, H * 0.5 + size * 0.6);
  }

  function drawBall() {
    const { x, y, r, rot } = ball;
    ctx.fillStyle = BALL_COLOR_A;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, rot + Math.PI / 2, rot + Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = BALL_COLOR_B;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, rot - Math.PI / 2, rot + Math.PI / 2);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px -apple-system, "Hiragino Sans", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 10, top / 2 + 8);
    ctx.textAlign = 'right';
    ctx.fillText('♥'.repeat(Math.max(lives, 0)), W - 10, top / 2 + 8);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(0, top, W, 1);

    const fx = CFG.fx;

    drawRally();

    for (const b of bricks) {
      if (!b.alive) continue;
      const ratio = b.hp / b.maxHp;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 3);
      ctx.fill();
      // 削れるほど暗く
      if (ratio < 1) {
        ctx.fillStyle = `rgba(0,0,0,${0.45 * (1 - ratio)})`;
        ctx.fill();
        // ヒビ
        const nCrack = Math.min(3, Math.ceil((1 - ratio) * 3));
        ctx.strokeStyle = 'rgba(10,12,25,0.85)';
        ctx.lineWidth = 1.2;
        for (let k = 0; k < nCrack; k++) {
          const c = b.cracks[k];
          ctx.beginPath();
          ctx.moveTo(b.x + c[0] * b.w, b.y + c[1] * b.h);
          for (let i = 2; i < c.length; i += 2) ctx.lineTo(b.x + c[i] * b.w, b.y + c[i + 1] * b.h);
          ctx.stroke();
        }
      }
      // 当たった瞬間に白く光る
      if (b.hitT > 0) {
        ctx.fillStyle = `rgba(255,255,255,${0.5 * b.hitT})`;
        roundRect(b.x, b.y, b.w, b.h, 3);
        ctx.fill();
      }
      // HPバー
      const bh = Math.max(2, b.h * 0.14);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(b.x + 2, b.y + b.h - bh - 2, b.w - 4, bh);
      ctx.fillStyle = ratio > 0.5 ? '#ffffff' : ratio > 0.25 ? '#ffd166' : '#ff5d73';
      ctx.fillRect(b.x + 2, b.y + b.h - bh - 2, (b.w - 4) * ratio, bh);
    }

    // 破片
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // ダメージ数値
    if (dmgTexts.length) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const t of dmgTexts) {
        ctx.globalAlpha = Math.min(1, t.life / 0.4);
        ctx.font = t.kill ? 'bold 15px -apple-system, "Hiragino Sans", sans-serif' : 'bold 12px -apple-system, "Hiragino Sans", sans-serif';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillText(t.text, t.x + 1, t.y + 1);
        ctx.fillStyle = t.kill ? '#fff27a' : '#ffffff';
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }

    // パドル（打った瞬間に光る）
    if (paddleGlow > 0.02 && fx > 0) {
      ctx.fillStyle = `rgba(120,220,255,${0.35 * paddleGlow * Math.min(fx, 1.5)})`;
      const g = paddle.h * 1.2 * paddleGlow;
      roundRect(paddle.x - paddle.w / 2 - g, paddle.y - g, paddle.w + g * 2, paddle.h + g * 2, paddle.h / 2 + g);
      ctx.fill();
    }
    ctx.fillStyle = paddleGlow > 0.5 ? '#ffffff' : '#e8ecff';
    roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, paddle.h / 2);
    ctx.fill();

    if (state !== 'over') { drawTrail(); drawBall(); }



    let msg = null, sub = null;
    if (paused)                 { msg = 'PAUSE'; sub = '右の「再開」で戻る'; }
    else if (state === 'ready') { msg = 'タップでスタート'; sub = '打つ瞬間に横へ擦ると回転'; }
    else if (state === 'over')  { msg = 'GAME OVER'; sub = `最高 ${bestRally} ラリー / タップでもう一度`; }
    else if (state === 'clear') { msg = 'CLEAR!'; sub = 'タップでもう一度'; }
    if (msg) {
      if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H); }
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px -apple-system, "Hiragino Sans", sans-serif';
      ctx.fillText(msg, W / 2, H * 0.58);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = '13px -apple-system, "Hiragino Sans", sans-serif';
      ctx.fillText(sub, W / 2, H * 0.58 + 30);
    }
  }

  // ---- 調整パネル ----
  const sliderBox = document.getElementById('sliders');
  const inputs = {};
  const decimals = step => (String(step).split('.')[1] || '').length;

  for (const s of SLIDERS) {
    if (s.group) {
      const h = document.createElement('h3'); h.textContent = s.group; sliderBox.appendChild(h);
      continue;
    }
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML =
      `<div class="lab"><b>${s.label}</b><span></span></div>` +
      `<div class="key">${s.key}</div>` +
      `<input type="range" min="${s.min}" max="${s.max}" step="${s.step}">`;
    const input = row.querySelector('input');
    const val = row.querySelector('span');
    const show = () => { val.textContent = Number(CFG[s.key]).toFixed(decimals(s.step)); };
    input.value = CFG[s.key];
    show();
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      applyChange(s.key, v);
      show();
      saveCfg();
    });
    inputs[s.key] = { input, show };
    sliderBox.appendChild(row);
  }

  // 値の変更をプレイ中のボール・パドルへ即反映
  function applyChange(key, v) {
    const old = CFG[key];
    CFG[key] = v;
    if (key === 'paddleW' && paddle) layoutPaddle();
    if (key === 'maxSpeed' && ball && state === 'play' && speedOf() > H * v) setSpeed(H * v);
    if (key === 'maxSpin' && ball) clampSpin();
    if (key === 'volume' || key === 'muted') SFX.setVolume();
  }

  const pauseBtn = document.getElementById('pauseBtn');
  function setPaused(p) {
    paused = p;
    pauseBtn.textContent = p ? '▶ 再開' : '⏸ ポーズ';
    pauseBtn.classList.toggle('on', p);
  }
  pauseBtn.addEventListener('click', () => { SFX.init(); setPaused(!paused); });

  const muteBtn = document.getElementById('muteBtn');
  function showMute() {
    muteBtn.textContent = CFG.muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('on', CFG.muted);
  }
  muteBtn.addEventListener('click', () => {
    SFX.init();
    applyChange('muted', !CFG.muted);
    showMute();
    saveCfg();
  });
  showMute();
  // パネル操作でも音を有効化
  document.getElementById('panel').addEventListener('touchstart', () => SFX.init(), { passive: true });
  document.getElementById('resetBtn').addEventListener('click', () => {
    for (const k in DEFAULTS) {
      if (k === 'muted') continue; // ミュート状態は初期化しない
      applyChange(k, DEFAULTS[k]);
      if (inputs[k]) { inputs[k].input.value = DEFAULTS[k]; inputs[k].show(); }
    }
    saveCfg();
  });
  document.getElementById('restartBtn').addEventListener('click', () => { newGame(); setPaused(false); });
  // アプリ切替などで非表示になったら自動ポーズ
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPaused(true); });

  // 回転メーター
  const spinVal = document.getElementById('spinVal');
  const spinFill = document.getElementById('spinFill');
  let lastMeter = null;
  const speedVal = document.getElementById('speedVal');
  const speedFill = document.getElementById('speedFill');
  const beamMark = document.getElementById('beamMark');
  let lastSpeedTxt = null;
  function updateSpeedMeter() {
    const v = state === 'play' ? speedOf() / H : 0;
    const txt = v.toFixed(2);
    if (txt === lastSpeedTxt) return;
    lastSpeedTxt = txt;
    const max = Math.max(CFG.maxSpeed, 0.1);
    speedVal.textContent = state === 'play' ? `${txt}（ダメージ ${damageAt(v * H)}）` : txt;
    speedFill.style.width = Math.min(100, v / max * 100) + '%';
    speedFill.style.background = v >= CFG.beamSpeed ? `rgb(${beamColor((v - CFG.beamSpeed) / Math.max(max - CFG.beamSpeed, 0.01)).join(',')})` : '#8890b0';
    beamMark.style.left = Math.min(100, CFG.beamSpeed / max * 100) + '%';
  }

  function updateMeter() {
    updateSpeedMeter();
    const ratio = Math.max(-1, Math.min(1, ball.spin / (H * Math.max(CFG.maxSpin, 0.01))));
    const pct = Math.round(ratio * 100);
    if (pct === lastMeter) return;
    lastMeter = pct;
    spinVal.textContent = pct + '%';
    spinFill.style.width = Math.abs(ratio) * 50 + '%';
    spinFill.style.left = ratio >= 0 ? '50%' : (50 - Math.abs(ratio) * 50) + '%';
    spinFill.style.background = ratio >= 0 ? BALL_COLOR_B : BALL_COLOR_A;
  }

  // ---- ループ ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!paused) update(dt);
    draw();
    updateMeter();
    requestAnimationFrame(loop);
  }

  resize();
  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
